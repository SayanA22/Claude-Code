<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's for Dinner?</title>
<meta name="theme-color" content="#ea580c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dinner Ideas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>try{var t=localStorage.getItem("dinnerTheme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  :root{--bg:#fafaf9;--card:#fff;--ink:#1c1917;--muted:#78716c;--accent:#f97316;--accent-ink:#fff;
    --soft:#f5f5f4;--line:#e7e5e4;--yes:#16a34a;--no:#ef4444;--shadow:0 10px 30px rgba(28,25,23,.12)}
  :root{--blob1:#ffedd5;--blob2:#fed7aa;color-scheme:light}
  :root[data-theme="dark"]{--bg:#141210;--card:#211e1b;--ink:#fafaf9;--muted:#a8a29e;--accent:#fb923c;--accent-ink:#1c1917;--soft:#2c2825;--line:#3a3532;--shadow:0 10px 30px rgba(0,0,0,.5);--blob1:#5a3a24;--blob2:#3a2518;color-scheme:dark}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141210;--card:#211e1b;--ink:#fafaf9;--muted:#a8a29e;--accent:#fb923c;--accent-ink:#1c1917;--soft:#2c2825;--line:#3a3532;--shadow:0 10px 30px rgba(0,0,0,.5);--blob1:#5a3a24;--blob2:#3a2518;color-scheme:dark}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none;
    font:18px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;max-width:520px;width:100%;margin:0 auto}
  header h1{font-size:1.2rem;margin:0;letter-spacing:-.02em}
  header nav{display:flex;gap:6px}
  header h1{white-space:nowrap}
  .ib{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--soft);font-size:1.2rem;color:var(--ink)}
  .filters{max-width:520px;width:100%;margin:0 auto;padding:6px 18px 0}
  .scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
  .scroll::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;background:var(--soft);color:var(--muted);border-radius:999px;padding:9px 16px;font-size:.9rem}
  .chip.on{background:var(--ink);color:var(--bg);font-weight:600}
  .chip.t.on{background:var(--accent);color:var(--accent-ink)}
  #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 18px 18px;min-height:0}
  .deck{position:relative;width:100%;max-width:380px;aspect-ratio:3/4;max-height:100%}
  .card{position:absolute;inset:0;background:var(--card);border-radius:32px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    touch-action:pan-y;user-select:none;will-change:transform}
  .card.back{transform:scale(.94) translateY(14px);opacity:.6;box-shadow:none;pointer-events:none}
  .blob{width:min(52vw,210px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:min(26vw,110px);background:radial-gradient(circle at 30% 25%,var(--blob1),var(--blob2));margin-bottom:22px}
  .card h2{margin:0;font-size:1.75rem;letter-spacing:-.02em;line-height:1.15}
  .card .note{color:var(--muted);margin:8px 0 14px;font-size:.95rem}
  .meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .tag{background:var(--soft);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:.8rem}
  .heart{position:absolute;top:16px;right:16px;border:0;background:var(--soft);width:44px;height:44px;border-radius:50%;font-size:1.3rem;color:var(--muted)}
  .heart.on{color:#ef4444}
  .stamp{position:absolute;top:26px;padding:6px 14px;border:3px solid;border-radius:12px;font-weight:800;font-size:1.3rem;
    letter-spacing:.05em;opacity:0;pointer-events:none;transform:rotate(-12deg)}
  .stamp.yes{left:22px;color:var(--yes)} .stamp.no{right:22px;color:var(--no);transform:rotate(12deg)}
  .actions{display:flex;gap:28px;margin-top:18px}
  .round{width:68px;height:68px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:1.7rem}
  .round.yes{background:var(--yes);color:#fff}
  .hintline{color:var(--muted);font-size:.8rem;margin-top:10px;text-align:center}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .empty .big{font-size:4rem}
  .sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding:env(safe-area-inset-top) 18px 40px}
  .sheet .in{max-width:520px;margin:0 auto}
  .sheet .top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
  .sheet h1{margin:0;font-size:1.5rem}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .item .e{font-size:1.9rem}.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:1rem}
  .item .t small{color:var(--muted)}
  .icon{border:0;background:none;font-size:1.3rem;padding:6px;color:var(--muted)}.icon.on{color:#ef4444}
  input,select{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:0;background:var(--soft);color:var(--ink);margin:6px 0 14px}
  label{font-size:.85rem;color:var(--muted)}
  .btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-size:1.05rem;font-weight:700;background:var(--accent);color:var(--accent-ink);margin:10px 0}
  .btn.alt{background:var(--soft);color:var(--ink)}
  .sub{color:var(--muted);margin:0 0 12px;font-size:.9rem}
  .toast{position:fixed;left:50%;bottom:90px;width:max-content;max-width:88vw;text-align:center;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);
    padding:12px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:20;font-size:.95rem;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header><h1>Dinner ideas</h1><nav><button class="ib" id="theme" aria-label="Dark mode">🌙</button><button class="ib" data-open="favs" aria-label="Favorites">♥</button><button class="ib" data-open="list" aria-label="All ideas">☰</button><button class="ib" data-open="add" aria-label="Add">＋</button></nav></header>
<div class="filters" id="filters"></div>
<div id="stage"></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast"></div>
<script>
const BUILTIN = [
  // [emoji, name, meal, minutes, note]  (all vegetarian, no eggs)
  ["🥞","Pancakes","Breakfast",25,"Add fruit or syrup"],
  ["🥣","Oatmeal with fruit","Breakfast",10,"Warm and easy"],
  ["🍞","Cinnamon toast","Breakfast",10,"Quick and cozy"],
  ["🥑","Avocado toast","Breakfast",10,"Add tomato or chili flakes"],
  ["🥤","Fruit smoothie bowl","Breakfast",10,"Blend, top, enjoy"],
  ["🥯","Bagel with cream cheese","Breakfast",5,"Add tomato and cucumber"],
  ["🧇","Waffles with berries","Breakfast",20,"Fresh fruit on top"],
  ["🥣","Granola & yogurt","Breakfast",5,"No cooking at all"],
  ["🍚","Poha","Breakfast",20,"Flattened rice with peanuts"],
  ["🥣","Upma","Breakfast",20,"Savory semolina with veggies"],
  ["🫓","Aloo paratha","Breakfast",35,"Potato-stuffed flatbread with yogurt"],
  ["🥞","Dosa with chutney","Breakfast",30,"Crispy rice crepe"],
  ["🍚","Idli & sambar","Breakfast",30,"Steamed rice cakes with lentil stew"],
  ["🥪","Grilled cheese & tomato soup","Lunch",15,"Comfort classic"],
  ["🥪","Caprese sandwich","Lunch",10,"Tomato, mozzarella and basil"],
  ["🥪","Chickpea salad sandwich","Lunch",15,"Mashed chickpeas, easy and filling"],
  ["🌯","Bean & cheese burritos","Lunch",15,"Easy and cheap"],
  ["🥙","Veggie wraps with hummus","Lunch",10,"No cooking needed"],
  ["🍲","Lentil soup","Lunch",40,"Makes lots of leftovers"],
  ["🧆","Falafel pita","Lunch",30,"With cucumber and tahini"],
  ["🍅","Tomato soup","Lunch",25,"Great with crusty bread"],
  ["🥗","Quinoa veggie bowl","Lunch",25,"Colorful and healthy"],
  ["🥗","Caesar-style salad with croutons","Lunch",15,"Crunchy and filling"],
  ["🍟","Veggie nachos","Lunch",15,"Beans, cheese and salsa"],
  ["🍚","Curd rice","Lunch",15,"Cool yogurt rice"],
  ["🍋","Lemon rice","Lunch",20,"Tangy with peanuts"],
  ["🌮","Tacos","Dinner",25,"Beans, peppers, cheese, salsa"],
  ["🌮","Black bean tacos","Dinner",25,"Let everyone build their own"],
  ["🫔","Veggie fajitas","Dinner",25,"Sizzling peppers and onions"],
  ["🥙","Burrito bowls","Dinner",25,"Rice, beans, corn, guacamole"],
  ["🍝","Spaghetti with marinara","Dinner",30,"Simple and everyone likes it"],
  ["🍝","Spaghetti with lentil marinara","Dinner",35,"Hearty, no meat needed"],
  ["🍝","Pesto pasta","Dinner",20,"Add cherry tomatoes"],
  ["🍝","Fettuccine Alfredo","Dinner",25,"Creamy and rich"],
  ["🍝","Pasta primavera","Dinner",25,"Lots of fresh veggies"],
  ["🍝","Baked ziti","Dinner",50,"Lots of cheese"],
  ["🧀","Veggie lasagna","Dinner",70,"Spinach and ricotta"],
  ["🍕","Homemade veggie pizza","Dinner",45,"Fun and customizable"],
  ["🍔","Veggie burgers","Dinner",25,"Black bean or lentil patties"],
  ["🧀","Macaroni & cheese","Dinner",30,"Comfort food"],
  ["🍆","Eggplant parmesan","Dinner",60,"Cheesy favorite"],
  ["🍄","Mushroom stroganoff","Dinner",35,"Creamy over noodles"],
  ["🍲","Three-bean chili","Dinner",60,"Great the next day too"],
  ["🥔","Loaded baked potatoes","Dinner",60,"Top with beans and cheese"],
  ["🥬","Stuffed bell peppers","Dinner",55,"Rice, beans and cheese"],
  ["🫓","Veggie quesadillas","Dinner",15,"Ready in minutes"],
  ["🥔","Roasted veggies & potatoes","Dinner",40,"Toss it all on one pan"],
  ["🥗","Big Greek salad with pita","Dinner",20,"Light, no oven"],
  ["🍜","Veggie noodle soup","Dinner",35,"Warm and gentle"],
  ["🍜","Veggie ramen","Dinner",25,"Noodles, greens and mushrooms"],
  ["🍜","Pad Thai with tofu","Dinner",30,"Peanuts and lime"],
  ["🍚","Veggie fried rice","Dinner",20,"Perfect for leftover rice"],
  ["🥘","Vegetable stir-fry with tofu","Dinner",20,"Quick, lots of veggies"],
  ["🍱","Veggie sushi rolls","Dinner",40,"Cucumber, avocado, carrot"],
  ["🥟","Veggie dumplings","Dinner",30,"Steamed or pan-fried"],
  ["🍛","Chana masala","Dinner",35,"Chickpea curry with rice or roti"],
  ["🧀","Paneer butter masala","Dinner",35,"Creamy tomato curry with paneer"],
  ["🥬","Palak paneer","Dinner",35,"Spinach curry with paneer"],
  ["🥔","Aloo gobi","Dinner",35,"Potato and cauliflower"],
  ["🍛","Rajma chawal","Dinner",50,"Kidney bean curry and rice"],
  ["🍛","Dal tadka & rice","Dinner",35,"Spiced lentils, simple and satisfying"],
  ["🍲","Khichdi","Dinner",30,"Rice and lentils, very comforting"],
  ["🍚","Vegetable biryani","Dinner",60,"Fragrant spiced rice"],
  ["🍚","Vegetable pulao","Dinner",35,"Easy one-pot rice"],
  ["🍆","Baingan bharta","Dinner",45,"Smoky roasted eggplant"],
  ["🥘","Veggie curry with naan","Dinner",35,"Use whatever veggies you have"],
  ["🍪","Chocolate chip cookies","Dessert",30,"Always a hit"],
  ["🍎","Baked apples with cinnamon","Dessert",35,"Warm and simple"],
  ["🍮","Kheer","Dessert",40,"Rice pudding with cardamom"],
  ["🍨","Ice cream with fruit","Dessert",5,"Zero effort"],
  ["🍌","Banana bread","Dessert",65,"Uses up ripe bananas"],
  ["🍩","Gulab jamun","Dessert",45,"Sweet and syrupy"],
  ["🍫","Brownies","Dessert",40,"Fudgy and chocolatey"],
  ["🧁","Yogurt with honey & nuts","Snack",5,"Quick bite"],
  ["🍿","Popcorn","Snack",5,"Movie night"],
  ["🥜","Apple slices with peanut butter","Snack",5,"Healthy snack"],
  ["🥟","Samosas","Snack",45,"Crispy and spicy"],
  ["🧀","Cheese & crackers","Snack",5,"Simple plate"],
  ["🥨","Hummus with pita & veggies","Snack",5,"Dip and crunch"],
  ["🍟","French fries","Snack",30,"Crispy, with ketchup"]
].map((m,i)=>({id:"v"+i,emoji:m[0],name:m[1],meal:m[2],mins:m[3],note:m[4]}));

const MEALS = ["Any","Breakfast","Lunch","Dinner","Dessert","Snack"];
const EFFORT = [["Any",9999],["Quick (under 30 min)",30],["Under an hour",60]];

// ---- storage ----
const KEY = "dinnerIdeas.v1";
let S = { custom:[], favs:[], hidden:[], made:{}, mealF:"Dinner", effortF:0, current:null };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const all = () => [...BUILTIN, ...S.custom].filter(m => !S.hidden.includes(m.id));
const find = id => [...BUILTIN, ...S.custom].find(m => m.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins = m => m.mins >= 60 ? (m.mins/60).toFixed(m.mins%60?1:0).replace(".0","")+" hr" : m.mins+" min";

function ago(id){
  const t = S.made[id]; if(!t) return null;
  const d = Math.floor((Date.now()-t)/864e5);
  return d<=0 ? "today" : d===1 ? "yesterday" : d<14 ? d+" days ago" : Math.round(d/7)+" weeks ago";
}

function pool(){
  const max = EFFORT[S.effortF][1];
  return all().filter(m => (S.mealF==="Any"||m.meal===S.mealF) && m.mins<=max);
}

// ---- views ----
const $ = s => document.querySelector(s);
const stage = $("#stage"), filters = $("#filters"), sheet = $("#sheet");
let deckIds = [];

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("show"),1800);
}

function buildDeck(){
  const p = pool();
  // shuffle, weighted toward meals not made recently
  deckIds = p.map(m=>{
    const days = S.made[m.id] ? (Date.now()-S.made[m.id])/864e5 : 60;
    return [m.id, Math.random()*(1+Math.min(days,60))];
  }).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
function topMeal(){ while(deckIds.length && !find(deckIds[0])) deckIds.shift(); return deckIds[0] && find(deckIds[0]); }

function cardHTML(m, back){
  const a = ago(m.id);
  return `<div class="card ${back?"back":""}" ${back?"":'id="top"'}>
    ${back?"":`<button class="heart ${S.favs.includes(m.id)?"on":""}" id="heart" aria-label="Favorite">${S.favs.includes(m.id)?"♥":"♡"}</button>
    <div class="stamp yes">YES!</div><div class="stamp no">NOPE</div>`}
    <div class="blob">${m.emoji}</div>
    <h2>${esc(m.name)}</h2>
    <div class="note">${esc(m.note||"")}</div>
    <div class="meta"><span class="tag">${esc(m.meal)}</span><span class="tag">⏱ ${mins(m)}</span>${a?`<span class="tag">Made ${a}</span>`:""}</div>
  </div>`;
}

function renderFilters(){
  filters.innerHTML = `<div class="scroll">${MEALS.map(x=>`<button class="chip ${x===S.mealF?"on":""}" data-meal="${x}">${x}</button>`).join("")}</div>
  <div class="scroll">${EFFORT.map((x,i)=>`<button class="chip t ${i===S.effortF?"on":""}" data-effort="${i}">${i?"⏱ ":""}${x[0].replace(" (under 30 min)"," · 30 min")}</button>`).join("")}</div>`;
}

function renderDeck(){
  const m = topMeal();
  if(!m){
    stage.innerHTML = `<div class="empty"><div class="big">${pool().length?"🎉":"🤔"}</div>
      <p>${pool().length?"You've seen everything here!":"Nothing matches those filters."}</p>
      <button class="btn" id="again">${pool().length?"Start over":"Show all meals"}</button></div>`;
    return;
  }
  const next = deckIds[1] && find(deckIds[1]);
  stage.innerHTML = `<div class="deck">${next?cardHTML(next,true):""}${cardHTML(m,false)}</div>
    <div class="actions">
      <button class="round" id="no" aria-label="Skip">✕</button>
      <button class="round yes" id="yes" aria-label="Make this">✓</button>
    </div>
    <div class="hintline">Swipe right to pick · left to skip</div>`;
  attachSwipe();
}

function decide(yes){
  const el=$("#top"); const m=topMeal(); if(!el||!m) return;
  el.style.transition="transform .3s, opacity .3s";
  el.style.transform=`translateX(${yes?500:-500}px) rotate(${yes?25:-25}deg)`; el.style.opacity=0;
  setTimeout(()=>{
    deckIds.shift();
    if(yes){ S.made[m.id]=Date.now(); save(); toast(`Great choice! Enjoy the ${m.name.toLowerCase()} 🍽️`); }
    renderDeck();
  },260);
}

function attachSwipe(){
  const el=$("#top"); if(!el) return;
  let sx=0, dx=0, drag=false, moved=false;
  const yes=el.querySelector(".stamp.yes"), no=el.querySelector(".stamp.no");
  el.addEventListener("pointerdown",e=>{ if(e.target.closest("#heart")) return; drag=true; moved=false; sx=e.clientX; el.setPointerCapture(e.pointerId); el.style.transition="none"; });
  el.addEventListener("pointermove",e=>{ if(!drag) return; dx=e.clientX-sx; if(Math.abs(dx)>6) moved=true;
    el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    yes.style.opacity=Math.max(0,dx/110); no.style.opacity=Math.max(0,-dx/110); });
  const end=()=>{ if(!drag) return; drag=false;
    if(dx>110) decide(true); else if(dx<-110) decide(false);
    else { el.style.transition="transform .25s"; el.style.transform=""; yes.style.opacity=no.style.opacity=0; }
    dx=0; };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
}

stage.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="yes") decide(true);
  else if(t.id==="no") decide(false);
  else if(t.id==="heart"){ const m=topMeal(); toggleFav(m.id); t.classList.toggle("on"); t.textContent=S.favs.includes(m.id)?"♥":"♡"; }
  else if(t.id==="again"){ if(!pool().length){ S.mealF="Any"; S.effortF=0; save(); renderFilters(); } buildDeck(); renderDeck(); }
});

filters.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.meal) S.mealF=t.dataset.meal;
  else if(t.dataset.effort) S.effortF=+t.dataset.effort; else return;
  save(); renderFilters(); buildDeck(); renderDeck();
});

// ---- sheets ----
function itemRow(m, actions){
  const a = ago(m.id);
  return `<div class="item"><div class="e">${m.emoji}</div>
    <div class="t"><b>${esc(m.name)}</b><small>${esc(m.meal)} · ${mins(m)}${a?" · made "+a:""}</small></div>${actions}</div>`;
}
const favBtn = id => `<button class="icon ${S.favs.includes(id)?"on":""}" data-fav="${id}">${S.favs.includes(id)?"♥":"♡"}</button>`;
let sheetName = null;

function sheetBody(){
  if(sheetName==="list"){
    const q=(window._q||"").toLowerCase();
    const items=all().filter(m=>!q||m.name.toLowerCase().includes(q)||m.meal.toLowerCase().includes(q));
    return `<h1>All ideas</h1><p class="sub">${all().length} meals</p>
      <input id="q" type="search" placeholder="Search…" value="${esc(window._q||"")}">
      ${items.map(m=>itemRow(m,favBtn(m.id)+`<button class="icon" data-hide="${m.id}" aria-label="Hide">🚫</button>`)).join("")||'<p class="empty">No matches.</p>'}
      ${S.hidden.length?`<button class="btn alt" data-act="unhide">Bring back ${S.hidden.length} hidden</button>`:""}`;
  }
  if(sheetName==="favs"){
    const items=S.favs.map(find).filter(m=>m&&!S.hidden.includes(m.id));
    return `<h1>Favorites</h1><p class="sub">Meals you love</p>`+
      (items.map(m=>itemRow(m,favBtn(m.id))).join("")||'<p class="empty"><span class="big">♡</span><br>Tap the heart on any card to save it here.</p>');
  }
  return `<h1>Add your own</h1><p class="sub">Family recipes and favorites</p>
    <label>Meal name</label><input id="n" placeholder="e.g. Grandma's rice and beans">
    <label>Type</label><select id="m">${MEALS.slice(1).map(x=>`<option ${x==="Dinner"?"selected":""}>${x}</option>`).join("")}</select>
    <label>Minutes to make</label><input id="t" type="number" inputmode="numeric" min="1" value="30">
    <label>Note (optional)</label><input id="o" placeholder="e.g. marinate overnight">
    <button class="btn" data-act="add">Add this meal</button>
    ${S.custom.length?`<p class="sub" style="margin-top:20px">Your meals</p>`+S.custom.map(m=>itemRow(m,`<button class="icon" data-del="${m.id}">🗑</button>`)).join(""):""}`;
}
function openSheet(n){ sheetName=n; renderSheet(); sheet.hidden=false; sheet.scrollTop=0; }
function renderSheet(){
  sheet.innerHTML=`<div class="in"><div class="top"><button class="ib" data-close aria-label="Back">←</button></div>${sheetBody()}</div>`;
}
function closeSheet(){ sheet.hidden=true; buildDeck(); renderDeck(); }

function toggleFav(id){ S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id]; save(); }

document.querySelector("header nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-open]"); if(b) openSheet(b.dataset.open);
});
sheet.addEventListener("input",e=>{
  if(e.target.id==="q"){ window._q=e.target.value; const p=e.target.selectionStart; renderSheet();
    const q=$("#q"); q.focus(); q.setSelectionRange(p,p); }
});
sheet.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return; const d=t.dataset;
  if(d.close!==undefined) return closeSheet();
  if(d.fav) toggleFav(d.fav);
  else if(d.hide){ S.hidden.push(d.hide); save(); toast("Hidden. Bring it back anytime."); }
  else if(d.del){ if(!confirm("Delete this meal?")) return; S.custom=S.custom.filter(m=>m.id!==d.del); S.favs=S.favs.filter(x=>x!==d.del); save(); }
  else if(d.act==="unhide"){ S.hidden=[]; save(); }
  else if(d.act==="add"){
    const name=$("#n").value.trim(); if(!name){ toast("Please type a meal name"); return; }
    const m={id:"c"+Date.now(),emoji:"🍽️",name,meal:$("#m").value,mins:Math.max(1,parseInt($("#t").value)||30),note:$("#o").value.trim()};
    S.custom.push(m); S.favs.push(m.id); save(); toast("Added! ♥ Saved to favorites");
  } else return;
  renderSheet();
});

// ---- theme ----
function isDark(){
  const t=document.documentElement.dataset.theme;
  return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
function paintTheme(){
  const d=isDark();
  $("#theme").textContent=d?"☀️":"🌙"; $("#theme").setAttribute("aria-label",d?"Light mode":"Dark mode");
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=d?"#141210":"#f97316";
}
$("#theme").addEventListener("click",()=>{
  const next=isDark()?"light":"dark";
  document.documentElement.dataset.theme=next;
  try{ localStorage.setItem("dinnerTheme",next); }catch(e){}
  paintTheme();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paintTheme);

paintTheme(); renderFilters(); buildDeck(); renderDeck();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
