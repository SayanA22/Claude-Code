const RECIPES = {"Pancakes":[4,"1½ cups flour|3 tsp baking powder|1 tbsp sugar|¼ tsp salt|1½ cups milk|3 tbsp oil or melted butter|1 tsp vanilla|Oil or butter for the pan","Mix the flour, baking powder, sugar and salt in a bowl.|Add the milk, oil and vanilla. Stir until just combined. A few small lumps are fine.|Let the batter rest for 5 minutes.|Heat a lightly oiled pan on medium. Pour in ¼ cup of batter for each pancake.|Flip when bubbles form on top and the edges look set, about 2 minutes. Cook 1 minute more.|Serve with fruit, syrup or honey."],"Oatmeal with fruit":[2,"1 cup rolled oats|2 cups milk or water|Pinch of salt|1 banana, sliced, or a handful of berries|1 tbsp honey or maple syrup|Cinnamon|Chopped nuts (optional)","Put the oats, milk and salt in a small pot.|Bring to a gentle simmer and cook 5 minutes, stirring often, until thick and creamy.|Spoon into bowls and top with fruit, honey, cinnamon and nuts."],"Cinnamon toast":[2,"4 slices bread|2 tbsp soft butter|2 tbsp sugar|1 tsp cinnamon","Mix the sugar and cinnamon in a small bowl.|Toast the bread.|Spread butter on the hot toast, then sprinkle with the cinnamon sugar.|For a crisp top, broil for 1 minute. Watch closely so it doesn't burn."],"Avocado toast":[2,"2 slices bread|1 ripe avocado|Juice of ½ lemon|Salt and pepper|Chili flakes (optional)|Sliced tomato (optional)","Toast the bread.|Mash the avocado with the lemon juice and a pinch of salt.|Spread on the toast.|Top with tomato, pepper and chili flakes."],"Fruit smoothie bowl":[1,"2 frozen bananas|1 cup frozen berries or mango|¼ to ½ cup yogurt or milk|Toppings: granola, sliced fruit, seeds, honey","Blend the frozen fruit with a splash of yogurt or milk. Add liquid a little at a time so it stays thick like soft ice cream.|Pour into a bowl.|Top with granola, fruit, seeds and a drizzle of honey. Eat right away."],"Bagel with cream cheese":[2,"2 bagels|Cream cheese|Sliced tomato|Sliced cucumber|Salt and pepper","Slice the bagels and toast them.|Spread with cream cheese.|Top with tomato and cucumber, then add salt and pepper."],"Waffles with berries":[4,"2 cups flour|1 tbsp sugar|4 tsp baking powder|½ tsp salt|1½ cups milk|⅓ cup oil or melted butter|1 tsp vanilla|Berries and syrup to serve","Heat your waffle iron.|Whisk the dry ingredients together. Stir in the milk, oil and vanilla until just mixed.|Grease the iron if needed. Pour in batter and cook until golden and crisp, following your iron's directions.|Top with berries and syrup."],"Granola & yogurt":[1,"1½ cups yogurt|¾ cup granola|Fresh fruit|Honey","Spoon half the yogurt into a bowl or glass.|Add fruit and granola, then repeat the layers.|Drizzle with honey."],"Poha":[3,"2 cups thick poha (flattened rice)|1 tbsp oil|1 tsp mustard seeds|1 onion, chopped|2 green chilies, chopped|¼ cup peanuts|8 curry leaves|½ tsp turmeric|Salt and a pinch of sugar|Lemon juice and chopped cilantro","Rinse the poha in a colander under water for 1 to 2 minutes until soft. Drain well and sprinkle with salt and sugar.|Heat the oil. Add mustard seeds and let them pop.|Add the peanuts, curry leaves and chilies. Cook 1 minute.|Add the onion and cook until soft. Stir in the turmeric.|Add the poha and mix gently for 2 minutes until heated through.|Finish with lemon juice and cilantro."],"Upma":[3,"1 cup semolina (rava)|2 tbsp oil|1 tsp mustard seeds|1 onion, chopped|1 carrot, diced, and a handful of peas|2 green chilies|1 tsp grated ginger|2½ cups hot water|Salt|Lemon juice and cilantro","Dry roast the semolina in a pan for 3 to 4 minutes until fragrant. Set aside.|Heat the oil, add the mustard seeds, then the onion, chilies and ginger. Cook 3 minutes.|Add the carrot and peas and cook 2 minutes.|Pour in the hot water and salt and bring to a boil.|Lower the heat. Pour in the semolina in a thin stream, stirring constantly so it doesn't clump.|Cover for 2 minutes. Finish with lemon juice and cilantro."],"Aloo paratha":[4,"Dough: 2 cups whole wheat flour, ½ tsp salt, 1 tbsp oil, water|Filling: 3 boiled potatoes, mashed|1 tsp cumin seeds|½ tsp chili powder|½ tsp garam masala|1 green chili, chopped|Chopped cilantro and salt|Oil or ghee for cooking|Yogurt or pickle to serve","Knead the flour, salt, oil and enough water into a soft dough. Rest 20 minutes.|Mix the potatoes with the spices, chili, cilantro and salt.|Roll a ball of dough into a small circle. Put a spoonful of filling in the middle, pinch the edges closed, then gently roll out flat.|Cook on a hot pan with a little oil until golden spots appear on both sides.|Serve hot with yogurt or pickle."],"Dosa with chutney":[3,"2 cups ready dosa batter (store-bought or homemade)|Water to thin|Salt|Oil|Coconut chutney or sambar to serve","Stir a little water and salt into the batter until it's thin and pourable.|Heat a nonstick pan on medium and wipe it with a little oil.|Pour a ladle of batter in the middle and spread it in a circle with the back of the ladle.|Drizzle a little oil on top and cook until crisp and golden.|Fold and serve right away with chutney or sambar."],"Idli & sambar":[4,"Idli: 2 cups ready idli batter|Sambar: ½ cup toor dal|1 tomato|1 cup mixed vegetables (carrot, drumstick, pumpkin)|1 tbsp sambar powder|1 tbsp tamarind paste or lemon juice|1 tsp mustard seeds, curry leaves|1 tbsp oil, salt","Cook the dal with 2 cups water until very soft (about 3 whistles in a pressure cooker or 30 minutes on the stove). Mash it.|Grease the idli moulds, fill with batter and steam for 10 to 12 minutes.|Simmer the vegetables and tomato in water with the sambar powder until tender.|Add the mashed dal, tamarind and salt. Simmer 5 minutes.|Heat the oil, pop the mustard seeds, add curry leaves, and pour over the sambar.|Serve the hot idlis with the sambar."],"Grilled cheese & tomato soup":[2,"Sandwiches: 4 slices bread, 4 slices cheese, butter|Soup: 1 can (28 oz) crushed tomatoes|1 cup vegetable broth|1 small onion, chopped|2 garlic cloves|1 tbsp butter or oil|½ tsp sugar, salt and pepper","Soup: cook the onion and garlic in butter for 3 minutes.|Add the tomatoes, broth, sugar, salt and pepper. Simmer 15 minutes. Blend if you like it smooth.|Sandwiches: butter the outsides of the bread and put cheese inside.|Cook in a pan on medium-low for 3 minutes per side until golden and melted.|Serve the sandwiches with the soup for dipping."],"Caprese sandwich":[2,"4 slices ciabatta or crusty bread|2 tomatoes, sliced|8 oz fresh mozzarella, sliced|Fresh basil leaves|Olive oil|Balsamic glaze or vinegar|Salt and pepper","Drizzle the bread with olive oil. Toast it if you like.|Layer mozzarella, tomato and basil. Add salt and pepper.|Drizzle with balsamic and close the sandwich. Press down gently and slice."],"Chickpea salad sandwich":[3,"1 can (15 oz) chickpeas, drained|3 tbsp plain yogurt or eggless mayo|1 celery stalk, chopped|2 tbsp chopped onion|1 tsp mustard|Lemon juice, salt and pepper|Bread, lettuce and tomato","Mash the chickpeas with a fork, leaving some texture.|Mix in the yogurt, celery, onion, mustard, a squeeze of lemon, salt and pepper.|Pile onto bread with lettuce and tomato."],"Bean & cheese burritos":[4,"4 large tortillas|1 can (15 oz) refried or black beans|1 cup shredded cheese|1 cup cooked rice|Salsa|Lettuce (optional)","Warm the beans in a pot, mashing them as they heat.|Warm the tortillas for 20 seconds in a dry pan or the microwave.|Spoon beans, rice, cheese and salsa down the middle. Fold in the sides and roll up.|Toast seam-side down in a pan for 1 to 2 minutes per side until golden."],"Veggie wraps with hummus":[2,"2 large wraps|½ cup hummus|1 cucumber, cut into strips|1 carrot, shredded|1 bell pepper, sliced|Handful of spinach|Feta (optional)","Spread hummus over each wrap.|Layer the vegetables down the middle.|Fold in the sides and roll up tightly. Cut in half."],"Lentil soup":[6,"1½ cups brown or green lentils, rinsed|2 tbsp oil|1 onion, 2 carrots, 2 celery stalks, chopped|3 garlic cloves|1 tsp cumin|½ tsp turmeric|1 can (14 oz) diced tomatoes|6 cups vegetable broth or water|Salt, pepper and lemon juice","Cook the onion, carrots and celery in oil for 5 minutes.|Add the garlic and spices and stir for 1 minute.|Add the lentils, tomatoes and broth. Bring to a boil.|Reduce the heat and simmer 30 minutes until the lentils are tender.|Season with salt and pepper and a squeeze of lemon."],"Falafel pita":[4,"1 can (15 oz) chickpeas, drained and patted dry|½ onion|3 garlic cloves|½ cup parsley or cilantro|1 tsp cumin, 1 tsp coriander, ½ tsp salt|3 tbsp flour, 1 tsp baking powder|4 pitas|Cucumber and tomato|Sauce: 2 tbsp tahini, lemon juice, 1 garlic clove, water","Heat the oven to 400°F (200°C).|Pulse the chickpeas, onion, garlic, herbs, spices, flour and baking powder in a food processor until coarse but holding together.|Shape into 12 small patties. Place on an oiled baking sheet and brush with oil.|Bake 20 to 25 minutes, flipping halfway, until golden.|Whisk the tahini, lemon juice, garlic and enough water for a pourable sauce.|Stuff the pitas with falafel, cucumber, tomato and sauce."],"Tomato soup":[4,"2 tbsp olive oil or butter|1 onion, chopped|3 garlic cloves|1 can (28 oz) whole or crushed tomatoes|2 cups vegetable broth|½ tsp sugar|Fresh basil|Salt and pepper|Splash of cream (optional)","Cook the onion in oil for 5 minutes until soft. Add the garlic for 1 minute.|Add the tomatoes, broth, sugar, salt and pepper. Simmer 15 minutes.|Blend until smooth. Stir in basil and a splash of cream if you like."],"Quinoa veggie bowl":[3,"1 cup quinoa|2 cups water|1 can (15 oz) chickpeas, drained|1 cup cucumber and cherry tomatoes, chopped|2 cups spinach or kale|1 avocado|Dressing: 3 tbsp olive oil, 2 tbsp lemon juice, salt, pepper","Rinse the quinoa. Simmer in the water, covered, for 15 minutes. Let it stand 5 minutes, then fluff.|Warm the chickpeas in a pan if you like.|Divide the quinoa between bowls. Add the greens, vegetables, chickpeas and avocado.|Whisk the dressing and pour over."],"Caesar-style salad with croutons":[3,"1 large head romaine, chopped|2 cups bread cubes|2 tbsp olive oil + ½ tsp garlic powder (for croutons)|Dressing: 3 tbsp olive oil, 2 tbsp lemon juice, 1 tsp Dijon mustard, 1 small garlic clove, 1 tbsp plain yogurt|3 tbsp grated vegetarian hard cheese|Black pepper","Heat the oven to 375°F (190°C). Toss the bread cubes with the oil and garlic powder and bake 10 minutes until crisp.|Whisk the dressing ingredients with the cheese and plenty of black pepper.|Toss the romaine with the dressing, then top with croutons and a little extra cheese."],"Veggie nachos":[4,"1 big bag tortilla chips|1 can (15 oz) black beans, drained|½ cup corn|1½ cups shredded cheese|Jalapeños (optional)|Toppings: salsa, sour cream, guacamole, chopped tomato","Heat the oven to 400°F (200°C).|Spread the chips on a baking sheet. Scatter beans, corn and jalapeños over, then cover with cheese.|Bake 8 to 10 minutes until the cheese is melted and bubbly.|Top with salsa, sour cream and guacamole."],"Curd rice":[2,"1 cup cooked rice, soft|1 cup plain yogurt|½ cup milk|Salt|Tempering: 1 tsp oil, ½ tsp mustard seeds, 1 green chili, 5 curry leaves, 1 tsp grated ginger|Chopped cilantro","Mash the warm rice slightly. Let it cool a bit.|Stir in the yogurt, milk and salt until creamy.|Heat the oil, pop the mustard seeds, then add the chili, curry leaves and ginger for 30 seconds.|Pour over the rice, mix, and top with cilantro."],"Lemon rice":[3,"2 cups cooked rice, cooled|2 tbsp oil|1 tsp mustard seeds|2 tbsp peanuts|2 green chilies, slit|8 curry leaves|½ tsp turmeric|Juice of 1 to 2 lemons|Salt and chopped cilantro","Heat the oil. Add the mustard seeds and let them pop.|Add the peanuts, chilies and curry leaves. Cook until the peanuts are golden.|Stir in the turmeric, then the rice and salt. Toss gently for 2 minutes.|Turn off the heat. Add the lemon juice and cilantro and mix."],"Tacos":[4,"8 small tortillas|1 can (15 oz) black or pinto beans|1 bell pepper and 1 onion, sliced|1 tbsp oil|Seasoning: 1 tsp chili powder, ½ tsp cumin, ½ tsp paprika, ½ tsp garlic powder, pinch of salt|Toppings: lettuce, tomato, cheese, salsa, sour cream, avocado, lime","Cook the pepper and onion in the oil for 5 minutes.|Add the beans, seasoning and ¼ cup water. Simmer 5 minutes, mashing some of the beans.|Warm the tortillas in a dry pan.|Fill with the beans and veggies and add your toppings."],"Black bean tacos":[4,"8 small tortillas|2 cans (15 oz) black beans|½ onion, chopped|2 garlic cloves|1 tsp cumin, 1 tsp chili powder|1 tbsp oil|Lime, cilantro|Toppings: avocado, cheese, cabbage slaw, salsa","Cook the onion in oil for 3 minutes. Add the garlic and spices for 1 minute.|Add the beans with their liquid. Simmer 8 minutes, mashing about half.|Stir in a squeeze of lime.|Warm the tortillas and fill with beans and toppings."],"Veggie fajitas":[4,"3 bell peppers, sliced|1 large onion, sliced|8 oz mushrooms, sliced|2 tbsp oil|1 tsp chili powder, 1 tsp cumin, 1 tsp paprika, ½ tsp garlic powder, ½ tsp salt|Juice of 1 lime|8 tortillas|Toppings: guacamole, sour cream, salsa","Heat the oil in a large pan on high.|Cook the vegetables with the spices for 8 to 10 minutes, stirring now and then, until browned at the edges.|Squeeze in the lime juice.|Warm the tortillas and serve with the toppings."],"Burrito bowls":[4,"3 cups cooked rice|1 can (15 oz) black beans, warmed|1 cup corn|1 avocado or guacamole|Salsa|Shredded lettuce|Shredded cheese|Lime and cilantro","Put the rice in bowls.|Add the beans, corn, lettuce and cheese in sections.|Top with avocado, salsa, cilantro and a squeeze of lime."],"Spaghetti with marinara":[4,"12 oz spaghetti|2 tbsp olive oil|4 garlic cloves, minced|1 can (28 oz) crushed tomatoes|1 tsp oregano or Italian seasoning|½ tsp sugar|Salt and pepper|Basil and grated cheese","Boil the pasta in well-salted water, following the package. Save a cup of pasta water, then drain.|Warm the garlic in the oil for 30 seconds. Add the tomatoes, herbs, sugar, salt and pepper.|Simmer 15 minutes.|Toss the pasta with the sauce, adding a splash of pasta water if needed. Top with basil and cheese."],"Spaghetti with lentil marinara":[4,"12 oz spaghetti|2 tbsp olive oil|1 onion, chopped|4 garlic cloves|1 can (28 oz) crushed tomatoes|¾ cup red lentils, rinsed|2 cups water|1 tsp Italian seasoning|Salt and pepper","Cook the onion in the oil for 5 minutes. Add the garlic for 1 minute.|Add the tomatoes, lentils, water, seasoning, salt and pepper.|Simmer 20 minutes, stirring now and then, until the lentils are soft and the sauce is thick.|Meanwhile cook the spaghetti and drain.|Serve the sauce over the pasta."],"Pesto pasta":[4,"12 oz pasta|1 cup cherry tomatoes, halved|Pesto: 2 cups basil, ⅓ cup pine nuts or walnuts, 2 garlic cloves, ½ cup olive oil, ½ cup grated vegetarian hard cheese, salt (or use a jar of pesto)","Cook the pasta and save a cup of the pasta water.|Blend the pesto ingredients until almost smooth.|Toss the hot pasta with the pesto and a splash of pasta water.|Stir in the tomatoes and serve."],"Fettuccine Alfredo":[4,"12 oz fettuccine|4 tbsp butter|3 garlic cloves, minced|1 cup heavy cream|1½ cups grated vegetarian hard cheese|Salt, pepper, pinch of nutmeg|Chopped parsley","Cook the pasta and save a cup of the pasta water.|Melt the butter and cook the garlic for 1 minute.|Add the cream and simmer 3 minutes. Stir in the cheese until smooth.|Add the pasta and toss, thinning with pasta water. Season and top with parsley."],"Pasta primavera":[4,"12 oz pasta|2 tbsp olive oil|1 zucchini, 1 bell pepper, 1 cup broccoli, 1 cup cherry tomatoes|3 garlic cloves|½ cup grated cheese|Lemon juice, basil, salt and pepper","Cook the pasta and save a cup of the pasta water.|Cook the vegetables in the oil for 6 to 8 minutes until tender-crisp. Add the garlic for the last minute.|Toss in the pasta, cheese, lemon juice and a splash of pasta water.|Top with basil."],"Baked ziti":[6,"1 lb ziti|3 cups marinara sauce|15 oz ricotta|2 cups shredded mozzarella|½ cup grated cheese|1 tsp Italian seasoning, salt","Heat the oven to 375°F (190°C).|Boil the ziti 2 minutes less than the package says. Drain.|Mix the ricotta, half the mozzarella and the seasoning.|Combine the pasta, ricotta mix and most of the sauce in a baking dish.|Top with the rest of the sauce and both cheeses.|Cover with foil and bake 20 minutes, then uncover and bake 15 minutes until bubbly."],"Veggie lasagna":[8,"9 lasagna noodles|3 cups marinara sauce|15 oz ricotta|10 oz frozen spinach, thawed and squeezed dry|2 cups shredded mozzarella|½ cup grated cheese|1 tsp Italian seasoning|Salt and pepper","Heat the oven to 375°F (190°C). Cook the noodles until just tender and drain.|Mix the ricotta, spinach, half the mozzarella, seasoning, salt and pepper.|Spread a little sauce in a baking dish. Layer noodles, ricotta mix and sauce. Repeat for 3 layers.|Top with sauce, the rest of the mozzarella and the grated cheese.|Cover and bake 30 minutes, then uncover and bake 15 minutes.|Rest 10 minutes before cutting."],"Homemade veggie pizza":[4,"1 lb store-bought pizza dough|¾ cup pizza sauce|2 cups shredded mozzarella|Toppings: bell pepper, onion, mushrooms, olives, tomato|Oregano|Olive oil and flour for rolling","Heat the oven to 475°F (245°C) with a baking sheet inside.|Roll the dough out on a floured surface to about 12 inches.|Spread with sauce, add cheese and the toppings, then sprinkle with oregano.|Slide onto the hot baking sheet and bake 12 to 15 minutes until golden and bubbly."],"Veggie burgers":[4,"1 can (15 oz) black beans, drained|¾ cup breadcrumbs|½ cup cooked rice|¼ cup finely chopped onion|2 tbsp flour|1 tsp cumin, 1 tsp smoked paprika|1 tbsp ketchup, salt|Oil for the pan|Buns and toppings","Mash the beans, leaving some whole.|Mix in everything else. The mixture should hold together when pressed.|Form 4 patties and chill 10 minutes if you have time.|Cook in a little oil on medium heat for 4 to 5 minutes per side until crisp.|Serve on buns with your favorite toppings."],"Macaroni & cheese":[4,"8 oz elbow macaroni|2 tbsp butter|2 tbsp flour|2 cups milk|2 cups shredded cheddar|½ tsp mustard powder (optional)|Salt and pepper","Boil the macaroni and drain.|Melt the butter, whisk in the flour and cook 1 minute.|Slowly whisk in the milk. Simmer 4 to 5 minutes, stirring, until thick.|Take off the heat and stir in the cheese, mustard, salt and pepper.|Mix in the macaroni."],"Eggplant parmesan":[6,"2 large eggplants, cut into ½-inch slices|Salt|¼ cup olive oil|1½ cups seasoned breadcrumbs|3 cups marinara sauce|2 cups shredded mozzarella|½ cup grated vegetarian hard cheese|Basil","Salt the slices and let them sit 15 minutes. Pat dry.|Heat the oven to 425°F (220°C).|Brush the slices with oil and press the breadcrumbs onto both sides. Bake on baking sheets 20 minutes, flipping once.|Lower the oven to 375°F (190°C). Spread a little sauce in a baking dish. Layer eggplant, sauce and mozzarella, repeating.|Top with the grated cheese and bake 20 minutes until bubbling. Add basil."],"Mushroom stroganoff":[4,"12 oz egg-free wide noodles or rice|1 lb mushrooms, sliced|1 onion, chopped|3 garlic cloves|2 tbsp butter|2 tbsp flour|1½ cups vegetable broth|1 tbsp soy sauce|1 tsp paprika|½ cup sour cream|Salt, pepper, parsley","Cook the noodles and drain.|Cook the mushrooms in the butter until browned, about 8 minutes. Add the onion and garlic and cook 3 minutes.|Stir in the flour and paprika. Add the broth and soy sauce and simmer 5 minutes until thick.|Turn off the heat and stir in the sour cream. Season to taste.|Serve over the noodles with parsley."],"Three-bean chili":[6,"2 tbsp oil|1 onion and 1 bell pepper, chopped|3 garlic cloves|3 tbsp chili powder|1 tbsp cumin, 1 tsp paprika|1 can (28 oz) crushed tomatoes|3 cans (15 oz) beans (kidney, black, pinto), drained|1 cup vegetable broth|1 cup corn (optional)|Salt|Toppings: cheese, sour cream, cilantro","Cook the onion and pepper in the oil for 5 minutes. Add the garlic and spices for 1 minute.|Add the tomatoes, beans, broth and corn.|Simmer 40 minutes, partly covered, stirring now and then.|Season with salt and serve with toppings."],"Loaded baked potatoes":[4,"4 large russet potatoes|Olive oil and salt|1 cup shredded cheddar|1 can black beans or 2 cups steamed broccoli|Sour cream|Scallions|Butter","Heat the oven to 425°F (220°C).|Scrub the potatoes, prick with a fork, then rub with oil and salt.|Bake directly on the rack for 50 to 60 minutes until tender.|Slice open and fluff the insides. Add butter, then fill with beans or broccoli, cheese, sour cream and scallions."],"Stuffed bell peppers":[4,"4 large bell peppers|1 cup cooked rice|1 can (15 oz) black beans, drained|1 cup corn|1 cup salsa or tomato sauce|1 tsp cumin, 1 tsp chili powder|1 cup shredded cheese|Salt","Heat the oven to 375°F (190°C).|Cut the tops off the peppers and remove the seeds.|Mix the rice, beans, corn, salsa, spices and half the cheese.|Stuff the peppers and stand them in a baking dish with a splash of water in the bottom.|Cover with foil and bake 30 minutes. Top with the rest of the cheese and bake uncovered 10 to 15 minutes."],"Veggie quesadillas":[2,"4 large tortillas|2 cups shredded cheese|1 bell pepper, diced|1 cup black beans or corn|1 tsp cumin|Salsa and sour cream to serve","Sprinkle cheese, pepper, beans and cumin over half of each tortilla and fold over.|Cook in a pan on medium for 2 to 3 minutes per side until crisp and the cheese melts.|Cut into wedges and serve with salsa and sour cream."],"Roasted veggies & potatoes":[4,"1½ lb potatoes, cubed|2 carrots, sliced|1 head broccoli or cauliflower, in florets|1 red onion, in wedges|3 tbsp olive oil|1 tsp paprika, 1 tsp garlic powder, 1 tsp salt|Pepper and lemon","Heat the oven to 425°F (220°C).|Toss all the vegetables with the oil and seasonings.|Spread in a single layer on two baking sheets so they brown instead of steaming.|Roast 30 to 35 minutes, flipping halfway. Squeeze lemon over the top."],"Big Greek salad with pita":[4,"2 cucumbers, chopped|4 tomatoes, chopped|1 red onion, sliced|1 bell pepper, chopped|½ cup olives|6 oz feta|4 pitas|Dressing: ¼ cup olive oil, 2 tbsp red wine vinegar, 1 tsp oregano, salt, pepper","Put the vegetables and olives in a big bowl.|Whisk the dressing and toss it through.|Top with crumbled feta.|Warm the pitas and serve alongside."],"Veggie noodle soup":[4,"1 tbsp oil|1 onion, 2 carrots, 2 celery stalks, chopped|3 garlic cloves|8 cups vegetable broth|1 tsp thyme|6 oz egg-free noodles|1 cup peas or spinach|Salt, pepper, lemon","Cook the onion, carrots and celery in the oil for 5 minutes. Add the garlic for 1 minute.|Add the broth and thyme and bring to a boil.|Add the noodles and cook until tender, about 8 minutes.|Stir in the peas or spinach. Season and add a squeeze of lemon."],"Veggie ramen":[2,"5 cups vegetable broth|2 tbsp soy sauce|1 tbsp miso paste|2 garlic cloves, 1 tbsp grated ginger|8 oz mushrooms, sliced|1 carrot, sliced thin|2 cups bok choy or spinach|2 portions ramen noodles (skip the flavor packet)|Scallions, sesame oil, chili oil","Simmer the broth with the soy sauce, garlic, ginger, mushrooms and carrot for 10 minutes.|Whisk the miso with a little hot broth and stir it back in.|Cook the noodles in a separate pot, drain, and divide between bowls.|Add the greens to the broth for 1 minute, then ladle over the noodles.|Top with scallions and a drizzle of sesame or chili oil."],"Pad Thai with tofu":[3,"8 oz rice noodles|14 oz firm tofu, pressed and cubed|2 tbsp oil|3 garlic cloves|1 cup bean sprouts|3 scallions|⅓ cup crushed peanuts|Lime wedges|Sauce: 3 tbsp soy sauce, 2 tbsp tamarind paste (or 1 tbsp rice vinegar + extra lime), 2 tbsp brown sugar, 1 tbsp sriracha","Soak the noodles in hot water for 8 to 10 minutes until flexible. Drain.|Whisk the sauce ingredients together.|Fry the tofu in the oil until golden. Add the garlic for 30 seconds.|Add the noodles and sauce and toss for 2 to 3 minutes.|Add the sprouts and scallions. Serve topped with peanuts and a squeeze of lime."],"Veggie fried rice":[3,"3 cups cooked rice, cold|2 tbsp oil|1 cup frozen peas and carrots|3 scallions, sliced|3 garlic cloves|3 tbsp soy sauce|1 tsp sesame oil|Cubed tofu (optional)","Heat the oil in a large pan on high.|Cook the garlic and the peas and carrots for 2 minutes. Add the tofu if using.|Add the cold rice and press it into the pan. Stir-fry for 4 to 5 minutes.|Add the soy sauce, sesame oil and scallions and toss."],"Vegetable stir-fry with tofu":[3,"14 oz firm tofu, pressed and cubed|2 tbsp oil|2 cups broccoli florets|1 bell pepper, 1 carrot, 1 cup snap peas|3 garlic cloves, 1 tbsp grated ginger|Sauce: 3 tbsp soy sauce, 1 tbsp cornstarch, 1 tbsp honey or sugar, 1 tbsp rice vinegar, ¼ cup water|Cooked rice to serve","Whisk the sauce ingredients.|Fry the tofu in 1 tbsp oil until golden. Set aside.|Stir-fry the vegetables in the remaining oil for 5 to 6 minutes. Add the garlic and ginger for 30 seconds.|Return the tofu, pour in the sauce and cook 1 to 2 minutes until glossy.|Serve over rice."],"Veggie sushi rolls":[4,"2 cups sushi rice|2¼ cups water|3 tbsp rice vinegar, 1 tbsp sugar, 1 tsp salt|5 nori sheets|1 cucumber, 1 carrot and 1 avocado, cut into thin strips|Soy sauce, wasabi, pickled ginger","Rinse the rice until the water runs clear. Boil with the water, cover and cook on low 15 minutes, then rest 10 minutes.|Stir in the vinegar, sugar and salt and let the rice cool.|Place a nori sheet on a bamboo mat. Spread a thin layer of rice, leaving an edge at the top.|Lay the vegetables across the bottom and roll up tightly.|Slice with a wet sharp knife and serve with soy sauce, wasabi and ginger."],"Veggie dumplings":[4,"30 dumpling wrappers (check they are egg-free)|2 cups finely chopped cabbage|1 carrot, grated|4 mushrooms, chopped|2 scallions|2 garlic cloves, 1 tbsp grated ginger|2 tbsp soy sauce, 1 tsp sesame oil|Oil for the pan|Dipping sauce: soy sauce, rice vinegar, chili","Cook the vegetables, garlic and ginger in a little oil for 4 minutes. Stir in the soy sauce and sesame oil. Cool.|Put a spoonful of filling on each wrapper, wet the edge, fold and pinch shut.|Fry the dumplings in oil for 2 minutes until the bottoms are golden.|Add ¼ cup water, cover and steam 5 minutes.|Uncover and cook until the water is gone. Serve with the dipping sauce."],"Chana masala":[4,"2 tbsp oil|1 onion, finely chopped|3 garlic cloves, 1 tbsp grated ginger|1 tsp cumin seeds|1 can (14 oz) crushed tomatoes|2 cans (15 oz) chickpeas, drained|1½ tsp coriander powder, 1 tsp cumin powder, ½ tsp turmeric, ½ tsp chili powder|1 tsp garam masala|¾ cup water, salt|Cilantro and lemon|Rice or roti to serve","Heat the oil and add the cumin seeds. Add the onion and cook until golden, about 8 minutes.|Add the garlic and ginger for 1 minute, then the tomatoes and powdered spices. Cook 8 minutes until thick.|Add the chickpeas, water and salt. Simmer 15 minutes, mashing a few chickpeas to thicken.|Stir in the garam masala, lemon and cilantro. Serve with rice or roti."],"Paneer butter masala":[4,"8 oz paneer, cubed|2 tbsp butter + 1 tbsp oil|1 onion, chopped|3 garlic cloves, 1 tbsp grated ginger|4 tomatoes, chopped (or 1 can)|8 cashews|1 tsp chili powder, 1 tsp garam masala|½ cup cream or milk|Salt and a pinch of sugar|Rice or naan to serve","Cook the onion, garlic, ginger, tomatoes and cashews in the oil with a splash of water for 10 minutes until soft.|Blend until smooth.|Melt the butter in the pan. Add the sauce, chili powder, salt and sugar and simmer 5 minutes.|Add the paneer and cream and cook 3 to 4 minutes. Stir in the garam masala.|Serve with rice or naan."],"Palak paneer":[4,"1 lb fresh spinach (or 10 oz frozen)|8 oz paneer, cubed|1 tbsp oil or ghee|1 onion, chopped|2 tomatoes, chopped|3 garlic cloves, 1 tbsp ginger|1 green chili|1 tsp cumin seeds|½ tsp garam masala|¼ cup cream or milk|Salt|Rice or roti to serve","Boil the spinach for 2 minutes, drain and cool in cold water. Blend with the chili until smooth.|Heat the oil, add the BUILTIN.forEach(m=>{ const r=RECIPES[m.name]; if(r){ m.serves=r[0]; m.ingredients=r[1].split("|").join("\n"); m.steps=r[2].split("|").join("\n"); } });

const MEALS = ["Any","Breakfast","Lunch","Dinner","Dessert","Snack"];
const EFFORT = [["Any",9999],["Quick (under 30 min)",30],["Under an hour",60]];

// ---- storage ----
const KEY = "dinnerIdeas.v1";
let S = { custom:[], favs:[], hidden:[], made:{}, mealF:"Dinner", effortF:0, tagF:"", current:null };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const all = () => [...BUILTIN, ...S.custom].filter(m => !S.hidden.includes(m.id));
const find = id => [...BUILTIN, ...S.custom].find(m => m.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hasRecipe = m => !!(m && ((m.ingredients||"").trim() || (m.steps||"").trim()));
const lines = t => String(t||"").split("\n").map(x=>x.trim()).filter(Boolean);
const mins = m => m.mins<60 ? m.mins+" min" : Math.floor(m.mins/60)+" hr"+(m.mins%60?" "+m.mins%60+" min":"");

function ago(id){
  const t = S.made[id]; if(!t) return null;
  const d = Math.floor((Date.now()-t)/864e5);
  return d<=0 ? "today" : d===1 ? "yesterday" : d<14 ? d+" days ago" : Math.round(d/7)+" weeks ago";
}

function pool(){
  const max = EFFORT[S.effortF][1];
  return all().filter(m => (S.mealF==="Any"||m.meal===S.mealF) && m.mins<=max && (!S.tagF || (m.tags||[]).includes(S.tagF)));
}

// ---- views ----
const $ = s => document.querySelector(s);
const stage = $("#stage"), filters = $("#filters"), sheet = $("#sheet");
let deckIds = [];

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("show"),1800);
}

function buildDeck(){
  const p = pool();
  // shuffle, weighted toward meals not made recently
  deckIds = p.map(m=>{
    const days = S.made[m.id] ? (Date.now()-S.made[m.id])/864e5 : 60;
    return [m.id, Math.random()*(1+Math.min(days,60))];
  }).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
function topMeal(){ while(deckIds.length && !find(deckIds[0])) deckIds.shift(); return deckIds[0] && find(deckIds[0]); }

function cardHTML(m, back){
  const a = ago(m.id);
  return `<div class="card ${back?"back":""}" ${back?"":'id="top"'}>
    ${back?"":`<button class="heart ${S.favs.includes(m.id)?"on":""}" id="heart" aria-label="Favorite">${S.favs.includes(m.id)?"♥":"♡"}</button>
    <div class="stamp yes">YES!</div><div class="stamp no">NOPE</div>`}
    <div class="blob">${m.emoji}</div>
    <h2>${esc(m.name)}</h2>
    <div class="note">${esc(m.note||"")}</div>
    <div class="meta"><span class="tag">${esc(m.meal)}</span><span class="tag">⏱ ${mins(m)}</span>${(m.tags||[]).map(t=>`<span class="tag food">${TAG_ICON[t]||""} ${esc(t)}</span>`).join("")}${a?`<span class="tag">Made ${a}</span>`:""}</div>
  </div>`;
}

function renderFilters(){
  filters.innerHTML = `<div class="scroll">${MEALS.map(x=>`<button class="chip ${x===S.mealF?"on":""}" data-meal="${x}">${x}</button>`).join("")}</div>
  <div class="scroll">${EFFORT.map((x,i)=>`<button class="chip t ${i===S.effortF?"on":""}" data-effort="${i}">${i?"⏱ ":""}${x[0].replace(" (under 30 min)"," · 30 min")}</button>`).join("")}</div>
  <div class="scroll">${Object.keys(TAGS).map(k=>`<button class="chip t ${k===S.tagF?"on":""}" data-tag="${k}">${TAG_ICON[k]} ${k}</button>`).join("")}</div>`;
}

function renderDeck(){
  const m = topMeal();
  if(!m){
    stage.innerHTML = `<div class="empty"><div class="big">${pool().length?"🎉":"🤔"}</div>
      <p>${pool().length?"You've seen everything here!":"Nothing matches those filters."}</p>
      <button class="btn" id="again">${pool().length?"Start over":"Show all meals"}</button></div>`;
    return;
  }
  const next = deckIds[1] && find(deckIds[1]);
  stage.innerHTML = `<div class="deck">${next?cardHTML(next,true):""}${cardHTML(m,false)}</div>
    <div class="actions">
      <button class="round" id="no" aria-label="Skip">✕</button>
      <button class="round yes" id="yes" aria-label="Make this">✓</button>
    </div>
    <div class="hintline">Swipe right to pick · left to skip · tap for recipe</div>`;
  attachSwipe();
}

function decide(yes){
  const el=$("#top"); const m=topMeal(); if(!el||!m) return;
  el.style.transition="transform .3s, opacity .3s";
  el.style.transform=`translateX(${yes?500:-500}px) rotate(${yes?25:-25}deg)`; el.style.opacity=0;
  setTimeout(()=>{
    deckIds.shift();
    if(yes){ S.made[m.id]=Date.now(); save(); toast(`Great choice! Enjoy the ${m.name.toLowerCase()} 🍽️`); }
    renderDeck();
  },260);
}

function attachSwipe(){
  const el=$("#top"); if(!el) return;
  let sx=0, dx=0, drag=false, moved=false;
  const yes=el.querySelector(".stamp.yes"), no=el.querySelector(".stamp.no");
  el.addEventListener("pointerdown",e=>{ if(e.target.closest("#heart")) return; drag=true; moved=false; sx=e.clientX; el.setPointerCapture(e.pointerId); el.style.transition="none"; });
  el.addEventListener("pointermove",e=>{ if(!drag) return; dx=e.clientX-sx; if(Math.abs(dx)>6) moved=true;
    el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    yes.style.opacity=Math.max(0,dx/110); no.style.opacity=Math.max(0,-dx/110); });
  const end=()=>{ if(!drag) return; drag=false;
    if(!moved){ const m=topMeal(); if(hasRecipe(m)){ el.style.transition="transform .25s"; el.style.transform=""; dx=0; return openSheet("detail",m.id); } }
    if(dx>110) decide(true); else if(dx<-110) decide(false);
    else { el.style.transition="transform .25s"; el.style.transform=""; yes.style.opacity=no.style.opacity=0; }
    dx=0; };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
}

stage.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="yes") decide(true);
  else if(t.id==="no") decide(false);
  else if(t.id==="heart"){ const m=topMeal(); toggleFav(m.id); t.classList.toggle("on"); t.textContent=S.favs.includes(m.id)?"♥":"♡"; }
  else if(t.id==="again"){ if(!pool().length){ S.mealF="Any"; S.effortF=0; S.tagF=""; save(); renderFilters(); } buildDeck(); renderDeck(); }
});

filters.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.meal) S.mealF=t.dataset.meal;
  else if(t.dataset.effort) S.effortF=+t.dataset.effort;
  else if(t.dataset.tag) S.tagF = S.tagF===t.dataset.tag ? "" : t.dataset.tag; else return;
  save(); renderFilters(); buildDeck(); renderDeck();
});

// ---- sheets ----
function itemRow(m, actions){
  const a = ago(m.id);
  return `<div class="item"><div class="e">${m.emoji}</div>
    <div class="t" ${hasRecipe(m)?`data-view="${m.id}"`:""}><b>${esc(m.name)}${hasRecipe(m)?" 📝":""}</b><small>${esc(m.meal)} · ${mins(m)}${a?" · made "+a:""}</small></div>${actions}</div>`;
}
const favBtn = id => `<button class="icon ${S.favs.includes(id)?"on":""}" data-fav="${id}">${S.favs.includes(id)?"♥":"♡"}</button>`;
let sheetName = null, detailId = null, editId = null, prevSheet = null;

function sheetBody(){
  if(sheetName==="list"){
    const q=(window._q||"").toLowerCase();
    const items=all().filter(m=>!q||m.name.toLowerCase().includes(q)||m.meal.toLowerCase().includes(q));

      <input id="q" type="search" placeholder="Search…" value="${esc(window._q||"")}">

  }
  if(sheetName==="favs"){
    const items=S.favs.map(find).filter(m=>m&&!S.hidden.includes(m.id));
    return `<h1>Favorites</h1><p class="sub">Meals you love</p>`+
      (items.map(m=>itemRow(m,favBtn(m.id))).join("")||'<p class="empty"><span class="big">♡</span><br>Tap the heart on any card to save it here.</p>');
  }
  if(sheetName==="style"){
    const mode=localStorage.getItem("dinnerTheme")||"auto";
    return `<h1>Make it yours</h1><p class="sub">Pick your look</p>
      <label>Color</label>
      <div class="sws">${Object.keys(COLORS).map(k=>`<button class="sw ${k===color?"on":""}" data-color="${k}"><i style="background:${COLORS[k].c}">${k===color?"✓":""}</i>${COLORS[k].name}</button>`).join("")}</div>
      <label>Light or dark</label>
      <div class="seg">${[["light","☀️ Light"],["dark","🌙 Dark"],["auto","📱 Auto"]].map(([k,n])=>`<button class="chip ${mode===k?"on":""}" data-mode="${k}">${n}</button>`).join("")}</div>
      <label>App icon</label>
      <div class="icons">${ICONS.map(ic=>`<button class="ic ${ic===icon?"on":""}" data-icon="${ic}" style="background:${COLORS[color].c}" aria-label="Icon ${ic}"><span>${ic}</span></button>`).join("")}</div>
      <div class="note2">📲 Phones only look at the icon when you add the app. To change the icon on the home screen, delete the app icon, open this page again, and tap <b>Add to Home Screen</b> (iPhone) or <b>Install app</b> (Android).</div>`;
  }
  if(sheetName==="detail"){
    const m=find(detailId); if(!m) return "";
    const ing=lines(m.ingredients), st=lines(m.steps);
    return `<div class="detail"><div class="blob">${m.emoji}</div><h1>${esc(m.name)}</h1>
      <div class="sub">${esc(m.note||"")}</div>
      <div class="meta"><span class="tag">${esc(m.meal)}</span><span class="tag">⏱ ${mins(m)}</span>${m.serves?`<span class="tag">🍽 Serves ${m.serves}</span>`:""}${(m.tags||[]).map(t=>`<span class="tag food">${TAG_ICON[t]||""} ${esc(t)}</span>`).join("")}</div>
      <button class="btn" data-make="${m.id}">✅ We're making this!</button>
      ${ing.length?`<div class="box"><h3>Ingredients</h3><ul>${ing.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
      ${st.length?`<div class="box"><h3>How to make it</h3><ol>${st.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`:""}
      ${String(m.id).startsWith("c")?`<button class="btn alt" data-edit="${m.id}">✏️ Edit this recipe</button>`:""}</div>`;
  }
  const e=S.custom.find(x=>x.id===editId)||{};
  const et=e.tags||[];
  return `<h1>${e.id?"Edit recipe":"Add your own"}</h1><p class="sub">Family recipes and favorites</p>
    <label>Meal name</label><input id="n" placeholder="e.g. Grandma's rice and beans" value="${esc(e.name||"")}">
    <label>Type</label><select id="m">${MEALS.slice(1).map(x=>`<option ${x===(e.meal||"Dinner")?"selected":""}>${x}</option>`).join("")}</select>
    <label>Minutes to make</label><input id="t" type="number" inputmode="numeric" min="1" value="${e.mins||30}">
    <label>Good for</label><div>${Object.keys(TAGS).map(k=>`<button type="button" class="chip tg ${et.includes(k)?"on":""}" data-ftag="${k}">${TAG_ICON[k]} ${k}</button>`).join("")}</div>
    <label style="display:block;margin-top:6px">Ingredients (one per line)</label><textarea id="ing" placeholder="2 cups rice&#10;1 can chickpeas&#10;1 onion">${esc(e.ingredients||"")}</textarea>
    <label>Steps (one per line, optional)</label><textarea id="stp" placeholder="Rinse the rice&#10;Cook the onion…">${esc(e.steps||"")}</textarea>
    <label>Note (optional)</label><input id="o" placeholder="e.g. marinate overnight" value="${esc(e.note||"")}">
    <button class="btn" data-act="add">${e.id?"Save changes":"Add this meal"}</button>
    ${e.id?`<button class="btn alt" data-act="cancel">Cancel</button>`:""}
    ${S.custom.length?`<p class="sub" style="margin-top:20px">Your meals</p>`+S.custom.map(m=>itemRow(m,`<button class="icon" data-edit="${m.id}" aria-label="Edit">✏️</button><button class="icon" data-del="${m.id}" aria-label="Delete">🗑</button>`)).join(""):""}`;
}
function openSheet(n,id){
  if(n==="detail"){ prevSheet = sheet.hidden ? null : sheetName; detailId=id; }
  else { prevSheet=null; if(n==="add" && id===undefined) editId=null; }
  sheetName=n; renderSheet(); sheet.hidden=false; sheet.scrollTop=0;
}
function renderSheet(){
  sheet.innerHTML=`<div class="in"><div class="top"><button class="ib" data-close aria-label="Back">←</button></div>${sheetBody()}</div>`;
}
function closeSheet(){
  if(sheetName==="detail"){
    if(prevSheet){ const p=prevSheet; prevSheet=null; sheetName=p; renderSheet(); return; }
    sheet.hidden=true; return;   // opened from the card: keep the deck as it was
  }
  sheet.hidden=true; editId=null; buildDeck(); renderDeck();
}

function toggleFav(id){ S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id]; save(); }

document.querySelector("header nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-open]"); if(b) openSheet(b.dataset.open);
});
sheet.addEventListener("input",e=>{
  if(e.target.id==="q"){ window._q=e.target.value; const p=e.target.selectionStart; renderSheet();
    const q=$("#q"); q.focus(); q.setSelectionRange(p,p); }
});
sheet.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");
  if(v && !e.target.closest("button")) return openSheet("detail",v.dataset.view);
  const t=e.target.closest("button"); if(!t) return; const d=t.dataset;
  if(d.close!==undefined) return closeSheet();
  if(d.ftag){ t.classList.toggle("on"); return; }
  if(d.edit){ editId=d.edit; sheetName="add"; prevSheet=null; renderSheet(); sheet.scrollTop=0; return; }
  if(d.fav) toggleFav(d.fav);
  else if(d.make){ S.made[d.make]=Date.now(); save(); toast("Great choice! Enjoy 🍽️"); }
  else if(d.color){ setColor(d.color); }
  else if(d.mode){ setMode(d.mode); }
  else if(d.icon){ setIcon(d.icon); }
  else if(d.hide){ S.hidden.push(d.hide); save(); toast("Hidden. Bring it back anytime."); }
  else if(d.del){ if(!confirm("Delete this meal?")) return; if(editId===d.del) editId=null; S.custom=S.custom.filter(m=>m.id!==d.del); S.favs=S.favs.filter(x=>x!==d.del); save(); }
  else if(d.act==="unhide"){ S.hidden=[]; save(); }
  else if(d.act==="add"){
    const name=$("#n").value.trim(); if(!name){ toast("Please type a meal name"); return; }
    const fields={name,meal:$("#m").value,mins:Math.max(1,parseInt($("#t").value)||30),note:$("#o").value.trim(),
      ingredients:$("#ing").value.trim(),steps:$("#stp").value.trim(),
      tags:[...document.querySelectorAll(".chip.tg.on")].map(x=>x.dataset.ftag)};
    const old=S.custom.find(x=>x.id===editId);
    if(old){ Object.assign(old,fields); save(); editId=null; toast("Saved ✓"); }
    else { const m={id:"c"+Date.now(),emoji:"🍽️",...fields}; S.custom.push(m); S.favs.push(m.id); save(); toast("Added! ♥ Saved to favorites"); }
    sheet.scrollTop=0;
  }
  else if(d.act==="cancel"){ editId=null; }
  else return;
  renderSheet();
});

// ---- look: color, dark mode, app icon ----
const COLORS = {
  green :{name:"Green", c:"#15803d", c2:"#22c55e", bgdark:"#052e16"},
  purple:{name:"Purple",c:"#7e22ce", c2:"#a855f7", bgdark:"#3b0764"},
  blue  :{name:"Blue",  c:"#1d4ed8", c2:"#3b82f6", bgdark:"#172554"},
  orange:{name:"Orange",c:"#ea580c", c2:"#fb923c", bgdark:"#431407"}
};
const ICONS = ["🍽️","🥗","🍲","🌮","🍕","🍛","🥘","🍜"];
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} };
let color = COLORS[lsGet("dinnerColor")] ? lsGet("dinnerColor") : "green";
let icon = ICONS.includes(lsGet("dinnerIcon")) ? lsGet("dinnerIcon") : ICONS[0];
let manifestURL = null;

function isDark(){
  const t=document.documentElement.dataset.theme;
  return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}

function iconURL(size){
  const c=document.createElement("canvas"); c.width=c.height=size;
  const g=c.getContext("2d"), col=COLORS[color];
  const grad=g.createLinearGradient(0,0,size,size); grad.addColorStop(0,col.c2); grad.addColorStop(1,col.c);
  g.fillStyle=grad; g.fillRect(0,0,size,size);
  g.fillStyle="rgba(255,255,255,.93)"; g.beginPath(); g.arc(size/2,size/2,size*.34,0,Math.PI*2); g.fill();
  g.font=`${Math.round(size*.42)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  g.textAlign="center"; g.textBaseline="middle"; g.fillStyle="#000";
  g.fillText(icon,size/2,size/2+size*.03);
  return c.toDataURL("image/png");
}

function applyBranding(){
  document.documentElement.dataset.color=color;
  const meta=document.querySelector('meta[name=theme-color]'); if(meta) meta.content=isDark()?COLORS[color].bgdark:COLORS[color].c;
  try{
    const i180=iconURL(180), i192=iconURL(192), i512=iconURL(512);
    document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(l=>l.href=i180);
    document.querySelectorAll('link[rel="icon"]').forEach(l=>l.href=i192);
    const man={name:"What's for Dinner?",short_name:"Dinner Ideas",description:"Easy vegetarian meal ideas.",
      start_url:new URL("index.html",location.href).href,scope:new URL("./",location.href).href,display:"standalone",
      background_color:"#fafaf9",theme_color:COLORS[color].c,
      icons:[{src:i192,sizes:"192x192",type:"image/png"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    const url=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));
    const link=document.querySelector('link[rel="manifest"]'); if(link) link.href=url;
    if(manifestURL) URL.revokeObjectURL(manifestURL); manifestURL=url;
  }catch(e){}
}
function setColor(k){ color=k; lsSet("dinnerColor",k); applyBranding(); }
function setIcon(i){ icon=i; lsSet("dinnerIcon",i); applyBranding(); }
function setMode(m){
  if(m==="auto"){ delete document.documentElement.dataset.theme; lsSet("dinnerTheme",null); }
  else { document.documentElement.dataset.theme=m; lsSet("dinnerTheme",m); }
  applyBranding();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyBranding);

applyBranding(); renderFilters(); buildDeck(); renderDeck();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
