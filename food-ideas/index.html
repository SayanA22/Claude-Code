const MEALS = ["Any","Breakfast","Lunch","Dinner","Dessert","Snack"];
const EFFORT = [["Any",9999],["Quick (under 30 min)",30],["Under an hour",60]];

// ---- storage ----
const KEY = "dinnerIdeas.v1";
let S = { custom:[], favs:[], hidden:[], made:{}, mealF:"Dinner", effortF:0, tagF:"", current:null };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const all = () => [...BUILTIN, ...S.custom].filter(m => !S.hidden.includes(m.id));
const find = id => [...BUILTIN, ...S.custom].find(m => m.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hasRecipe = m => !!(m && ((m.ingredients||"").trim() || (m.steps||"").trim()));
const lines = t => String(t||"").split("\n").map(x=>x.trim()).filter(Boolean);
const mins = m => m.mins<60 ? m.mins+" min" : Math.floor(m.mins/60)+" hr"+(m.mins%60?" "+m.mins%60+" min":"");

function ago(id){
  const t = S.made[id]; if(!t) return null;
  const d = Math.floor((Date.now()-t)/864e5);
  return d<=0 ? "today" : d===1 ? "yesterday" : d<14 ? d+" days ago" : Math.round(d/7)+" weeks ago";
}

function pool(){
  const max = EFFORT[S.effortF][1];
  return all().filter(m => (S.mealF==="Any"||m.meal===S.mealF) && m.mins<=max && (!S.tagF || (m.tags||[]).includes(S.tagF)));
}

// ---- views ----
const $ = s => document.querySelector(s);
const stage = $("#stage"), filters = $("#filters"), sheet = $("#sheet");
let deckIds = [];

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("show"),1800);
}

function buildDeck(){
  const p = pool();
  // shuffle, weighted toward meals not made recently
  deckIds = p.map(m=>{
    const days = S.made[m.id] ? (Date.now()-S.made[m.id])/864e5 : 60;
    return [m.id, Math.random()*(1+Math.min(days,60))];
  }).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
function topMeal(){ while(deckIds.length && !find(deckIds[0])) deckIds.shift(); return deckIds[0] && find(deckIds[0]); }

    <h2>${esc(m.name)}</h2>
    <div class="note">${esc(m.note||"")}</div>
    <div class="meta"><span class="tag">${esc(m.meal)}</span><span class="tag">⏱ ${mins(m)}</span>${(m.tags||[]).map(t=>`<span class="tag food">${TAG_ICON[t]||""} ${esc(t)}</span>`).join("")}${a?`<span class="tag">Made ${a}</span>`:""}${hasRecipe(m)?`<span class="tag recipe">📝 Tap for recipe</span>`:""}</div>
  </div>`;
}

function renderFilters(){
  filters.innerHTML = `<div class="scroll">${MEALS.map(x=>`<button class="chip ${x===S.mealF?"on":""}" data-meal="${x}">${x}</button>`).join("")}</div>
  <div class="scroll">${EFFORT.map((x,i)=>`<button class="chip t ${i===S.effortF?"on":""}" data-effort="${i}">${i?"⏱ ":""}${x[0].replace(" (under 30 min)"," · 30 min")}</button>`).join("")}</div>
  <div class="scroll">${Object.keys(TAGS).map(k=>`<button class="chip t ${k===S.tagF?"on":""}" data-tag="${k}">${TAG_ICON[k]} ${k}</button>`).join("")}</div>`;
}

function renderDeck(){
  const m = topMeal();
  if(!m){
    stage.innerHTML = `<div class="empty"><div class="big">${pool().length?"🎉":"🤔"}</div>
      <p>${pool().length?"You've seen everything here!":"Nothing matches those filters."}</p>
      <button class="btn" id="again">${pool().length?"Start over":"Show all meals"}</button></div>`;
    return;
  }
  const next = deckIds[1] && find(deckIds[1]);
  stage.innerHTML = `<div class="deck">${next?cardHTML(next,true):""}${cardHTML(m,false)}</div>
    <div class="actions">
      <button class="round" id="no" aria-label="Skip">✕</button>
      <button class="round yes" id="yes" aria-label="Make this">✓</button>
    </div>
    <div class="hintline">Swipe right to pick · left to skip</div>`;
  attachSwipe();
}

function decide(yes){
  const el=$("#top"); const m=topMeal(); if(!el||!m) return;
  el.style.transition="transform .3s, opacity .3s";
  el.style.transform=`translateX(${yes?500:-500}px) rotate(${yes?25:-25}deg)`; el.style.opacity=0;
  setTimeout(()=>{
    deckIds.shift();
    if(yes){ S.made[m.id]=Date.now(); save(); toast(`Great choice! Enjoy the ${m.name.toLowerCase()} 🍽️`); }
    renderDeck();
  },260);
}

function attachSwipe(){
  const el=$("#top"); if(!el) return;
  let sx=0, dx=0, drag=false, moved=false;
  const yes=el.querySelector(".stamp.yes"), no=el.querySelector(".stamp.no");
  el.addEventListener("pointerdown",e=>{ if(e.target.closest("#heart")) return; drag=true; moved=false; sx=e.clientX; el.setPointerCapture(e.pointerId); el.style.transition="none"; });
  el.addEventListener("pointermove",e=>{ if(!drag) return; dx=e.clientX-sx; if(Math.abs(dx)>6) moved=true;
    el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    yes.style.opacity=Math.max(0,dx/110); no.style.opacity=Math.max(0,-dx/110); });
  const end=()=>{ if(!drag) return; drag=false;
    if(!moved){ const m=topMeal(); if(hasRecipe(m)){ el.style.transition="transform .25s"; el.style.transform=""; dx=0; return openSheet("detail",m.id); } }
    if(dx>110) decide(true); else if(dx<-110) decide(false);
    else { el.style.transition="transform .25s"; el.style.transform=""; yes.style.opacity=no.style.opacity=0; }
    dx=0; };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
}

stage.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="yes") decide(true);
  else if(t.id==="no") decide(false);
  else if(t.id==="heart"){ const m=topMeal(); toggleFav(m.id); t.classList.toggle("on"); t.textContent=S.favs.includes(m.id)?"♥":"♡"; }
  else if(t.id==="again"){ if(!pool().length){ S.mealF="Any"; S.effortF=0; S.tagF=""; save(); renderFilters(); } buildDeck(); renderDeck(); }
});

filters.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.meal) S.mealF=t.dataset.meal;
  else if(t.dataset.effort) S.effortF=+t.dataset.effort;
  else if(t.dataset.tag) S.tagF = S.tagF===t.dataset.tag ? "" : t.dataset.tag; else return;
  save(); renderFilters(); buildDeck(); renderDeck();
});

// ---- sheets ----
function itemRow(m, actions){
  const a = ago(m.id);
  return `<div class="item"><div class="e">${m.emoji}</div>
    <div class="t" ${hasRecipe(m)?`data-view="${m.id}"`:""}><b>${esc(m.name)}${hasRecipe(m)?" 📝":""}</b><small>${esc(m.meal)} · ${mins(m)}${a?" · made "+a:""}</small></div>${actions}</div>`;
}
const favBtn = id => `<button class="icon ${S.favs.includes(id)?"on":""}" data-fav="${id}">${S.favs.includes(id)?"♥":"♡"}</button>`;
let sheetName = null, detailId = null, editId = null, prevSheet = null;

function sheetBody(){
  if(sheetName==="list"){
    const q=(window._q||"").toLowerCase();
    const items=all().filter(m=>!q||m.name.toLowerCase().includes(q)||m.meal.toLowerCase().includes(q));
    return `<h1>All ideas</h1><p class="sub">${all().length} meals</p>
      <input id="q" type="search" placeholder="Search…" value="${esc(window._q||"")}">
      ${items.map(m=>itemRow(m,favBtn(m.id)+`<button class="icon" data-hide="${m.id}" aria-label="Hide">🚫</button>`)).join("")||'<p class="empty">No matches.</p>'}
      ${S.hidden.length?`<button class="btn alt" data-act="unhide">Bring back ${S.hidden.length} hidden</button>`:""}`;
  }
  if(sheetName==="favs"){
    const items=S.favs.map(find).filter(m=>m&&!S.hidden.includes(m.id));
    return `<h1>Favorites</h1><p class="sub">Meals you love</p>`+
      (items.map(m=>itemRow(m,favBtn(m.id))).join("")||'<p class="empty"><span class="big">♡</span><br>Tap the heart on any card to save it here.</p>');
  }
  if(sheetName==="style"){
    const mode=localStorage.getItem("dinnerTheme")||"auto";
    return `<h1>Make it yours</h1><p class="sub">Pick your look</p>
      <label>Color</label>
      <div class="sws">${Object.keys(COLORS).map(k=>`<button class="sw ${k===color?"on":""}" data-color="${k}"><i style="background:${COLORS[k].c}">${k===color?"✓":""}</i>${COLORS[k].name}</button>`).join("")}</div>
      <label>Light or dark</label>
      <div class="seg">${[["light","☀️ Light"],["dark","🌙 Dark"],["auto","📱 Auto"]].map(([k,n])=>`<button class="chip ${mode===k?"on":""}" data-mode="${k}">${n}</button>`).join("")}</div>
      <label>App icon</label>
      <div class="icons">${ICONS.map(ic=>`<button class="ic ${ic===icon?"on":""}" data-icon="${ic}" style="background:${COLORS[color].c}" aria-label="Icon ${ic}"><span>${ic}</span></button>`).join("")}</div>
      <div class="note2">📲 Phones only look at the icon when you add the app. To change the icon on the home screen, delete the app icon, open this page again, and tap <b>Add to Home Screen</b> (iPhone) or <b>Install app</b> (Android).</div>`;
  }
  if(sheetName==="detail"){
    const m=find(detailId); if(!m) return "";
    const ing=lines(m.ingredients), st=lines(m.steps);
    return `<div class="detail"><div class="blob">${m.emoji}</div><h1>${esc(m.name)}</h1>
      <div class="sub">${esc(m.note||"")}</div>
      <div class="meta"><span class="tag">${esc(m.meal)}</span><span class="tag">⏱ ${mins(m)}</span>${(m.tags||[]).map(t=>`<span class="tag food">${TAG_ICON[t]||""} ${esc(t)}</span>`).join("")}</div>
      ${ing.length?`<div class="box"><h3>Ingredients</h3><ul>${ing.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
      ${st.length?`<div class="box"><h3>How to make it</h3><ol>${st.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`:""}
      ${String(m.id).startsWith("c")?`<button class="btn alt" data-edit="${m.id}">✏️ Edit this recipe</button>`:""}</div>`;
  }
  const e=S.custom.find(x=>x.id===editId)||{};
  const et=e.tags||[];
  return `<h1>${e.id?"Edit recipe":"Add your own"}</h1><p class="sub">Family recipes and favorites</p>
    <label>Meal name</label><input id="n" placeholder="e.g. Grandma's rice and beans" value="${esc(e.name||"")}">
    <label>Type</label><select id="m">${MEALS.slice(1).map(x=>`<option ${x===(e.meal||"Dinner")?"selected":""}>${x}</option>`).join("")}</select>
    <label>Minutes to make</label><input id="t" type="number" inputmode="numeric" min="1" value="${e.mins||30}">
    <label>Good for</label><div>${Object.keys(TAGS).map(k=>`<button type="button" class="chip tg ${et.includes(k)?"on":""}" data-ftag="${k}">${TAG_ICON[k]} ${k}</button>`).join("")}</div>
    <label style="display:block;margin-top:6px">Ingredients (one per line)</label><textarea id="ing" placeholder="2 cups rice&#10;1 can chickpeas&#10;1 onion">${esc(e.ingredients||"")}</textarea>
    <label>Steps (one per line, optional)</label><textarea id="stp" placeholder="Rinse the rice&#10;Cook the onion…">${esc(e.steps||"")}</textarea>
    <label>Note (optional)</label><input id="o" placeholder="e.g. marinate overnight" value="${esc(e.note||"")}">
    <button class="btn" data-act="add">${e.id?"Save changes":"Add this meal"}</button>
    ${e.id?`<button class="btn alt" data-act="cancel">Cancel</button>`:""}
    ${S.custom.length?`<p class="sub" style="margin-top:20px">Your meals</p>`+S.custom.map(m=>itemRow(m,`<button class="icon" data-edit="${m.id}" aria-label="Edit">✏️</button><button class="icon" data-del="${m.id}" aria-label="Delete">🗑</button>`)).join(""):""}`;
}
function openSheet(n,id){
  if(n==="detail"){ prevSheet = sheet.hidden ? null : sheetName; detailId=id; }
  else { prevSheet=null; if(n==="add" && id===undefined) editId=null; }
  sheetName=n; renderSheet(); sheet.hidden=false; sheet.scrollTop=0;
}
function renderSheet(){
  sheet.innerHTML=`<div class="in"><div class="top"><button class="ib" data-close aria-label="Back">←</button></div>${sheetBody()}</div>`;
}
function closeSheet(){
  if(sheetName==="detail"){
    if(prevSheet){ const p=prevSheet; prevSheet=null; sheetName=p; renderSheet(); return; }
    sheet.hidden=true; return;   // opened from the card: keep the deck as it was
  }
  sheet.hidden=true; editId=null; buildDeck(); renderDeck();
}

function toggleFav(id){ S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id]; save(); }

document.querySelector("header nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-open]"); if(b) openSheet(b.dataset.open);
});
sheet.addEventListener("input",e=>{
  if(e.target.id==="q"){ window._q=e.target.value; const p=e.target.selectionStart; renderSheet();
    const q=$("#q"); q.focus(); q.setSelectionRange(p,p); }
});
sheet.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");
  if(v && !e.target.closest("button")) return openSheet("detail",v.dataset.view);
  const t=e.target.closest("button"); if(!t) return; const d=t.dataset;
  if(d.close!==undefined) return closeSheet();
  if(d.ftag){ t.classList.toggle("on"); return; }
  if(d.edit){ editId=d.edit; sheetName="add"; prevSheet=null; renderSheet(); sheet.scrollTop=0; return; }
  if(d.fav) toggleFav(d.fav);
  else if(d.color){ setColor(d.color); }
  else if(d.mode){ setMode(d.mode); }
  else if(d.icon){ setIcon(d.icon); }
  else if(d.hide){ S.hidden.push(d.hide); save(); toast("Hidden. Bring it back anytime."); }
  else if(d.del){ if(!confirm("Delete this meal?")) return; if(editId===d.del) editId=null; S.custom=S.custom.filter(m=>m.id!==d.del); S.favs=S.favs.filter(x=>x!==d.del); save(); }
  else if(d.act==="unhide"){ S.hidden=[]; save(); }
  else if(d.act==="add"){
    const name=$("#n").value.trim(); if(!name){ toast("Please type a meal name"); return; }
    const fields={name,meal:$("#m").value,mins:Math.max(1,parseInt($("#t").value)||30),note:$("#o").value.trim(),
      ingredients:$("#ing").value.trim(),steps:$("#stp").value.trim(),
      tags:[...document.querySelectorAll(".chip.tg.on")].map(x=>x.dataset.ftag)};
    const old=S.custom.find(x=>x.id===editId);
    if(old){ Object.assign(old,fields); save(); editId=null; toast("Saved ✓"); }
    else { const m={id:"c"+Date.now(),emoji:"🍽️",...fields}; S.custom.push(m); S.favs.push(m.id); save(); toast("Added! ♥ Saved to favorites"); }
    sheet.scrollTop=0;
  }
  else if(d.act==="cancel"){ editId=null; }
  else return;
  renderSheet();
});

// ---- look: color, dark mode, app icon ----
const COLORS = {
  green :{name:"Green", c:"#15803d", c2:"#22c55e", bgdark:"#052e16"},
  purple:{name:"Purple",c:"#7e22ce", c2:"#a855f7", bgdark:"#3b0764"},
  blue  :{name:"Blue",  c:"#1d4ed8", c2:"#3b82f6", bgdark:"#172554"},
  orange:{name:"Orange",c:"#ea580c", c2:"#fb923c", bgdark:"#431407"}
};
const ICONS = ["🍽️","🥗","🍲","🌮","🍕","🍛","🥘","🍜"];
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} };
let color = COLORS[lsGet("dinnerColor")] ? lsGet("dinnerColor") : "green";
let icon = ICONS.includes(lsGet("dinnerIcon")) ? lsGet("dinnerIcon") : ICONS[0];
let manifestURL = null;

function isDark(){
  const t=document.documentElement.dataset.theme;
  return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}

function iconURL(size){
  const c=document.createElement("canvas"); c.width=c.height=size;
  const g=c.getContext("2d"), col=COLORS[color];
  const grad=g.createLinearGradient(0,0,size,size); grad.addColorStop(0,col.c2); grad.addColorStop(1,col.c);
  g.fillStyle=grad; g.fillRect(0,0,size,size);
  g.fillStyle="rgba(255,255,255,.93)"; g.beginPath(); g.arc(size/2,size/2,size*.34,0,Math.PI*2); g.fill();
  g.font=`${Math.round(size*.42)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  g.textAlign="center"; g.textBaseline="middle"; g.fillStyle="#000";
  g.fillText(icon,size/2,size/2+size*.03);
  return c.toDataURL("image/png");
}

function applyBranding(){
  document.documentElement.dataset.color=color;
  const meta=document.querySelector('meta[name=theme-color]'); if(meta) meta.content=isDark()?COLORS[color].bgdark:COLORS[color].c;
  try{
    const i180=iconURL(180), i192=iconURL(192), i512=iconURL(512);
    document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(l=>l.href=i180);
    document.querySelectorAll('link[rel="icon"]').forEach(l=>l.href=i192);
    const man={name:"What's for Dinner?",short_name:"Dinner Ideas",description:"Easy vegetarian meal ideas.",
      start_url:new URL("index.html",location.href).href,scope:new URL("./",location.href).href,display:"standalone",
      background_color:"#fafaf9",theme_color:COLORS[color].c,
      icons:[{src:i192,sizes:"192x192",type:"image/png"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    const url=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));
    const link=document.querySelector('link[rel="manifest"]'); if(link) link.href=url;
    if(manifestURL) URL.revokeObjectURL(manifestURL); manifestURL=url;
  }catch(e){}
}
function setColor(k){ color=k; lsSet("dinnerColor",k); applyBranding(); }
function setIcon(i){ icon=i; lsSet("dinnerIcon",i); applyBranding(); }
function setMode(m){
  if(m==="auto"){ delete document.documentElement.dataset.theme; lsSet("dinnerTheme",null); }
  else { document.documentElement.dataset.theme=m; lsSet("dinnerTheme",m); }
  applyBranding();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyBranding);

applyBranding(); renderFilters(); buildDeck(); renderDeck();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
