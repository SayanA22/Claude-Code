const RECIPES = {"Pancakes":[4,"1½ cups flour|3 tsp baking powder|1 tbsp sugar|¼ tsp salt|1¼ cups milk|1 egg|3 tbsp melted butter or oil|1 tsp vanilla|Oil or butter for the pan","Mix the flour, baking powder, sugar and salt in a bowl.|Whisk the milk, egg, melted butter and vanilla in another bowl, then pour into the dry ingredients. Stir until just combined. A few small lumps are fine.|Let the batter rest for 5 minutes.|Heat a lightly oiled pan on medium. Pour in ¼ cup of batter for each pancake.|Flip when bubbles form on top and the edges look set, about 2 minutes. Cook 1 minute more.|Serve with fruit, syrup or honey."],"Oatmeal with fruit":[2,"1 cup rolled oats|2 cups milk or water|Pinch of salt|1 banana, sliced, or a handful of berries|1 tbsp honey or maple syrup|Cinnamon|Chopped nuts (optional)","Put the oats, milk and salt in a small pot.|Bring to a gentle simmer and cook 5 minutes, stirring often, until thick and creamy.|Spoon into bowls and top with fruit, honey, cinnamon and nuts."],"Cinnamon toast":[2,"4 slices bread|2 tbsp soft butter|2 tbsp sugar|1 tsp cinnamon","Mix the sugar and cinnamon in a small bowl.|Toast the bread.|Spread butter on the hot toast, then sprinkle with the cinnamon sugar.|For a crisp top, broil for 1 minute. Watch closely so it doesn't burn."],"Avocado toast":[2,"2 slices bread|1 ripe avocado|Juice of ½ lemon|Salt and pepper|Chili flakes (optional)|Sliced tomato (optional)","Toast the bread.|Mash the avocado with the lemon juice and a pinch of salt.|Spread on the toast.|Top with tomato, pepper and chili flakes."],"Fruit smoothie bowl":[1,"2 frozen bananas|1 cup frozen berries or mango|¼ to ½ cup yogurt or milk|Toppings: granola, sliced fruit, seeds, honey","Blend the frozen fruit with a splash of yogurt or milk. Add liquid a little at a time so it stays thick like soft ice cream.|Pour into a bowl.|Top with granola, fruit, seeds and a drizzle of honey. Eat right away."],"Bagel with cream cheese":[2,"2 bagels|Cream cheese|Sliced tomato (optional)|Sliced cucumber (optional)|Salt and pepper","Slice the bagels and toast them.|Spread with cream cheese.|Top with tomato and cucumber, then add salt and pepper."],"Waffles with berries":[4,"2 cups flour|1 tbsp sugar|4 tsp baking powder|½ tsp salt|1¾ cups milk|2 eggs|⅓ cup oil or melted butter|1 tsp vanilla|Berries and syrup to serve","Heat your waffle iron.|Whisk the flour, sugar, baking powder and salt together. In another bowl, whisk the milk, eggs, oil and vanilla, then stir into the dry ingredients until just mixed.|Grease the iron if needed. Pour in batter and cook until golden and crisp, following your iron's directions.|Top with berries and syrup."],"Granola & yogurt":[1,"1½ cups yogurt|¾ cup granola|Fresh fruit (optional)|Honey","Spoon half the yogurt into a bowl or glass.|Add fruit and granola, then repeat the layers.|Drizzle with honey."],"Poha":[3,"2 cups thick poha (flattened rice)|1 tbsp oil|1 tsp mustard seeds|1 onion, chopped|2 green chilies, chopped|¼ cup peanuts|8 curry leaves|½ tsp turmeric|Salt and a pinch of sugar|Lemon juice and chopped cilantro","Rinse the poha in a colander under water for 1 to 2 minutes until soft. Drain well and sprinkle with salt and sugar.|Heat the oil. Add mustard seeds and let them pop.|Add the peanuts, curry leaves and chilies. Cook 1 minute.|Add the onion and cook until soft. Stir in the turmeric.|Add the poha and mix gently for 2 minutes until heated through.|Finish with lemon juice and cilantro."],"Upma":[3,"1 cup semolina (rava)|2 tbsp oil|1 tsp mustard seeds|1 onion, chopped|1 carrot, diced, and a handful of peas|2 green chilies|1 tsp grated ginger|2½ cups hot water|Salt|Lemon juice and cilantro","Dry roast the semolina in a pan for 3 to 4 minutes until fragrant. Set aside.|Heat the oil, add the mustard seeds, then the onion, chilies and ginger. Cook 3 minutes.|Add the carrot and peas and cook 2 minutes.|Pour in the hot water and salt and bring to a boil.|Lower the heat. Pour in the semolina in a thin stream, stirring constantly so it doesn't clump.|Cover for 2 minutes. Finish with lemon juice and cilantro."],"Aloo paratha":[4,"Dough: 2 cups whole wheat flour, ½ tsp salt, 1 tbsp oil, water|Filling: 3 boiled potatoes, mashed|1 tsp cumin seeds|½ tsp chili powder|½ tsp garam masala|1 green chili, chopped|Chopped cilantro and salt|Oil or ghee for cooking|Yogurt or pickle to serve","Knead the flour, salt, oil and enough water into a soft dough. Rest 20 minutes.|Mix the potatoes with the spices, chili, cilantro and salt.|Roll a ball of dough into a small circle. Put a spoonful of filling in the middle, pinch the edges closed, then gently roll out flat.|Cook on a hot pan with a little oil until golden spots appear on both sides.|Serve hot with yogurt or pickle."],"Dosa with chutney":[3,"2 cups ready dosa batter (store-bought or homemade)|Water to thin|Salt|Oil|Coconut chutney or sambar to serve","Stir a little water and salt into the batter until it's thin and pourable.|Heat a nonstick pan on medium and wipe it with a little oil.|Pour a ladle of batter in the middle and spread it in a circle with the back of the ladle.|Drizzle a little oil on top and cook until crisp and golden.|Fold and serve right away with chutney or sambar."],"Idli & sambar":[4,"Idli: 2 cups ready idli batter|Sambar: ½ cup toor dal|1 tomato|1 cup mixed vegetables (carrot, drumstick, pumpkin)|1 tbsp sambar powder|1 tbsp tamarind paste or lemon juice|1 tsp mustard seeds, curry leaves|1 tbsp oil, salt","Cook the dal with 2 cups water until very soft (about 3 whistles in a pressure cooker or 30 minutes on the stove). Mash it.|Grease the idli moulds, fill with batter and steam for 10 to 12 minutes.|Simmer the vegetables and tomato in water with the sambar powder until tender.|Add the mashed dal, tamarind and salt. Simmer 5 minutes.|Heat the oil, pop the mustard seeds, add curry leaves, and pour over the sambar.|Serve the hot idlis with the sambar."],"Grilled cheese & tomato soup":[2,"Sandwiches: 4 slices bread, 4 slices cheese, butter|Soup: 1 can (28 oz) crushed tomatoes|1 cup vegetable broth|1 small onion, chopped|2 garlic cloves|1 tbsp butter or oil|½ tsp sugar, salt and pepper","Soup: cook the onion and garlic in butter for 3 minutes.|Add the tomatoes, broth, sugar, salt and pepper. Simmer 15 minutes. Blend if you like it smooth.|Sandwiches: butter the outsides of the bread and put cheese inside.|Cook in a pan on medium-low for 3 minutes per side until golden and melted.|Serve the sandwiches with the soup for dipping."],"Caprese sandwich":[2,"4 slices ciabatta or crusty bread|2 tomatoes, sliced|8 oz fresh mozzarella, sliced|Fresh basil leaves|Olive oil|Balsamic glaze or vinegar|Salt and pepper","Drizzle the bread with olive oil. Toast it if you like.|Layer mozzarella, tomato and basil. Add salt and pepper.|Drizzle with balsamic and close the sandwich. Press down gently and slice."],"Chickpea salad sandwich":[3,"1 can (15 oz) chickpeas, drained|3 tbsp mayonnaise or plain yogurt|1 celery stalk, chopped|2 tbsp chopped onion|1 tsp mustard|Lemon juice, salt and pepper|Bread|Lettuce and tomato (optional)","Mash the chickpeas with a fork, leaving some texture.|Mix in the yogurt, celery, onion, mustard, a squeeze of lemon, salt and pepper.|Pile onto bread with lettuce and tomato."],"Bean & cheese burritos":[4,"4 large tortillas|1 can (15 oz) beans (refried or black)|1 cup shredded cheese|1 cup cooked rice (optional)|Salsa and lettuce to serve","Warm the beans in a pot, mashing them as they heat.|Warm the tortillas for 20 seconds in a dry pan or the microwave.|Spoon beans, rice, cheese and salsa down the middle. Fold in the sides and roll up.|Toast seam-side down in a pan for 1 to 2 minutes per side until golden."],"Veggie wraps with hummus":[2,"2 large wraps|½ cup hummus|2 cups sliced vegetables (cucumber, carrot, bell pepper, spinach)|Feta (optional)","Spread hummus over each wrap.|Layer the vegetables down the middle.|Fold in the sides and roll up tightly. Cut in half."],"Lentil soup":[6,"1½ cups lentils (brown or green), rinsed|2 tbsp oil|1 onion, 2 carrots, 2 celery stalks, chopped|3 garlic cloves|1 tsp cumin|½ tsp turmeric|1 can (14 oz) diced tomatoes|6 cups vegetable broth or water|Salt, pepper and lemon juice","Cook the onion, carrots and celery in oil for 5 minutes.|Add the garlic and spices and stir for 1 minute.|Add the lentils, tomatoes and broth. Bring to a boil.|Reduce the heat and simmer 30 minutes until the lentils are tender.|Season with salt and pepper and a squeeze of lemon."],"Falafel pita":[4,"1 can (15 oz) chickpeas, drained and patted dry|½ onion|3 garlic cloves|½ cup parsley or cilantro|1 tsp cumin, 1 tsp coriander, ½ tsp salt|3 tbsp flour, 1 tsp baking powder|4 pitas|Cucumber and tomato (optional)|Sauce: 2 tbsp tahini, lemon juice, 1 garlic clove, water","Heat the oven to 400°F (200°C).|Pulse the chickpeas, onion, garlic, herbs, spices, flour and baking powder in a food processor until coarse but holding together.|Shape into 12 small patties. Place on an oiled baking sheet and brush with oil.|Bake 20 to 25 minutes, flipping halfway, until golden.|Whisk the tahini, lemon juice, garlic and enough water for a pourable sauce.|Stuff the pitas with falafel, cucumber, tomato and sauce."],"Tomato soup":[4,"2 tbsp olive oil or butter|1 onion, chopped|3 garlic cloves|1 can (28 oz) tomatoes (whole or crushed)|2 cups vegetable broth|½ tsp sugar|Fresh basil|Salt and pepper|Splash of cream (optional)","Cook the onion in oil for 5 minutes until soft. Add the garlic for 1 minute.|Add the tomatoes, broth, sugar, salt and pepper. Simmer 15 minutes.|Blend until smooth. Stir in basil and a splash of cream if you like."],"Quinoa veggie bowl":[3,"1 cup quinoa|2 cups water|1 can (15 oz) chickpeas, drained|1 cup cucumber and cherry tomatoes, chopped|2 cups spinach or kale|1 avocado|Dressing: 3 tbsp olive oil, 2 tbsp lemon juice, salt, pepper","Rinse the quinoa. Simmer in the water, covered, for 15 minutes. Let it stand 5 minutes, then fluff.|Warm the chickpeas in a pan if you like.|Divide the quinoa between bowls. Add the greens, vegetables, chickpeas and avocado.|Whisk the dressing and pour over."],"Caesar-style salad with croutons":[3,"1 large head romaine, chopped|2 cups bread cubes|2 tbsp olive oil + ½ tsp garlic powder (for croutons)|Dressing: 3 tbsp olive oil, 2 tbsp lemon juice, 1 tsp Dijon mustard, 1 small garlic clove, 1 tbsp plain yogurt|3 tbsp grated vegetarian hard cheese|Black pepper","Heat the oven to 375°F (190°C). Toss the bread cubes with the oil and garlic powder and bake 10 minutes until crisp.|Whisk the dressing ingredients with the cheese and plenty of black pepper.|Toss the romaine with the dressing, then top with croutons and a little extra cheese."],"Veggie nachos":[4,"1 big bag tortilla chips|1 can (15 oz) black beans, drained|½ cup corn (optional)|1½ cups shredded cheese|Jalapeños (optional)|Toppings: salsa, sour cream, guacamole, chopped tomato","Heat the oven to 400°F (200°C).|Spread the chips on a baking sheet. Scatter beans, corn and jalapeños over, then cover with cheese.|Bake 8 to 10 minutes until the cheese is melted and bubbly.|Top with salsa, sour cream and guacamole."],"Curd rice":[2,"1 cup cooked rice, soft|1 cup plain yogurt|½ cup milk|Salt|Tempering: 1 tsp oil, ½ tsp mustard seeds, 1 green chili, 5 curry leaves, 1 tsp grated ginger|Chopped cilantro","Mash the warm rice slightly. Let it cool a bit.|Stir in the yogurt, milk and salt until creamy.|Heat the oil, pop the mustard seeds, then add the chili, curry leaves and ginger for 30 seconds.|Pour over the rice, mix, and top with cilantro."],"Lemon rice":[3,"2 cups cooked rice, cooled|2 tbsp oil|1 tsp mustard seeds|2 tbsp peanuts|2 green chilies, slit|8 curry leaves|½ tsp turmeric|Juice of 1 to 2 lemons|Salt and chopped cilantro","Heat the oil. Add the mustard seeds and let them pop.|Add the peanuts, chilies and curry leaves. Cook until the peanuts are golden.|Stir in the turmeric, then the rice and salt. Toss gently for 2 minutes.|Turn off the heat. Add the lemon juice and cilantro and mix."],"Tacos":[4,"8 small tortillas|1 can (15 oz) beans (black or pinto)|1 bell pepper and 1 onion, sliced|1 tbsp oil|Seasoning: 1 tsp chili powder, ½ tsp cumin, ½ tsp paprika, ½ tsp garlic powder, pinch of salt|Toppings: lettuce, tomato, cheese, salsa, sour cream, avocado, lime","Cook the pepper and onion in the oil for 5 minutes.|Add the beans, seasoning and ¼ cup water. Simmer 5 minutes, mashing some of the beans.|Warm the tortillas in a dry pan.|Fill with the beans and veggies and add your toppings."],"Black bean tacos":[4,"8 small tortillas|2 cans (15 oz) black beans|½ onion, chopped|2 garlic cloves|1 tsp cumin, 1 tsp chili powder|1 tbsp oil|Lime, cilantro|Toppings: avocado, cheese, cabbage slaw, salsa","Cook the onion in oil for 3 minutes. Add the garlic and spices for 1 minute.|Add the beans with their liquid. Simmer 8 minutes, mashing about half.|Stir in a squeeze of lime.|Warm the tortillas and fill with beans and toppings."],"Veggie fajitas":[4,"3 bell peppers, sliced|1 large onion, sliced|8 oz mushrooms, sliced|2 tbsp oil|1 tsp chili powder, 1 tsp cumin, 1 tsp paprika, ½ tsp garlic powder, ½ tsp salt|Juice of 1 lime|8 tortillas|Toppings: guacamole, sour cream, salsa","Heat the oil in a large pan on high.|Cook the vegetables with the spices for 8 to 10 minutes, stirring now and then, until browned at the edges.|Squeeze in the lime juice.|Warm the tortillas and serve with the toppings."],"Burrito bowls":[4,"3 cups cooked rice|1 can (15 oz) black beans, warmed|1 cup corn (optional)|Toppings: avocado or guacamole, salsa, shredded lettuce, shredded cheese, lime, cilantro","Put the rice in bowls.|Add the beans, corn, lettuce and cheese in sections.|Top with avocado, salsa, cilantro and a squeeze of lime."],"Spaghetti with marinara":[4,"12 oz spaghetti|2 tbsp olive oil|4 garlic cloves, minced|1 can (28 oz) crushed tomatoes|1 tsp oregano or Italian seasoning|½ tsp sugar|Salt and pepper|Basil and grated cheese (optional)","Boil the pasta in well-salted water, following the package. Save a cup of pasta water, then drain.|Warm the garlic in the oil for 30 seconds. Add the tomatoes, herbs, sugar, salt and pepper.|Simmer 15 minutes.|Toss the pasta with the sauce, adding a splash of pasta water if needed. Top with basil and cheese."],"Spaghetti with lentil marinara":[4,"12 oz spaghetti|2 tbsp olive oil|1 onion, chopped|4 garlic cloves|1 can (28 oz) crushed tomatoes|¾ cup red lentils, rinsed|2 cups water|1 tsp Italian seasoning|Salt and pepper","Cook the onion in the oil for 5 minutes. Add the garlic for 1 minute.|Add the tomatoes, lentils, water, seasoning, salt and pepper.|Simmer 20 minutes, stirring now and then, until the lentils are soft and the sauce is thick.|Meanwhile cook the spaghetti and drain.|Serve the sauce over the pasta."],"Pesto pasta":[4,"12 oz pasta|½ cup pesto (jar or homemade)|1 cup cherry tomatoes, halved (optional)|Grated cheese (optional)","If making your own pesto, blend 2 cups basil, ⅓ cup pine nuts or walnuts, 2 garlic cloves, ½ cup olive oil, ½ cup grated vegetarian hard cheese and a pinch of salt until almost smooth.|Cook the pasta and save a cup of the pasta water.|Toss the hot pasta with the pesto and a splash of pasta water.|Stir in the tomatoes and serve."],"Fettuccine Alfredo":[4,"12 oz fettuccine|4 tbsp butter|3 garlic cloves, minced|1 cup heavy cream|1½ cups grated vegetarian hard cheese|Salt, pepper, pinch of nutmeg|Chopped parsley","Cook the pasta and save a cup of the pasta water.|Melt the butter and cook the garlic for 1 minute.|Add the cream and simmer 3 minutes. Stir in the cheese until smooth.|Add the pasta and toss, thinning with pasta water. Season and top with parsley."],"Pasta primavera":[4,"12 oz pasta|2 tbsp olive oil|3 cups mixed vegetables (zucchini, bell pepper, broccoli, cherry tomatoes)|3 garlic cloves|½ cup grated cheese|Lemon juice, basil, salt and pepper","Cook the pasta and save a cup of the pasta water.|Cook the vegetables in the oil for 6 to 8 minutes until tender-crisp. Add the garlic for the last minute.|Toss in the pasta, cheese, lemon juice and a splash of pasta water.|Top with basil."],"Baked ziti":[6,"1 lb ziti|3 cups marinara sauce|15 oz ricotta|2 cups shredded mozzarella|½ cup grated cheese|1 tsp Italian seasoning, salt","Heat the oven to 375°F (190°C).|Boil the ziti 2 minutes less than the package says. Drain.|Mix the ricotta, half the mozzarella and the seasoning.|Combine the pasta, ricotta mix and most of the sauce in a baking dish.|Top with the rest of the sauce and both cheeses.|Cover with foil and bake 20 minutes, then uncover and bake 15 minutes until bubbly."],"Veggie lasagna":[8,"9 lasagna noodles|3 cups marinara sauce|15 oz ricotta|10 oz frozen spinach, thawed and squeezed dry|2 cups shredded mozzarella|½ cup grated cheese|1 tsp Italian seasoning|Salt and pepper","Heat the oven to 375°F (190°C). Cook the noodles until just tender and drain.|Mix the ricotta, spinach, half the mozzarella, seasoning, salt and pepper.|Spread a little sauce in a baking dish. Layer noodles, ricotta mix and sauce. Repeat for 3 layers.|Top with sauce, the rest of the mozzarella and the grated cheese.|Cover and bake 30 minutes, then uncover and bake 15 minutes.|Rest 10 minutes before cutting."],"Homemade veggie pizza":[4,"1 lb store-bought pizza dough|¾ cup pizza sauce|2 cups shredded mozzarella|Toppings: bell pepper, onion, mushrooms, olives, tomato|Oregano|Olive oil and flour for rolling","Heat the oven to 475°F (245°C) with a baking sheet inside.|Roll the dough out on a floured surface to about 12 inches.|Spread with sauce, add cheese and the toppings, then sprinkle with oregano.|Slide onto the hot baking sheet and bake 12 to 15 minutes until golden and bubbly."],"Veggie burgers":[4,"1 can (15 oz) black beans, drained|¾ cup breadcrumbs|½ cup cooked rice or extra breadcrumbs|¼ cup finely chopped onion|2 tbsp flour|1 tsp cumin, 1 tsp smoked paprika|1 tbsp ketchup, salt|Oil for the pan|Buns and toppings","Mash the beans, leaving some whole.|Mix in everything else. The mixture should hold together when pressed.|Form 4 patties and chill 10 minutes if you have time.|Cook in a little oil on medium heat for 4 to 5 minutes per side until crisp.|Serve on buns with your favorite toppings."],"Macaroni & cheese":[4,"8 oz elbow macaroni|2 tbsp butter|2 tbsp flour|2 cups milk|2 cups shredded cheddar|½ tsp mustard powder (optional)|Salt and pepper","Boil the macaroni and drain.|Melt the butter, whisk in the flour and cook 1 minute.|Slowly whisk in the milk. Simmer 4 to 5 minutes, stirring, until thick.|Take off the heat and stir in the cheese, mustard, salt and pepper.|Mix in the macaroni."],"Eggplant parmesan":[6,"2 large eggplants, cut into ½-inch slices|Salt|¼ cup olive oil|1½ cups seasoned breadcrumbs|3 cups marinara sauce|2 cups shredded mozzarella|½ cup grated vegetarian hard cheese|Basil","Salt the slices and let them sit 15 minutes. Pat dry.|Heat the oven to 425°F (220°C).|Brush the slices with oil and press the breadcrumbs onto both sides. Bake on baking sheets 20 minutes, flipping once.|Lower the oven to 375°F (190°C). Spread a little sauce in a baking dish. Layer eggplant, sauce and mozzarella, repeating.|Top with the grated cheese and bake 20 minutes until bubbling. Add basil."],"Mushroom stroganoff":[4,"12 oz wide noodles or rice|1 lb mushrooms, sliced|1 onion, chopped|3 garlic cloves|2 tbsp butter|2 tbsp flour|1½ cups vegetable broth|1 tbsp soy sauce|1 tsp paprika|½ cup sour cream|Salt, pepper, parsley","Cook the noodles and drain.|Cook the mushrooms in the butter until browned, about 8 minutes. Add the onion and garlic and cook 3 minutes.|Stir in the flour and paprika. Add the broth and soy sauce and simmer 5 minutes until thick.|Turn off the heat and stir in the sour cream. Season to taste.|Serve over the noodles with parsley."],"Three-bean chili":[6,"2 tbsp oil|1 onion and 1 bell pepper, chopped|3 garlic cloves|3 tbsp chili powder|1 tbsp cumin, 1 tsp paprika|1 can (28 oz) crushed tomatoes|3 cans (15 oz) beans (kidney, black, pinto), drained|1 cup vegetable broth|1 cup corn (optional)|Salt|Toppings: cheese, sour cream, cilantro","Cook the onion and pepper in the oil for 5 minutes. Add the garlic and spices for 1 minute.|Add the tomatoes, beans, broth and corn.|Simmer 40 minutes, partly covered, stirring now and then.|Season with salt and serve with toppings."],"Loaded baked potatoes":[4,"4 large russet potatoes|Olive oil and salt|1 cup shredded cheddar|1 can black beans or 2 cups steamed broccoli|Sour cream|Scallions|Butter","Heat the oven to 425°F (220°C).|Scrub the potatoes, prick with a fork, then rub with oil and salt.|Bake directly on the rack for 50 to 60 minutes until tender.|Slice open and fluff the insides. Add butter, then fill with beans or broccoli, cheese, sour cream and scallions."],"Stuffed bell peppers":[4,"4 large bell peppers|1 cup cooked rice|1 can (15 oz) black beans, drained|1 cup corn|1 cup salsa or tomato sauce|1 tsp cumin, 1 tsp chili powder|1 cup shredded cheese|Salt","Heat the oven to 375°F (190°C).|Cut the tops off the peppers and remove the seeds.|Mix the rice, beans, corn, salsa, spices and half the cheese.|Stuff the peppers and stand them in a baking dish with a splash of water in the bottom.|Cover with foil and bake 30 minutes. Top with the rest of the cheese and bake uncovered 10 to 15 minutes."],"Veggie quesadillas":[2,"4 large tortillas|2 cups shredded cheese|1 bell pepper, diced|1 cup black beans or corn|1 tsp cumin|Salsa and sour cream to serve","Sprinkle cheese, pepper, beans and cumin over half of each tortilla and fold over.|Cook in a pan on medium for 2 to 3 minutes per side until crisp and the cheese melts.|Cut into wedges and serve with salsa and sour cream."],"Roasted veggies & potatoes":[4,"1½ lb potatoes, cubed|2 carrots, sliced|1 head broccoli or cauliflower, in florets|1 red onion, in wedges|3 tbsp olive oil|1 tsp paprika, 1 tsp garlic powder, 1 tsp salt|Pepper and lemon","Heat the oven to 425°F (220°C).|Toss all the vegetables with the oil and seasonings.|Spread in a single layer on two baking sheets so they brown instead of steaming.|Roast 30 to 35 minutes, flipping halfway. Squeeze lemon over the top."],"Big Greek salad with pita":[4,"2 cucumbers, chopped|4 tomatoes, chopped|1 red onion, sliced|1 bell pepper, chopped|½ cup olives|6 oz feta|4 pitas|Dressing: ¼ cup olive oil, 2 tbsp red wine vinegar, 1 tsp oregano, salt, pepper","Put the vegetables and olives in a big bowl.|Whisk the dressing and toss it through.|Top with crumbled feta.|Warm the pitas and serve alongside."],"Veggie noodle soup":[4,"1 tbsp oil|1 onion, 2 carrots, 2 celery stalks, chopped|3 garlic cloves|8 cups vegetable broth|1 tsp thyme|6 oz noodles|1 cup peas or spinach|Salt, pepper, lemon","Cook the onion, carrots and celery in the oil for 5 minutes. Add the garlic for 1 minute.|Add the broth and thyme and bring to a boil.|Add the noodles and cook until tender, about 8 minutes.|Stir in the peas or spinach. Season and add a squeeze of lemon."],"Veggie ramen":[2,"5 cups vegetable broth|2 tbsp soy sauce|1 tbsp miso paste|2 garlic cloves, 1 tbsp grated ginger|8 oz mushrooms, sliced|1 carrot, sliced thin|2 cups bok choy or spinach|2 portions ramen noodles (skip the flavor packet)|Scallions, sesame oil, chili oil|2 soft-boiled eggs (optional)","Simmer the broth with the soy sauce, garlic, ginger, mushrooms and carrot for 10 minutes.|Whisk the miso with a little hot broth and stir it back in.|Cook the noodles in a separate pot, drain, and divide between bowls.|Add the greens to the broth for 1 minute, then ladle over the noodles.|Top with scallions and a drizzle of sesame or chili oil.|Add a halved soft-boiled egg to each bowl (optional)."],"Pad Thai with tofu":[3,"8 oz rice noodles|14 oz firm tofu, pressed and cubed|2 tbsp oil|3 garlic cloves|1 cup bean sprouts|3 scallions|⅓ cup crushed peanuts|Lime wedges|Sauce: 3 tbsp soy sauce, 2 tbsp tamarind paste (or 1 tbsp rice vinegar + extra lime), 2 tbsp brown sugar, 1 tbsp sriracha|2 eggs (optional)","Soak the noodles in hot water for 8 to 10 minutes until flexible. Drain.|Whisk the sauce ingredients together.|Fry the tofu in the oil until golden. Add the garlic for 30 seconds.|Add the noodles and sauce and toss for 2 to 3 minutes.|Add the sprouts and scallions. Serve topped with peanuts and a squeeze of lime.|For the classic version, push the noodles aside, scramble 2 eggs in the pan, then toss everything together (optional)."],"Veggie fried rice":[3,"3 cups cooked rice, cold|2 tbsp oil|1 cup frozen peas and carrots|3 scallions, sliced|3 garlic cloves|3 tbsp soy sauce|1 tsp sesame oil|Cubed tofu (optional)|2 eggs, scrambled (optional)","Heat the oil in a large pan on high.|Cook the garlic and the peas and carrots for 2 minutes. Add the tofu if using.|Add the cold rice and press it into the pan. Stir-fry for 4 to 5 minutes.|Add the soy sauce, sesame oil and scallions and toss.|Push the rice to one side, scramble 2 eggs in the empty space, then mix them through (optional)."],"Vegetable stir-fry with tofu":[3,"14 oz firm tofu, pressed and cubed|2 tbsp oil|2 cups broccoli florets|1 bell pepper, 1 carrot, 1 cup snap peas|3 garlic cloves, 1 tbsp grated ginger|Sauce: 3 tbsp soy sauce, 1 tbsp cornstarch, 1 tbsp honey or sugar, 1 tbsp rice vinegar, ¼ cup water|Cooked rice to serve","Whisk the sauce ingredients.|Fry the tofu in 1 tbsp oil until golden. Set aside.|Stir-fry the vegetables in the remaining oil for 5 to 6 minutes. Add the garlic and ginger for 30 seconds.|Return the tofu, pour in the sauce and cook 1 to 2 minutes until glossy.|Serve over rice."],"Veggie sushi rolls":[4,"2 cups sushi rice|2¼ cups water|3 tbsp rice vinegar, 1 tbsp sugar, 1 tsp salt|5 nori sheets|1 cucumber, 1 carrot and 1 avocado, cut into thin strips|Soy sauce, wasabi, pickled ginger (optional)","Rinse the rice until the water runs clear. Boil with the water, cover and cook on low 15 minutes, then rest 10 minutes.|Stir in the vinegar, sugar and salt and let the rice cool.|Place a nori sheet on a bamboo mat. Spread a thin layer of rice, leaving an edge at the top.|Lay the vegetables across the bottom and roll up tightly.|Slice with a wet sharp knife and serve with soy sauce, wasabi and ginger."],"Veggie dumplings":[4,"30 dumpling wrappers|2 cups finely chopped cabbage|1 carrot, grated|4 mushrooms, chopped|2 scallions|2 garlic cloves, 1 tbsp grated ginger|2 tbsp soy sauce, 1 tsp sesame oil|Oil for the pan|Dipping sauce: soy sauce, rice vinegar, chili","Cook the vegetables, garlic and ginger in a little oil for 4 minutes. Stir in the soy sauce and sesame oil. Cool.|Put a spoonful of filling on each wrapper, wet the edge, fold and pinch shut.|Fry the dumplings in oil for 2 minutes until the bottoms are golden.|Add ¼ cup water, cover and steam 5 minutes.|Uncover and cook until the water is gone. Serve with the dipping sauce."],"Chana masala":[4,"2 tbsp oil|1 onion, finely chopped|3 garlic cloves, 1 tbsp grated ginger|1 tsp cumin seeds|1 can (14 oz) crushed tomatoes|2 cans (15 oz) chickpeas, drained|1½ tsp coriander powder, 1 tsp cumin powder, ½ tsp turmeric, ½ tsp chili powder|1 tsp garam masala|¾ cup water, salt|Cilantro and lemon|Rice or roti to serve","Heat the oil and add the cumin seeds. Add the onion and cook until golden, about 8 minutes.|Add the garlic and ginger for 1 minute, then the tomatoes and powdered spices. Cook 8 minutes until thick.|Add the chickpeas, water and salt. Simmer 15 minutes, mashing a few chickpeas to thicken.|Stir in the garam masala, lemon and cilantro. Serve with rice or roti."],"Paneer butter masala":[4,"8 oz paneer, cubed|2 tbsp butter + 1 tbsp oil|1 onion, chopped|3 garlic cloves, 1 tbsp grated ginger|4 tomatoes, chopped (or 1 can)|8 cashews|1 tsp chili powder, 1 tsp garam masala|½ cup cream or milk|Salt and a pinch of sugar|Rice or naan to serve","Cook the onion, garlic, ginger, tomatoes and cashews in the oil with a splash of water for 10 minutes until soft.|Blend until smooth.|Melt the butter in the pan. Add the sauce, chili powder, salt and sugar and simmer 5 minutes.|Add the paneer and cream and cook 3 to 4 minutes. Stir in the garam masala.|Serve with rice or naan."],"Palak paneer":[4,"1 lb fresh spinach (or 10 oz frozen)|8 oz paneer, cubed|1 tbsp oil or ghee|1 onion, chopped|2 tomatoes, chopped|3 garlic cloves, 1 tbsp ginger|1 green chili|1 tsp cumin seeds|½ tsp garam masala|¼ cup cream or milk|Salt|Rice or roti to serve","Boil the spinach for 2 minutes, drain and cool in cold water. Blend with the chili until smooth.|Heat the oil, add the cumin seeds, then the onion, garlic and ginger. Cook until golden.|Add the tomatoes and cook until soft.|Pour in the spinach puree and salt and simmer 5 minutes.|Add the paneer and cream and cook 3 minutes. Stir in the garam masala."],"Aloo gobi":[4,"2 tbsp oil|1 tsp cumin seeds|1 onion, chopped|3 garlic cloves, 1 tbsp grated ginger|2 potatoes, cubed|1 small cauliflower, in florets|1 tomato, chopped|1 tsp turmeric, 1 tsp coriander powder, ½ tsp chili powder|1 tsp garam masala|Salt and cilantro","Heat the oil and add the cumin seeds. Add the onion and cook until soft.|Add the garlic, ginger and spices and stir for 1 minute. Add the tomato.|Add the potatoes, cauliflower and salt. Mix well.|Cover and cook on low for 15 to 20 minutes, stirring now and then and adding a splash of water if it sticks.|Finish with garam masala and cilantro."],"Rajma chawal":[4,"2 cans (15 oz) kidney beans, drained (or 1 cup dried, soaked overnight and pressure-cooked)|2 tbsp oil|1 onion, finely chopped|3 garlic cloves, 1 tbsp ginger|3 tomatoes, pureed|1 tsp cumin seeds|1 tsp coriander powder, ½ tsp turmeric, 1 tsp chili powder|1 tsp garam masala|1½ cups water, salt|Cooked rice to serve","Heat the oil, add the cumin seeds, then the onion. Cook until golden.|Add the garlic and ginger, then the tomato puree and spices. Cook 8 to 10 minutes until the oil separates.|Add the beans, water and salt. Simmer 20 minutes, mashing a few beans to thicken.|Stir in the garam masala. Serve over rice."],"Dal tadka & rice":[4,"1 cup toor dal (or half toor, half moong)|3 cups water|½ tsp turmeric, salt|Tadka: 2 tbsp ghee or oil, 1 tsp cumin seeds, 3 garlic cloves sliced, 1 onion chopped, 1 tomato chopped, 2 dried red chilies, ½ tsp chili powder|Cilantro|Cooked rice to serve","Rinse the dal and cook with the water, turmeric and salt until very soft (about 3 whistles in a pressure cooker or 30 minutes on the stove). Whisk until creamy.|Heat the ghee, add the cumin, garlic and dried chilies until golden.|Add the onion and tomato and cook until soft. Stir in the chili powder.|Pour the tadka over the dal. Top with cilantro and serve with rice."],"Khichdi":[4,"½ cup rice|½ cup split yellow moong dal|4 cups water|½ tsp turmeric, 1 tsp salt|1 tbsp ghee|1 tsp cumin seeds, 1 tsp grated ginger|1 cup chopped vegetables (optional)|Yogurt or pickle to serve","Rinse the rice and dal.|Cook them with the water, turmeric, salt and vegetables until soft and porridge-like, about 25 minutes (or 3 whistles in a pressure cooker).|Heat the ghee, add the cumin and ginger for 30 seconds, and stir into the khichdi.|Serve warm with yogurt or pickle."],"Vegetable biryani":[6,"2 cups basmati rice, soaked 20 minutes|2 tbsp ghee or oil|2 onions, thinly sliced|1 cup yogurt|2 cups mixed vegetables (carrot, peas, beans, cauliflower)|2 tbsp ginger-garlic paste|2 tomatoes, chopped|Whole spices: 1 bay leaf, 4 cloves, 4 cardamom, 1 cinnamon stick|1½ tsp garam masala, ½ tsp turmeric, ½ tsp chili powder|Mint and cilantro, salt","Fry the onions in the ghee until deep golden. Set half aside for the top.|Add the ginger-garlic paste, tomatoes, vegetables, yogurt, spices and salt. Cook 10 minutes.|Boil the rice in salted water with the whole spices for 5 to 6 minutes, until about 70% cooked. Drain.|Layer the rice over the vegetables. Top with the reserved onions, mint and cilantro.|Cover tightly and cook on the lowest heat for 20 minutes. Rest 5 minutes, then gently mix."],"Vegetable pulao":[4,"1½ cups basmati rice, rinsed and soaked 15 minutes|2 tbsp oil or ghee|1 bay leaf, 2 cloves, 2 cardamom, 1 cinnamon stick|1 onion, sliced|1½ cups mixed vegetables|1 tsp ginger-garlic paste|½ tsp garam masala|2¼ cups water, salt","Heat the oil and cook the whole spices and onion until golden.|Add the ginger-garlic paste and vegetables and cook 3 minutes.|Add the drained rice and stir gently for 1 minute.|Add the water, salt and garam masala and bring to a boil.|Cover, lower the heat and cook 15 minutes. Rest 5 minutes and fluff."],"Baingan bharta":[4,"1 large eggplant (about 1½ lb)|2 tbsp oil|1 tsp cumin seeds|1 onion, chopped|3 garlic cloves, 1 tbsp ginger|2 tomatoes, chopped|1 green chili|½ tsp turmeric, 1 tsp coriander powder, ½ tsp chili powder|½ tsp garam masala|Salt and cilantro|Roti or rice to serve","Heat the oven to 425°F (220°C). Prick the eggplant and roast 35 to 40 minutes until collapsed. Cool, peel and mash.|Heat the oil, add the cumin seeds, then the onion, garlic, ginger and chili. Cook until golden.|Add the tomatoes and spices and cook until soft.|Add the mashed eggplant and salt. Cook 8 to 10 minutes. Finish with garam masala and cilantro."],"Veggie curry with naan":[4,"2 tbsp oil|1 onion, chopped|3 garlic cloves, 1 tbsp ginger|2 tbsp curry powder|1 can (14 oz) coconut milk|1 can (14 oz) diced tomatoes|4 cups vegetables (potato, cauliflower, carrot, peas, spinach)|Salt and cilantro|Naan and rice to serve","Cook the onion in the oil until soft. Add the garlic, ginger and curry powder for 1 minute.|Add the tomatoes, coconut milk, harder vegetables (potatoes, carrots) and salt.|Simmer 15 minutes, then add the softer vegetables and cook 8 to 10 minutes more.|Top with cilantro and serve with warm naan and rice."],"Chocolate chip cookies":[24,"1 cup (2 sticks) butter, softened|¾ cup brown sugar|½ cup white sugar|2 eggs|2 tsp vanilla|2¼ cups flour|1 tsp baking soda|1 tsp salt|2 cups chocolate chips","Heat the oven to 350°F (175°C).|Beat the butter and both sugars until creamy. Beat in the eggs one at a time, then the vanilla.|Stir in the flour, baking soda and salt, then the chocolate chips.|Scoop tablespoon-sized balls onto lined baking sheets, leaving space between them.|Bake 10 to 12 minutes until the edges are golden. Cool 5 minutes on the tray."],"Baked apples with cinnamon":[4,"4 apples|¼ cup rolled oats|2 tbsp brown sugar|1 tsp cinnamon|2 tbsp butter, softened|¼ cup chopped walnuts (optional)|½ cup apple juice or water","Heat the oven to 375°F (190°C).|Core the apples, leaving the bottom intact.|Mix the oats, sugar, cinnamon, butter and nuts. Stuff into the apples.|Stand them in a baking dish and pour the juice around them.|Bake 30 to 35 minutes until tender."],"Kheer":[4,"½ cup basmati rice, washed and soaked 20 minutes|4 cups whole milk|½ cup sugar (adjust to taste)|4 cardamom pods, crushed|2 tbsp chopped almonds or pistachios|1 tbsp raisins|Pinch of saffron (optional)","Bring the milk to a boil in a heavy pot.|Add the drained rice and simmer on low for 30 minutes, stirring often so it doesn't stick.|Stir in the sugar, cardamom, nuts, raisins and saffron.|Cook 5 more minutes. Serve warm or chilled."],"Ice cream with fruit":[2,"4 scoops ice cream|2 cups fruit (berries, banana, mango)|Honey or chocolate sauce|Chopped nuts (optional)","Scoop the ice cream into bowls.|Top with the fruit, a drizzle of honey or chocolate sauce and some nuts."],"Banana bread":[8,"3 ripe bananas|⅓ cup melted butter|¾ cup sugar|1 egg|1 tsp vanilla|1 tsp baking soda|Pinch of salt|1½ cups flour|½ cup walnuts (optional)","Heat the oven to 350°F (175°C). Grease a loaf pan.|Mash the bananas and mix in the butter, sugar, egg and vanilla.|Stir in the baking soda and salt, then fold in the flour and nuts until just combined.|Pour into the pan and bake 50 to 60 minutes until a toothpick comes out clean.|Cool 10 minutes before slicing."],"Gulab jamun":[6,"1 cup milk powder|¼ cup flour|¼ tsp baking powder|2 tbsp ghee or butter|About ¼ cup warm milk|Oil or ghee for frying|Syrup: 1½ cups sugar, 1½ cups water, 3 cardamom pods, squeeze of lemon, a few drops of rose water","Make the syrup: boil the sugar, water and cardamom for 5 minutes until slightly sticky. Add lemon and rose water. Keep warm.|Mix the milk powder, flour, baking powder and ghee. Add warm milk a little at a time to make a soft dough. Rest 10 minutes.|Roll into small smooth, crack-free balls.|Fry in oil on low heat for 6 to 8 minutes, turning, until deep golden.|Drop into the warm syrup and soak for at least 30 minutes."],"Brownies":[9,"½ cup butter, melted|1 cup sugar|2 eggs|1 tsp vanilla|⅓ cup cocoa powder|½ cup flour|¼ tsp salt|¼ tsp baking powder|½ cup chocolate chips","Heat the oven to 350°F (175°C). Line an 8-inch pan.|Whisk the melted butter and sugar, then beat in the eggs and vanilla.|Stir in the cocoa, flour, salt and baking powder until just combined. Fold in the chocolate chips.|Pour into the pan and bake 25 to 30 minutes. A toothpick should come out with a few moist crumbs.|Cool fully before cutting."],"Yogurt with honey & nuts":[1,"1 cup yogurt|1 tbsp honey|¼ cup chopped nuts|Fresh fruit (optional)","Spoon the yogurt into a bowl.|Top with honey, nuts and fruit."],"Popcorn":[4,"½ cup popcorn kernels|2 tbsp oil|Salt|Melted butter (optional)","Heat the oil in a large pot with 3 kernels. Cover.|When those pop, add the rest of the kernels. Cover and shake the pot now and then.|Take off the heat when the popping slows to a few seconds between pops.|Toss with salt and butter."],"Apple slices with peanut butter":[2,"2 apples|4 tbsp peanut butter|Cinnamon (optional)","Core and slice the apples.|Serve with the peanut butter for dipping. Sprinkle with cinnamon."],"Samosas":[12,"Dough: 2 cups flour, ¼ cup oil, ½ tsp salt, about ½ cup water|Filling: 3 boiled potatoes, mashed|½ cup peas|1 tbsp oil|1 tsp cumin seeds|1 tsp coriander powder, ½ tsp garam masala, ½ tsp chili powder|1 tsp grated ginger, 1 green chili|Salt|Oil for frying, or bake at 400°F","Mix the dough ingredients into a stiff dough. Cover and rest 20 minutes.|Heat the oil, add the cumin and ginger, then the spices, peas, potatoes and salt. Mix and cool.|Divide the dough into 6 balls. Roll each into an oval and cut in half.|Shape each half into a cone, fill, and seal the edge with water.|Fry in medium-hot oil for 8 to 10 minutes until golden, or bake at 400°F (200°C) for 25 minutes, flipping once."],"Cheese & crackers":[2,"Crackers|Cheese (slices or cubes)|Grapes or apple slices (optional)","Slice or cube the cheese.|Arrange the crackers and cheese on a plate with the fruit."],"Hummus with pita & veggies":[3,"1 cup hummus (store-bought or homemade)|Pita bread|Vegetable sticks for dipping (carrot, cucumber, bell pepper)","If making your own hummus, blend 1 can (15 oz) chickpeas, ¼ cup tahini, 2 tbsp lemon juice, 1 garlic clove, 2 tbsp olive oil and ½ tsp salt with 3 to 4 tbsp water until smooth.|Warm the pita and cut it into wedges.|Serve the hummus with the pita and vegetable sticks."],"French fries":[4,"4 large russet potatoes|3 tbsp oil|1 tsp salt|½ tsp paprika|Ketchup to serve","Heat the oven to 450°F (230°C) with a baking sheet inside.|Cut the potatoes into sticks. Pat them very dry.|Toss with the oil, salt and paprika.|Spread on the hot baking sheet in a single layer.|Bake 25 to 30 minutes, flipping halfway, until crisp and golden."],"Vegetable tempura":[3,"1 cup flour|¼ cup cornstarch|1 cup ice-cold water|½ tsp salt|3 cups sliced vegetables (sweet potato, broccoli, bell pepper, zucchini, mushrooms)|Oil for frying|Dipping sauce: ¼ cup soy sauce, ¼ cup water, 1 tsp sugar","Heat about 2 inches of oil to 350°F (175°C).|Mix the flour, cornstarch, salt and ice-cold water until just combined. A lumpy batter is fine.|Dip the vegetables in the batter and fry in batches for 2 to 3 minutes until pale golden and crisp.|Drain on paper towels.|Stir the dipping sauce ingredients together and serve with the hot tempura, rice or soba."],"Miso soup with tofu":[2,"3 cups water|1 piece kombu (dried kelp, about 4 inches)|3 tbsp miso paste|½ block (7 oz) soft tofu, cubed|2 scallions, sliced|1 tbsp dried wakame (optional)","Soak the kombu in the water for 10 minutes, then heat until just before boiling. Remove the kombu. (You can use vegetable broth instead.)|Lower the heat. Stir the miso with a ladle of the hot broth until smooth, then stir it back into the pot. Don't let it boil.|Add the tofu, scallions and wakame and heat gently for 1 to 2 minutes."],"Vegetable udon":[2,"2 portions udon noodles|4 cups vegetable broth|2 tbsp soy sauce|1 tbsp mirin or 1 tsp sugar|8 oz mushrooms, sliced|1 carrot, sliced thin|2 cups spinach|2 scallions, sliced|Sesame seeds (optional)","Simmer the broth, soy sauce, mirin, mushrooms and carrot for 8 minutes.|Cook the udon following the package directions and drain.|Add the spinach to the broth for 1 minute.|Divide the noodles between bowls and ladle the hot broth and vegetables over.|Top with scallions and sesame seeds."],"Teriyaki tofu with rice":[3,"14 oz firm tofu, pressed and cubed|1 tbsp cornstarch|2 tbsp oil|Sauce: 3 tbsp soy sauce, 2 tbsp brown sugar, 1 tbsp rice vinegar, 1 tsp grated ginger, 1 garlic clove, ¼ cup water|2 cups steamed broccoli|Cooked rice","Toss the tofu with the cornstarch.|Pan-fry in the oil for about 8 minutes, turning, until golden on all sides.|Whisk the sauce ingredients, pour into the pan and simmer 2 to 3 minutes until thick and glossy.|Serve over rice with the broccoli."],"Onigiri (rice balls)":[4,"3 cups warm cooked sushi rice|Salt|4 strips nori|Fillings of your choice (avocado, cucumber, pickled plum, sesame) (optional)","Wet your hands and sprinkle them with a little salt.|Take about ¾ cup of rice, press a dent in the middle and add a small spoonful of filling.|Cover the filling with rice and shape into a triangle or ball, pressing firmly.|Wrap the bottom with a strip of nori. Eat the same day."],"Vegetable yakisoba":[3,"3 portions yakisoba noodles (or ramen noodles)|2 tbsp oil|4 cups sliced vegetables (cabbage, carrot, bell pepper, mushrooms)|3 scallions|Sauce: 3 tbsp soy sauce, 1 tbsp ketchup, 1 tbsp sugar, 1 tsp sesame oil|Pickled ginger (optional)","Loosen the noodles in hot water for 1 minute and drain.|Stir-fry the vegetables in the oil on high heat for 4 to 5 minutes.|Add the noodles and the sauce and toss for 2 to 3 minutes.|Stir in the scallions and top with pickled ginger."],"Japanese vegetable curry":[4,"2 tbsp oil|1 onion, chopped|2 potatoes, cubed|2 carrots, sliced|3 cups vegetable broth|Roux: 3 tbsp butter, 3 tbsp flour, 2 tbsp curry powder, 1 tsp sugar, 1 tbsp soy sauce|1 apple, grated (optional)|Cooked rice to serve","Cook the onion in the oil until soft. Add the potatoes, carrots and broth and simmer 15 minutes until tender.|Make the roux: melt the butter, whisk in the flour and curry powder and cook 2 minutes until golden.|Whisk a ladle of the hot broth into the roux until smooth, then stir it all back into the pot.|Add the sugar, soy sauce and apple and simmer 8 minutes until thick.|Serve over rice."],"Edamame with sea salt":[2,"2 cups edamame in pods (fresh or frozen)|Coarse sea salt|Lemon wedge (optional)","Boil the edamame in salted water for 4 to 5 minutes until tender.|Drain and toss with coarse salt and a squeeze of lemon.|Squeeze the beans out of the pods into your mouth."],"Cucumber sunomono salad":[2,"2 cucumbers, thinly sliced|3 tbsp rice vinegar|1 tbsp sugar|1 tbsp soy sauce|1 tsp sesame seeds|½ tsp salt","Toss the cucumbers with the salt and leave 5 minutes. Squeeze out the water.|Whisk the vinegar, sugar and soy sauce until the sugar dissolves.|Toss with the cucumbers and chill 10 minutes. Sprinkle with sesame seeds."],"Thai green curry":[4,"1 tbsp oil|2 tbsp green curry paste (check the label, some contain shrimp)|1 can (14 oz) coconut milk|1 cup vegetable broth|14 oz firm tofu, cubed|3 cups vegetables (bell pepper, zucchini, green beans, baby corn)|1 tbsp soy sauce|1 tsp sugar|Thai basil or regular basil|Lime wedges|Cooked rice to serve","Fry the curry paste in the oil for 1 minute until fragrant.|Stir in the coconut milk, then the broth, and bring to a gentle simmer.|Add the vegetables and tofu and cook 8 to 10 minutes until tender.|Stir in the soy sauce and sugar. Add the basil.|Serve over rice with lime wedges."],"Thai red curry with sweet potato":[4,"1 tbsp oil|2 tbsp red curry paste (check the label, some contain shrimp)|1 can (14 oz) coconut milk|1 cup vegetable broth|2 sweet potatoes, cubed|1 can (15 oz) chickpeas, drained|2 cups spinach|1 tbsp soy sauce|1 tsp sugar|Lime wedges|Cooked rice to serve","Fry the curry paste in the oil for 1 minute.|Add the coconut milk and broth and bring to a simmer.|Add the sweet potatoes and cook 12 to 15 minutes until almost tender.|Add the chickpeas and cook 5 minutes. Stir in the spinach, soy sauce and sugar.|Serve over rice with lime."],"Tom kha mushroom soup":[3,"1 tbsp oil|1 stalk lemongrass, bruised and cut in pieces|1 inch ginger, sliced|3 cups vegetable broth|1 can (14 oz) coconut milk|8 oz mushrooms, sliced|1 tomato, cut in wedges|7 oz tofu, cubed|1 tbsp soy sauce|1 tsp sugar|Juice of 1 lime|Cilantro and sliced chili (optional)","Warm the oil and cook the lemongrass and ginger for 1 minute.|Add the broth and coconut milk and bring to a gentle simmer for 10 minutes.|Add the mushrooms, tomato and tofu and cook 8 minutes.|Season with the soy sauce, sugar and lime juice. Top with cilantro and chili."],"Thai basil tofu stir-fry":[3,"14 oz firm tofu, pressed and cubed|2 tbsp oil|4 garlic cloves, minced|2 green chilies, sliced|1 bell pepper, sliced|1 cup green beans, cut in pieces|Sauce: 2 tbsp soy sauce, 1 tbsp brown sugar, 1 tbsp water|1 cup fresh basil leaves|Cooked rice to serve","Fry the tofu in 1 tbsp oil until golden. Set aside.|Stir-fry the garlic and chilies in the rest of the oil for 30 seconds. Add the pepper and green beans and cook 4 minutes.|Return the tofu, add the sauce and toss for 1 to 2 minutes.|Stir in the basil until wilted. Serve over rice."],"Thai peanut noodles":[3,"8 oz noodles (rice noodles or spaghetti)|¼ cup peanut butter|3 tbsp soy sauce|2 tbsp lime juice|1 tbsp brown sugar|1 tsp grated ginger|1 garlic clove|2 tbsp warm water|1 cup shredded cabbage|1 carrot, shredded|¼ cup crushed peanuts (optional)|Cilantro (optional)","Cook the noodles following the package directions, drain and rinse.|Whisk the peanut butter, soy sauce, lime juice, sugar, ginger, garlic and warm water into a smooth sauce.|Toss the noodles with the sauce, cabbage and carrot.|Top with peanuts and cilantro."],"Pineapple fried rice":[3,"3 cups cooked rice, cold|1 tbsp oil|1 cup pineapple chunks|½ cup frozen peas|1 carrot, diced|¼ cup cashews|2 garlic cloves|2 tbsp soy sauce|1 tsp curry powder|Scallions and cilantro (optional)|2 eggs, scrambled (optional)","Heat the oil in a large pan on high. Cook the garlic, carrot and peas for 2 minutes.|Add the cold rice and press it into the pan. Stir-fry 4 minutes.|Add the pineapple, cashews, soy sauce and curry powder and toss for 2 minutes.|Top with scallions and cilantro.|Push the rice to one side, scramble 2 eggs in the empty space, then mix them through (optional)."],"Mango sticky rice":[4,"1 cup sticky (glutinous) rice, soaked 30 minutes|1 cup coconut milk, divided|3 tbsp sugar|¼ tsp salt|2 ripe mangoes, sliced|Sesame seeds (optional)","Drain the rice and steam it over boiling water for 20 to 25 minutes until tender and glossy.|Warm ¾ cup of the coconut milk with the sugar and salt until dissolved.|Stir the hot rice into the coconut milk, cover and let stand 15 minutes.|Warm the remaining ¼ cup coconut milk with a pinch of salt.|Serve the rice with sliced mango, a drizzle of coconut milk and sesame seeds."],"Thai cucumber salad":[3,"2 cucumbers, sliced|¼ cup rice vinegar|2 tbsp sugar|1 small red onion, sliced thin|1 green chili, sliced (optional)|2 tbsp crushed peanuts (optional)|Cilantro (optional)","Warm the vinegar and sugar until the sugar dissolves, then let it cool.|Toss the cucumber and onion with the dressing.|Top with chili, peanuts and cilantro."],"Gnocchi with tomato sauce":[3,"1 lb potato gnocchi|1 tbsp olive oil|2 garlic cloves|1 can (14 oz) crushed tomatoes|1 tsp Italian seasoning|Salt|Fresh basil (optional)|Grated cheese (optional)","Warm the garlic in the oil for 30 seconds. Add the tomatoes, seasoning and salt and simmer 10 minutes.|Boil the gnocchi in salted water until they float, 2 to 3 minutes. Drain.|Toss with the sauce. Top with basil and cheese."],"Mushroom risotto":[4,"1½ cups arborio rice|4 cups hot vegetable broth|1 lb mushrooms, sliced|1 onion, chopped|3 garlic cloves|2 tbsp butter|1 tbsp olive oil|½ cup grated vegetarian hard cheese|½ cup white wine (optional)|Salt, pepper and parsley","Brown the mushrooms in the butter and oil for 6 minutes. Set aside.|Cook the onion for 3 minutes, add the garlic for 1 minute, then stir in the rice for 1 to 2 minutes.|Add the wine, if using. Then add the hot broth one ladle at a time, stirring until each is absorbed. This takes 20 to 25 minutes.|Stir in the mushrooms, cheese and a little more butter. Rest 2 minutes and top with parsley."],"Minestrone soup":[6,"2 tbsp olive oil|1 onion, 2 carrots and 2 celery stalks, diced|3 garlic cloves|1 can (14 oz) diced tomatoes|6 cups vegetable broth|1 can (15 oz) white beans, drained|1 zucchini, diced|1 cup small pasta|2 cups spinach or kale|1 tsp Italian seasoning|Salt and pepper|Grated cheese (optional)","Cook the onion, carrots and celery in the oil for 6 minutes. Add the garlic for 1 minute.|Add the tomatoes, broth, beans, zucchini, seasoning, salt and pepper. Simmer 15 minutes.|Add the pasta and cook until tender, about 8 minutes. Stir in the greens until wilted.|Serve with grated cheese."],"Bruschetta":[4,"1 baguette, sliced|4 ripe tomatoes, diced|2 garlic cloves|2 tbsp olive oil|Fresh basil|1 tsp balsamic vinegar|Salt and pepper","Toast the baguette slices under the broiler for 2 to 3 minutes per side.|Rub each slice with a cut garlic clove.|Mix the tomatoes with the oil, basil, balsamic, salt and pepper.|Spoon onto the toast and serve right away."],"Spaghetti aglio e olio":[3,"12 oz spaghetti|⅓ cup olive oil|6 garlic cloves, thinly sliced|½ tsp chili flakes|Chopped parsley|Salt|Grated cheese (optional)","Boil the spaghetti in salted water. Save a cup of pasta water, then drain.|Warm the oil on low and cook the garlic gently until pale golden, about 3 minutes. Add the chili flakes.|Toss in the spaghetti with a splash of pasta water until glossy.|Top with parsley and cheese."],"Penne arrabbiata":[3,"12 oz penne|2 tbsp olive oil|4 garlic cloves|1 tsp chili flakes|1 can (28 oz) crushed tomatoes|Salt|Fresh parsley (optional)|Grated cheese (optional)","Cook the garlic and chili flakes in the oil for 1 minute.|Add the tomatoes and salt and simmer 15 minutes.|Cook the penne, drain and toss with the sauce.|Top with parsley and cheese."],"Spinach & ricotta stuffed shells":[6,"20 jumbo pasta shells|15 oz ricotta|10 oz frozen spinach, thawed and squeezed dry|1 cup shredded mozzarella|¼ cup grated cheese|3 cups marinara sauce|1 tsp Italian seasoning|Salt and pepper","Heat the oven to 375°F (190°C). Boil the shells 2 minutes less than the package says and drain.|Mix the ricotta, spinach, half the mozzarella, the grated cheese, seasoning, salt and pepper.|Spread 1 cup of sauce in a baking dish. Fill the shells and set them in the dish.|Top with the rest of the sauce and the mozzarella.|Cover with foil and bake 25 minutes, then uncover and bake 10 minutes."],"Pasta e fagioli":[4,"2 tbsp olive oil|1 onion, 2 carrots and 2 celery stalks, diced|3 garlic cloves|1 can (14 oz) crushed tomatoes|4 cups vegetable broth|2 cans (15 oz) white beans, drained|1 cup small pasta|1 tsp rosemary or Italian seasoning|Salt and pepper|Grated cheese (optional)","Cook the onion, carrots and celery in the oil for 6 minutes. Add the garlic for 1 minute.|Add the tomatoes, broth, beans, rosemary, salt and pepper and simmer 15 minutes. Mash a few beans to thicken.|Add the pasta and cook until tender, about 8 minutes.|Serve with cheese."],"Panzanella (Italian bread salad)":[3,"4 cups cubed day-old crusty bread|4 ripe tomatoes, chopped|1 cucumber, chopped|½ red onion, thinly sliced|Fresh basil|3 tbsp olive oil|2 tbsp red wine vinegar|Salt and pepper","Toast the bread cubes on a baking sheet at 400°F (200°C) for 8 to 10 minutes until crisp.|Toss the tomatoes, cucumber, onion and basil with the oil, vinegar, salt and pepper.|Add the bread and let it sit 10 minutes before serving."],"Affogato":[2,"4 scoops vanilla ice cream|½ cup hot espresso or strong coffee|Chopped nuts or chocolate shavings (optional)","Scoop the ice cream into two glasses.|Pour the hot coffee over the top and serve right away."],"Bean & cheese enchiladas":[4,"8 tortillas (corn or flour)|1 can (15 oz) beans (refried or black)|1 can (19 oz) enchilada sauce|2 cups shredded cheese|1 cup corn|½ onion, chopped|Sour cream and cilantro (optional)","Heat the oven to 375°F (190°C).|Mix the beans, corn, onion and half the cheese.|Warm the tortillas. Fill each with the bean mixture and roll up.|Spread a thin layer of sauce in a baking dish. Place the enchiladas seam-side down and cover with the rest of the sauce and cheese.|Bake 20 to 25 minutes until bubbly."],"Chilaquiles":[2,"4 cups tortilla chips|1½ cups salsa (green or red)|½ cup crumbled cheese (queso fresco or feta)|½ onion, thinly sliced|1 avocado, sliced (optional)|Sour cream and cilantro (optional)|2 fried eggs (optional)","Warm the salsa in a large pan until simmering.|Add the chips and toss for 1 to 2 minutes until coated but still a little crisp.|Top with the cheese, onion, avocado, sour cream and cilantro. Eat right away.|Top each serving with a fried egg if you like (optional)."],"Esquites (street corn salad)":[4,"4 cups corn kernels (fresh or frozen)|1 tbsp oil|3 tbsp sour cream or plain yogurt|½ cup crumbled cheese (cotija or feta)|Juice of 1 lime|1 tsp chili powder|Cilantro (optional)","Heat the oil in a large pan on high. Cook the corn for 6 to 8 minutes, stirring now and then, until charred in spots.|Let it cool for 2 minutes, then stir in the sour cream, lime juice and chili powder.|Top with the cheese and cilantro."],"Guacamole & chips":[4,"3 ripe avocados|1 small onion, finely chopped|1 tomato, diced|Juice of 1 lime|¼ cup chopped cilantro|1 jalapeño, minced (optional)|½ tsp salt|Tortilla chips to serve","Mash the avocados with a fork, leaving some chunks.|Stir in the onion, tomato, lime juice, cilantro, jalapeño and salt.|Taste and add more lime or salt. Serve with the chips."],"Mexican rice":[4,"1½ cups long-grain rice|2 tbsp oil|½ onion, finely chopped|2 garlic cloves|1 can (8 oz) tomato sauce|2½ cups vegetable broth or water|1 tsp cumin|Salt|½ cup peas (optional)|Cilantro (optional)","Fry the rice in the oil for 3 to 4 minutes until lightly golden.|Add the onion and garlic and cook 1 minute.|Add the tomato sauce, broth, cumin and salt and bring to a boil.|Cover, lower the heat as far as it will go and cook 15 to 18 minutes. Rest 5 minutes, then fluff."],"Tortilla soup":[4,"1 tbsp oil|1 onion, chopped|3 garlic cloves|1 can (14 oz) diced tomatoes (fire-roasted if you have them)|4 cups vegetable broth|1 can (15 oz) black beans, drained|1 cup corn|1 tsp cumin, 1 tsp chili powder|Juice of 1 lime|4 corn tortillas, cut in strips|Toppings: avocado, cheese, cilantro, sour cream","Toss the tortilla strips with a little oil and bake at 400°F (200°C) for 8 to 10 minutes until crisp.|Cook the onion in the oil for 5 minutes. Add the garlic and spices for 1 minute.|Add the tomatoes, broth, beans and corn. Simmer 15 minutes. Stir in the lime juice.|Ladle into bowls and top with the tortilla strips and your toppings."],"Vegetarian mapo tofu":[3,"14 oz tofu (soft or firm), cubed|2 tbsp oil|1 tbsp chili bean paste (or any chili paste)|3 garlic cloves|1 tbsp grated ginger|1 cup mushrooms, finely chopped|2 tbsp soy sauce|1 tsp sugar|½ cup vegetable broth|1 tbsp cornstarch mixed with 2 tbsp water|2 scallions, sliced|½ tsp ground Sichuan pepper (optional)|Cooked rice to serve","Cook the mushrooms in the oil until browned, about 5 minutes.|Add the chili paste, garlic and ginger and stir 1 minute.|Add the broth, soy sauce and sugar, then gently add the tofu and simmer 5 minutes.|Stir in the cornstarch mixture until thick. Top with scallions and Sichuan pepper.|Serve over rice."],"Kung pao tofu":[3,"14 oz firm tofu, pressed and cubed|2 tbsp oil|1 bell pepper, diced|1 cup zucchini or celery, diced|½ cup roasted peanuts|3 garlic cloves|1 tbsp grated ginger|3 dried red chilies (optional)|Sauce: 3 tbsp soy sauce, 1 tbsp rice vinegar, 1 tbsp sugar, 1 tsp cornstarch, 2 tbsp water|Cooked rice to serve","Fry the tofu in 1 tbsp oil until golden. Set aside.|Stir-fry the pepper and zucchini in the rest of the oil for 4 minutes. Add the garlic, ginger and chilies for 30 seconds.|Return the tofu, add the peanuts and the sauce and toss until thick and glossy.|Serve over rice."],"Vegetable lo mein":[3,"8 oz noodles (lo mein or spaghetti)|2 tbsp oil|3 cups sliced vegetables (cabbage, carrot, bell pepper, mushrooms)|3 garlic cloves|1 tbsp grated ginger|Sauce: 3 tbsp soy sauce, 1 tbsp sugar, 1 tsp sesame oil, 1 tbsp rice vinegar|2 scallions","Cook the noodles, drain and toss with a little oil.|Stir-fry the vegetables in the oil on high heat for 4 minutes. Add the garlic and ginger for 30 seconds.|Add the noodles and sauce and toss for 2 minutes. Stir in the scallions."],"Sweet & sour tofu":[3,"14 oz firm tofu, pressed and cubed|3 tbsp cornstarch|3 tbsp oil|1 bell pepper, cut in chunks|1 onion, cut in chunks|1 cup pineapple chunks|Sauce: ¼ cup ketchup, 3 tbsp sugar, 3 tbsp rice vinegar, 1 tbsp soy sauce, ¼ cup water|Cooked rice to serve","Toss the tofu in the cornstarch. Fry in the oil until crisp and golden on all sides. Set aside.|Stir-fry the pepper and onion for 3 to 4 minutes.|Add the sauce and pineapple and simmer 2 minutes until slightly thick.|Stir in the tofu and serve over rice."],"Vegetable spring rolls":[4,"8 spring roll wrappers|2 cups shredded cabbage|1 carrot, shredded|4 mushrooms, chopped|2 garlic cloves|1 tsp grated ginger|1 tbsp soy sauce|1 tsp sesame oil|Oil for brushing or frying|Sweet chili sauce to serve","Cook the cabbage, carrot, mushrooms, garlic and ginger in a little oil for 4 minutes. Stir in the soy sauce and sesame oil and let it cool.|Place a spoonful of filling on each wrapper, fold in the sides and roll up tightly, sealing the edge with water.|Brush with oil and bake at 425°F (220°C) for 15 to 20 minutes, flipping once. Or fry for 3 minutes until golden."],"Scallion pancakes":[4,"2 cups flour|¾ cup hot water|½ tsp salt|4 scallions, finely chopped|3 tbsp oil, plus more for frying|Dipping sauce: 3 tbsp soy sauce, 1 tbsp rice vinegar, 1 tsp sesame oil","Mix the flour, salt and hot water into a dough. Knead 5 minutes, then cover and rest 30 minutes.|Divide into 4 pieces. Roll each into a thin circle, brush with oil and sprinkle with scallions.|Roll up into a log, coil it into a spiral, then flatten and roll out to about ¼ inch thick.|Pan-fry in a little oil for 2 to 3 minutes per side until golden and flaky.|Cut into wedges and serve with the dipping sauce."],"Dan dan noodles":[3,"8 oz noodles|2 tbsp peanut butter or tahini|3 tbsp soy sauce|1 tbsp rice vinegar|1 tbsp chili oil (or to taste)|1 tsp sugar|1 garlic clove, grated|2 cups baby spinach or bok choy|2 scallions|Crushed peanuts (optional)","Cook the noodles. Add the spinach for the last minute, then drain.|Whisk the peanut butter, soy sauce, vinegar, chili oil, sugar and garlic with a splash of the noodle water.|Toss the noodles and greens with the sauce.|Top with scallions and peanuts."],"Vegetable bibimbap":[3,"3 cups cooked rice|7 oz firm tofu, sliced and pan-fried|1 carrot, cut into matchsticks|1 zucchini, cut into matchsticks|2 cups spinach|1 cup bean sprouts|4 mushrooms, sliced|2 tbsp sesame oil|3 tbsp soy sauce|2 tbsp gochujang (Korean chili paste)|1 tsp sugar|Sesame seeds (optional)|2 fried eggs (optional)","Cook each vegetable separately in a little sesame oil for 2 to 3 minutes with a pinch of salt. Blanch the spinach for 1 minute and squeeze dry.|Pan-fry the tofu until golden.|Mix the gochujang, 1 tbsp soy sauce, sugar and 1 tbsp water into a sauce.|Divide the rice between bowls and arrange the vegetables and tofu on top.|Add a spoonful of sauce and mix everything together before eating.|Fry 2 eggs sunny-side up and place one on top of each bowl (optional)."],"Japchae (glass noodle stir-fry)":[4,"8 oz sweet potato glass noodles|2 tbsp oil|4 cups sliced vegetables (carrot, onion, mushrooms, bell pepper, spinach)|3 garlic cloves|Sauce: 4 tbsp soy sauce, 2 tbsp sugar, 2 tbsp sesame oil|Sesame seeds (optional)","Cook the noodles following the package directions, drain, rinse and cut them a few times with scissors.|Stir-fry the vegetables and garlic in the oil for 5 minutes.|Add the noodles and the sauce and toss for 2 to 3 minutes.|Top with sesame seeds. Serve warm or at room temperature."],"Tteokbokki (spicy rice cakes)":[3,"1 lb Korean rice cakes (tteok)|2 cups vegetable broth|3 tbsp gochujang|1 tbsp soy sauce|1 tbsp sugar|2 scallions|1 cup cabbage, sliced|Sesame seeds (optional)","Soak the rice cakes in warm water for 10 minutes if they are hard. Drain.|Simmer the broth, gochujang, soy sauce and sugar in a wide pan.|Add the rice cakes and cabbage and cook 8 to 10 minutes, stirring often, until the sauce is thick and the rice cakes are soft.|Add the scallions and sesame seeds."],"Tabbouleh":[4,"½ cup fine bulgur|1 cup boiling water|3 cups finely chopped parsley|½ cup chopped mint|3 tomatoes, diced|1 cucumber, diced|4 scallions, chopped|¼ cup olive oil|Juice of 2 lemons|Salt","Pour the boiling water over the bulgur and let it stand 15 minutes. Drain well if needed.|Mix the parsley, mint, tomatoes, cucumber and scallions in a bowl.|Add the bulgur, oil, lemon juice and salt and toss. Chill until ready to serve."],"Mujaddara (lentils & rice)":[4,"1 cup brown lentils, rinsed|1 cup rice|3 large onions, thinly sliced|⅓ cup oil|1 tsp cumin|½ tsp cinnamon|4 cups water|Salt and pepper|Plain yogurt to serve","Cook the onions slowly in the oil for 25 to 30 minutes, stirring often, until deep brown and crisp at the edges. Set half aside.|Simmer the lentils in the water for 15 minutes.|Add the rice, half the onions, the cumin, cinnamon and salt. Cover and cook on low for 18 to 20 minutes until the water is absorbed.|Top with the remaining onions and serve with yogurt."],"Baba ganoush":[4,"2 large eggplants|3 tbsp tahini|2 garlic cloves, minced|Juice of 1 lemon|2 tbsp olive oil|½ tsp salt|1 tsp cumin (optional)|Pita bread and vegetables, to serve","Heat the oven to 450°F (230°C). Prick the eggplants and roast on a baking sheet for about 40 minutes until collapsed.|Cool, scoop out the flesh and drain off the liquid.|Mash with the tahini, garlic, lemon juice, oil and salt. Drizzle with more oil."],"Roasted vegetable couscous":[4,"1½ cups couscous|1½ cups hot vegetable broth|4 cups vegetables (zucchini, bell pepper, red onion, cherry tomatoes), chopped|1 can (15 oz) chickpeas, drained|3 tbsp olive oil|1 tsp cumin, 1 tsp paprika|Juice of 1 lemon|Parsley (optional)|Salt and pepper","Heat the oven to 425°F (220°C). Toss the vegetables and chickpeas with the oil, spices, salt and pepper and roast 20 to 25 minutes.|Pour the hot broth over the couscous, cover and leave 5 minutes. Fluff with a fork.|Mix in the roasted vegetables and lemon juice. Top with parsley."],"Chickpea shawarma wrap":[3,"2 cans (15 oz) chickpeas, drained and dried|2 tbsp olive oil|1 tsp cumin, 1 tsp paprika, 1 tsp garlic powder, ½ tsp turmeric, ½ tsp cinnamon|3 pitas|Sauce: ½ cup yogurt, 1 tbsp tahini, juice of ½ lemon, 1 garlic clove|Lettuce, tomato and cucumber to serve","Heat the oven to 425°F (220°C). Toss the chickpeas with the oil and spices and roast 20 to 25 minutes until crisp.|Whisk the sauce ingredients together.|Warm the pitas, fill with the chickpeas and vegetables and drizzle with the sauce."],"Fresh spring rolls with peanut sauce":[4,"8 rice paper wrappers|4 oz rice vermicelli noodles, cooked|1 cucumber, cut in strips|1 carrot, cut in strips|1 cup lettuce, shredded|½ cup mint and cilantro|7 oz baked tofu or avocado, sliced|Peanut sauce: 3 tbsp peanut butter, 2 tbsp soy sauce, 1 tbsp lime juice, 1 tbsp sugar, 2 tbsp warm water","Cook the vermicelli following the package directions, then rinse in cold water.|Whisk the peanut sauce ingredients until smooth.|Dip a rice paper wrapper in warm water for about 10 seconds until just soft and lay it flat.|Put the noodles, vegetables, herbs and tofu near the bottom, fold in the sides and roll up tightly.|Serve with the peanut sauce."],"Vegetarian pho":[4,"8 cups vegetable broth|1 onion, halved|2-inch piece ginger, sliced|2 star anise, 1 cinnamon stick, 3 cloves|2 tbsp soy sauce|8 oz rice noodles|8 oz tofu, sliced|8 oz mushrooms, sliced|1 cup bean sprouts|Fresh basil, cilantro, lime wedges and sliced chilies (optional)","Char the onion and ginger in a dry pan for 5 minutes.|Simmer the broth with the onion, ginger, spices and soy sauce for 25 minutes, then strain.|Cook the rice noodles following the package directions.|Simmer the mushrooms and tofu in the broth for 5 minutes.|Divide the noodles between bowls, ladle over the hot broth and top with the sprouts and herbs."],"Tofu banh mi":[2,"2 small baguettes (or sub rolls)|7 oz firm tofu, sliced|1 tbsp soy sauce|1 tbsp oil|1 carrot, grated|½ cup cucumber (or daikon), thinly sliced|2 tbsp rice vinegar, 1 tbsp sugar, ½ tsp salt (for quick pickle)|Fresh cilantro|Jalapeño slices and sriracha (optional)","Warm the vinegar, sugar and salt until dissolved. Pour over the carrot and cucumber and leave 15 minutes.|Pan-fry the tofu in the oil for 3 to 4 minutes per side, adding the soy sauce at the end.|Split and toast the baguettes.|Fill with the tofu, pickled vegetables, cilantro, jalapeño and sriracha."],"French toast":[4,"8 slices thick bread (day-old is best)|4 eggs|1 cup milk|1 tbsp sugar|1 tsp cinnamon|1 tsp vanilla|Pinch of salt|Butter for the pan|Maple syrup, berries, banana or powdered sugar to serve","Whisk the eggs, milk, sugar, cinnamon, vanilla and salt in a shallow dish until well combined.|Heat a buttered pan on medium.|Dip each slice in the egg mixture for 10 to 15 seconds per side, until soaked but not falling apart.|Cook 2 to 3 minutes per side until golden brown and crisp at the edges.|Serve hot with syrup and fruit."],"Banana oat pancakes":[3,"2 ripe bananas|1 cup rolled oats|¾ cup milk|1 tsp baking powder|1 tsp cinnamon|1 tsp vanilla|Oil for the pan|Maple syrup and berries to serve","Blend the bananas, oats, milk, baking powder, cinnamon and vanilla until smooth. Rest the batter 5 minutes.|Heat a lightly oiled pan on medium-low.|Pour in ¼ cup of batter for each pancake and cook 2 to 3 minutes per side until golden.|Serve with syrup and berries."],"Overnight oats":[1,"1 cup rolled oats|1 cup milk|½ cup yogurt|1 tbsp chia seeds (optional)|1 tbsp honey or maple syrup|Toppings: banana slices or berries, chopped nuts","Stir the oats, milk, yogurt, chia seeds and honey together in a jar.|Cover and refrigerate overnight, or at least 4 hours.|Top with fruit and nuts. Eat cold, or warm it up."],"Chia pudding":[2,"¼ cup chia seeds|1 cup milk|1 tbsp maple syrup or honey|½ tsp vanilla|Fruit to serve","Stir the chia seeds, milk, syrup and vanilla together.|Wait 5 minutes and stir again so it doesn't clump.|Refrigerate at least 2 hours, or overnight, until thick. Top with fruit."],"Tofu scramble":[2,"14 oz firm tofu|1 tbsp oil|½ onion, chopped|1 bell pepper, diced|2 cups spinach|½ tsp turmeric|½ tsp cumin|Salt and pepper|Toast to serve","Drain the tofu, pat it dry and crumble it with your hands.|Cook the onion and pepper in the oil for 4 minutes.|Add the tofu, turmeric, cumin, salt and pepper and cook 5 to 6 minutes, stirring now and then.|Stir in the spinach until wilted. Serve with toast."],"Veggie breakfast burrito":[4,"14 oz firm tofu, crumbled|1 tbsp oil|½ tsp turmeric, ½ tsp cumin|4 large tortillas|1 can (15 oz) black beans, drained|1 cup shredded cheese|Avocado and salsa to serve","Cook the crumbled tofu in the oil with the turmeric, cumin and a pinch of salt for 6 minutes.|Warm the beans in a small pot and the tortillas in a dry pan.|Fill each tortilla with tofu, beans and cheese and roll up.|Toast seam-side down in a pan for 1 to 2 minutes per side. Serve with avocado and salsa."],"Besan chilla":[3,"1 cup besan (chickpea flour)|¾ cup water|½ onion, finely chopped|1 tomato, finely chopped|1 green chili, chopped|¼ tsp turmeric|½ tsp cumin seeds|Salt|Chopped cilantro|Oil for the pan|Mint chutney or yogurt to serve","Whisk the besan, water, turmeric, cumin seeds and salt into a smooth, pourable batter. Rest 10 minutes.|Stir in the onion, tomato, chili and cilantro.|Heat an oiled pan on medium. Pour in ¼ cup of batter and spread it thin.|Cook 2 to 3 minutes per side until golden. Serve with chutney or yogurt."],"Peanut butter banana toast":[1,"2 slices bread|2 tbsp peanut butter|1 banana, sliced|Honey and cinnamon (optional)","Toast the bread.|Spread with the peanut butter and top with banana slices.|Finish with a drizzle of honey and a sprinkle of cinnamon."],"Crêpes with fruit":[4,"1 cup flour|2 eggs|1¼ cups milk|2 tbsp melted butter|1 tbsp sugar|Pinch of salt|1 tsp vanilla|Butter for the pan|Fillings to serve (berries, banana, jam, lemon and sugar)","Blend the flour, eggs, milk, melted butter, sugar, salt and vanilla until smooth. Rest the batter 20 minutes.|Heat a lightly buttered nonstick pan on medium.|Pour in about ¼ cup of batter, swirling the pan so it spreads thin.|Cook 1 to 2 minutes until the edges lift and the bottom is golden, then flip and cook 30 seconds more.|Fill and fold."],"Crispy breakfast potatoes":[3,"4 medium potatoes, cut in small cubes|2 tbsp oil|1 onion, diced|1 bell pepper, diced|1 tsp paprika, 1 tsp garlic powder, ½ tsp salt|Ketchup or hot sauce to serve","Boil the potato cubes for 5 minutes. Drain well and let them steam dry.|Fry in the oil on medium-high for about 10 minutes, turning only now and then, until golden and crisp.|Add the onion and pepper and cook 8 minutes more. Season and serve."],"Broccoli cheddar soup":[4,"1 tbsp butter|1 onion, chopped|2 garlic cloves|3 tbsp flour|3 cups vegetable broth|1½ cups milk|4 cups broccoli florets, chopped|2 carrots, grated|2 cups shredded cheddar|Salt, pepper and a pinch of nutmeg","Cook the onion in the butter for 4 minutes. Add the garlic for 1 minute.|Stir in the flour for 1 minute, then slowly whisk in the broth and milk.|Add the broccoli and carrots and simmer 12 minutes until tender.|Blend part of the soup for a creamy but chunky texture.|Take off the heat and stir in the cheese until melted. Season."],"Black bean soup":[4,"2 tbsp oil|1 onion and 1 bell pepper, chopped|3 garlic cloves|2 tsp cumin, 1 tsp chili powder|2 cans (15 oz) black beans, with their liquid|3 cups vegetable broth|Juice of 1 lime|Salt|Toppings: sour cream, cilantro, avocado, tortilla chips","Cook the onion and pepper in the oil for 5 minutes. Add the garlic and spices for 1 minute.|Add the beans and broth and simmer 20 minutes.|Blend about half of the soup so it is thick but still has some whole beans.|Stir in the lime juice and salt and add your toppings."],"Potato leek soup":[4,"3 leeks, white and light green parts, sliced|3 potatoes, cubed|2 tbsp butter|3 cups vegetable broth|1 cup milk|Salt and pepper|Chives (optional)","Rinse the sliced leeks well to remove any grit.|Cook the leeks in the butter on low for 8 minutes until soft, without browning.|Add the potatoes and broth and simmer 20 minutes until the potatoes are very soft.|Blend until smooth, stir in the milk and season. Top with chives."],"Gazpacho":[4,"2 lb ripe tomatoes, chopped|1 cucumber, chopped|1 bell pepper, chopped|1 garlic clove|2 slices day-old bread, torn|¼ cup olive oil|2 tbsp sherry or red wine vinegar|Salt|Cold water as needed","Blend all the ingredients until very smooth, adding a little cold water if it is too thick.|Taste and add salt or vinegar.|Chill at least 1 hour. Serve cold with a drizzle of olive oil."],"Cold sesame noodles":[3,"8 oz noodles|3 tbsp tahini or peanut butter|3 tbsp soy sauce|1 tbsp rice vinegar|1 tbsp sugar|1 tsp chili oil (optional)|1 garlic clove, grated|1 cucumber, cut in matchsticks|2 scallions, sliced|Sesame seeds (optional)","Cook the noodles, drain and rinse under cold water.|Whisk the tahini, soy sauce, vinegar, sugar, chili oil and garlic with 2 to 3 tbsp warm water until smooth.|Toss the noodles with the sauce and top with cucumber, scallions and sesame seeds."],"Veggie pasta salad":[4,"8 oz rotini or penne|3 cups chopped vegetables (cucumber, bell pepper, cherry tomatoes)|½ cup olives|½ cup feta or mozzarella pearls|Dressing: ¼ cup olive oil, 2 tbsp red wine vinegar, 1 tsp Italian seasoning, salt and pepper","Cook the pasta, drain and rinse under cold water.|Whisk the dressing ingredients together.|Toss the pasta with the vegetables, olives, cheese and dressing. Chill 15 minutes if you can."],"Mediterranean orzo salad":[4,"1½ cups orzo|1 cucumber and 1 cup cherry tomatoes, chopped|½ red onion, thinly sliced|½ cup olives|6 oz feta, crumbled|2 cups spinach or arugula|Juice of 1 lemon|¼ cup olive oil|Salt, pepper and oregano","Cook the orzo following the package directions, drain and rinse under cold water.|Toss with the vegetables, onion, olives, spinach and feta.|Whisk the lemon juice, oil, salt, pepper and oregano and toss through the salad."],"Spanish chickpea & spinach stew":[4,"2 tbsp olive oil|1 onion, chopped|4 garlic cloves|1 tsp smoked paprika|1 tsp cumin|2 cans (15 oz) chickpeas, drained|1 can (14 oz) diced tomatoes|10 oz spinach|1 tbsp sherry vinegar|Salt|Bread to serve","Cook the onion in the oil for 5 minutes. Add the garlic, paprika and cumin for 1 minute.|Add the chickpeas and tomatoes and simmer 10 minutes, mashing a few chickpeas to thicken.|Stir in the spinach until wilted, then the vinegar and salt. Serve with bread."],"Vegetable paella":[4,"2 tbsp olive oil|1 onion and 1 bell pepper, chopped|3 garlic cloves|1½ cups rice (short-grain or paella)|3 cups hot vegetable broth|1 can (14 oz) diced tomatoes|1 tsp smoked paprika|Pinch of saffron or ½ tsp turmeric|2 cups vegetables (green beans, peas, artichokes)|1 can (15 oz) chickpeas, drained|Lemon wedges and parsley","Cook the onion and pepper in the oil for 5 minutes. Add the garlic, paprika and tomatoes and cook 5 minutes.|Stir in the rice, saffron and broth. Bring to a boil.|Add the vegetables and chickpeas, then simmer on low, uncovered and without stirring, for 18 to 20 minutes until the rice is tender.|Rest 5 minutes. Serve with lemon wedges and parsley."],"Patatas bravas":[4,"1½ lb potatoes, cut in cubes|3 tbsp olive oil|1 tsp smoked paprika|Salt|Sauce: 2 tbsp olive oil, 2 garlic cloves, 1 can (8 oz) tomato sauce, 1 tsp paprika, ½ tsp cayenne, 1 tbsp vinegar, pinch of sugar","Heat the oven to 425°F (220°C). Toss the potatoes with the oil, paprika and salt and roast 30 to 35 minutes, turning once, until crisp.|Cook the garlic in the oil for 30 seconds. Add the rest of the sauce ingredients and simmer 10 minutes.|Pour the sauce over the hot potatoes."],"Pan con tomate":[4,"4 slices crusty bread|2 ripe tomatoes|1 garlic clove|2 tbsp olive oil|Flaky salt","Toast the bread until crisp.|Rub each slice with the cut garlic clove, then with a cut tomato so the pulp soaks in.|Drizzle with olive oil and sprinkle with salt."],"Ratatouille":[4,"1 eggplant, 2 zucchini and 1 bell pepper, cut in chunks|1 onion, chopped|4 garlic cloves|1 can (14 oz) diced tomatoes|3 tbsp olive oil|1 tsp thyme|Salt and pepper|Fresh basil","Brown the eggplant, zucchini and pepper in the oil in batches, about 5 minutes each. Set aside.|Cook the onion for 5 minutes, add the garlic for 1 minute.|Add the tomatoes and thyme and return the vegetables to the pot.|Simmer, partly covered, 25 minutes until tender. Season and top with basil."],"French onion soup":[4,"4 large onions, thinly sliced|3 tbsp butter|1 tbsp oil|2 garlic cloves|1 tsp thyme|½ cup white wine (optional)|6 cups vegetable broth|1 tbsp soy sauce|1 baguette, sliced|2 cups shredded melting cheese (Swiss, Gruyère or mozzarella)","Cook the onions in the butter and oil on medium-low for 40 minutes, stirring often, until deep golden brown.|Add the garlic and thyme for 1 minute. Pour in the wine, if using, and scrape up the browned bits.|Add the broth and soy sauce and simmer 15 minutes.|Toast the baguette slices. Ladle the soup into oven-safe bowls, top with toast and cheese and broil 3 to 4 minutes until bubbly."],"Potato gratin":[6,"2 lb potatoes, thinly sliced|1½ cups cream or milk|2 garlic cloves|1½ cups shredded cheese (Swiss or Gruyère)|2 tbsp butter|Salt, pepper and a pinch of nutmeg","Heat the oven to 375°F (190°C). Rub a baking dish with a cut garlic clove and butter it.|Layer half the potatoes in the dish, season, and sprinkle with a third of the cheese. Repeat.|Warm the cream with the remaining garlic, pour it over and top with the last of the cheese.|Cover with foil and bake 40 minutes, then uncover and bake 20 to 25 minutes until golden and tender."],"Tarte tatin":[6,"1 sheet puff pastry (check it is made with butter)|5 apples, peeled and quartered|½ cup sugar|4 tbsp butter|1 tsp cinnamon (optional)|Vanilla ice cream to serve","Heat the oven to 400°F (200°C). Melt the butter and sugar in an oven-safe skillet on medium and cook 5 minutes until amber.|Arrange the apples tightly in the caramel and cook 10 minutes.|Lay the pastry over the apples, tucking in the edges.|Bake 25 minutes until puffed and golden. Rest 5 minutes, then flip onto a plate."],"Mushroom bourguignon":[4,"1½ lb mushrooms, halved|2 tbsp oil|1 onion, chopped|2 carrots, sliced|3 garlic cloves|2 tbsp tomato paste|2 tbsp flour|1 cup red wine (optional)|2 cups vegetable broth|1 tsp thyme and 1 bay leaf|2 tbsp butter|Salt, pepper and parsley|Mashed potatoes, noodles or crusty bread to serve","Brown the mushrooms in the oil in batches, about 6 minutes each. Set aside.|Cook the onion and carrots for 5 minutes. Add the garlic, tomato paste and flour and stir 1 minute.|Add the wine, broth, thyme and bay leaf and bring to a simmer.|Return the mushrooms and simmer 20 minutes until thick. Stir in the butter, season and top with parsley."],"Matar paneer":[4,"8 oz paneer, cubed|1½ cups peas|2 tbsp oil|1 onion, finely chopped|3 tomatoes, pureed|3 garlic cloves and 1 tbsp ginger|1 tsp cumin seeds|1 tsp coriander powder, ½ tsp turmeric, 1 tsp garam masala, ½ tsp chili powder|½ cup water and salt|Cilantro|Rice or roti to serve","Heat the oil, add the cumin seeds, then the onion. Cook until golden, about 8 minutes.|Add the garlic and ginger, then the tomato puree and spices. Cook 8 minutes until thick.|Add the water, salt and peas and simmer 5 minutes.|Add the paneer and cook 3 minutes. Top with cilantro."],"Bhindi masala":[3,"1 lb okra, washed, dried and sliced|2 tbsp oil|1 tsp cumin seeds|1 onion, sliced|2 tomatoes, chopped|1 tsp coriander powder, ½ tsp turmeric, ½ tsp chili powder|½ tsp amchur or lemon juice|Salt|Roti or rice to serve","Make sure the okra is completely dry so it doesn't turn slimy.|Heat the oil, add the cumin seeds, then the onion, and cook until golden.|Add the okra and cook 8 to 10 minutes on medium-high, stirring now and then.|Add the tomatoes, spices and salt and cook 5 minutes. Finish with amchur or lemon juice."],"Mushroom masala":[4,"1 lb mushrooms, quartered|2 tbsp oil|1 onion, finely chopped|2 tomatoes, pureed|3 garlic cloves and 1 tbsp ginger|1 tsp cumi
