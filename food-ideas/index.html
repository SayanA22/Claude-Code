<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's for Dinner?</title>
<meta name="theme-color" content="#ea580c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dinner Ideas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#fff7ed; --card:#ffffff; --ink:#292524; --muted:#78716c;
    --accent:#ea580c; --accent-ink:#ffffff; --soft:#ffedd5; --line:#fed7aa; --good:#15803d;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1917; --card:#292524; --ink:#fafaf9; --muted:#a8a29e;
      --accent:#fb923c; --accent-ink:#1c1917; --soft:#44302a; --line:#57413a; --good:#4ade80; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:20px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}
  main{max-width:560px;margin:0 auto}
  h1{font-size:1.5rem;margin:18px 0 4px}
  .sub{color:var(--muted);margin:0 0 16px;font-size:.9rem}
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;border:0;background:none;color:var(--muted);padding:12px 4px;font-size:.8rem}
  .tabs button span{display:block;font-size:1.5rem}
  .tabs button.on{color:var(--accent);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
  .chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
    padding:8px 14px;font-size:.9rem}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
  .label{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;text-align:center;margin:12px 0}
  .card .emoji{font-size:4.5rem;line-height:1.1}
  .card h2{font-size:1.7rem;margin:6px 0}
  .card p{margin:4px 0;color:var(--muted);font-size:.95rem}
  .meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .tag{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:.8rem}
  .btn{display:block;width:100%;border:0;border-radius:18px;padding:16px;font-size:1.15rem;font-weight:700;
    background:var(--accent);color:var(--accent-ink);margin:10px 0}
  .btn.alt{background:var(--soft);color:var(--ink)}
  .row{display:flex;gap:10px}
  .row .btn{margin:6px 0}
  .empty{color:var(--muted);text-align:center;padding:24px 0}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:12px 14px;margin:8px 0}
  .item .e{font-size:2rem}
  .item .t{flex:1;min-width:0}
  .item .t b{display:block}
  .item .t small{color:var(--muted)}
  .icon{border:0;background:none;font-size:1.5rem;padding:6px}
  input,select{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);
    background:var(--card);color:var(--ink);margin:6px 0 12px}
  .hint{color:var(--muted);font-size:.8rem}
  .spin{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
  .good{color:var(--good);font-weight:700}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs">
  <button data-tab="pick"><span>🎲</span>Pick</button>
  <button data-tab="list"><span>📋</span>All Ideas</button>
  <button data-tab="favs"><span>⭐</span>Favorites</button>
  <button data-tab="add"><span>➕</span>Add</button>
</nav>

<script>
const BUILTIN = [
  // [emoji, name, meal, minutes, note]
  ["🍳","Scrambled eggs & toast","Breakfast",10,"Quick and filling"],
  ["🥞","Pancakes","Breakfast",25,"Add fruit or syrup"],
  ["🥣","Oatmeal with fruit","Breakfast",10,"Warm and easy"],
  ["🧇","French toast","Breakfast",20,"Great with cinnamon"],
  ["🍅","Veggie omelette","Breakfast",15,"Use whatever veggies are around"],
  ["🥪","Grilled cheese & tomato soup","Lunch",15,"Comfort classic"],
  ["🥗","Chicken salad","Lunch",15,"Good with leftover chicken"],
  ["🌯","Bean & cheese burritos","Lunch",15,"Easy and cheap"],
  ["🥙","Veggie wraps with hummus","Lunch",10,"No cooking needed"],
  ["🍲","Lentil soup","Lunch",40,"Makes lots of leftovers"],
  ["🍝","Spaghetti with meat sauce","Dinner",35,"Everyone likes it"],
  ["🍗","Baked chicken & roasted vegetables","Dinner",50,"One pan, easy cleanup"],
  ["🌮","Tacos","Dinner",25,"Let everyone build their own"],
  ["🍛","Chicken curry with rice","Dinner",40,"Cozy and flavorful"],
  ["🍚","Fried rice","Dinner",20,"Perfect for leftover rice"],
  ["🥘","Vegetable stir-fry","Dinner",20,"Quick, lots of veggies"],
  ["🍕","Homemade pizza","Dinner",45,"Fun and customizable"],
  ["🍔","Burgers","Dinner",25,"Fire up the grill or pan"],
  ["🐟","Baked salmon with lemon","Dinner",25,"Light and healthy"],
  ["🍤","Garlic shrimp pasta","Dinner",25,"Feels fancy, very fast"],
  ["🥩","Beef stew","Dinner",120,"Slow and hearty"],
  ["🍲","Chili","Dinner",60,"Great the next day too"],
  ["🍖","Pot roast","Dinner",180,"Sunday dinner"],
  ["🥔","Loaded baked potatoes","Dinner",60,"Top with anything"],
  ["🧀","Macaroni & cheese","Dinner",30,"Comfort food"],
  ["🍆","Eggplant parmesan","Dinner",60,"Vegetarian favorite"],
  ["🥬","Stuffed bell peppers","Dinner",55,"Rice, meat or beans"],
  ["🍜","Chicken noodle soup","Dinner",45,"Great when feeling under the weather"],
  ["🌭","Hot dogs & coleslaw","Dinner",15,"Super easy night"],
  ["🍳","Breakfast for dinner","Dinner",20,"Eggs, toast, potatoes"],
  ["🥣","Dal & rice","Dinner",35,"Simple and satisfying"],
  ["🫓","Quesadillas","Dinner",15,"Ready in minutes"],
  ["🍝","Pasta primavera","Dinner",25,"Lots of fresh veggies"],
  ["🍗","Sheet-pan sausage & potatoes","Dinner",40,"Toss it all in one pan"],
  ["🥗","Big Greek salad with pita","Dinner",20,"Light, no oven"],
  ["🍪","Chocolate chip cookies","Dessert",30,"Always a hit"],
  ["🍎","Baked apples with cinnamon","Dessert",35,"Warm and simple"],
  ["🍮","Rice pudding","Dessert",40,"Creamy comfort"],
  ["🍨","Ice cream with fruit","Dessert",5,"Zero effort"],
  ["🍌","Banana bread","Dessert",65,"Uses up ripe bananas"],
  ["🧁","Yogurt with honey & nuts","Snack",5,"Quick bite"],
  ["🍿","Popcorn","Snack",5,"Movie night"],
  ["🥜","Apple slices with peanut butter","Snack",5,"Healthy snack"]
].map((m,i)=>({id:"b"+i,emoji:m[0],name:m[1],meal:m[2],mins:m[3],note:m[4]}));

const MEALS = ["Any","Breakfast","Lunch","Dinner","Dessert","Snack"];
const EFFORT = [["Any",9999],["Quick (under 30 min)",30],["Under an hour",60]];

// ---- storage ----
const KEY = "dinnerIdeas.v1";
let S = { custom:[], favs:[], hidden:[], made:{}, mealF:"Dinner", effortF:0, current:null };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const all = () => [...BUILTIN, ...S.custom].filter(m => !S.hidden.includes(m.id));
const find = id => [...BUILTIN, ...S.custom].find(m => m.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins = m => m.mins >= 60 ? (m.mins/60).toFixed(m.mins%60?1:0).replace(".0","")+" hr" : m.mins+" min";

function ago(id){
  const t = S.made[id]; if(!t) return null;
  const d = Math.floor((Date.now()-t)/864e5);
  return d<=0 ? "today" : d===1 ? "yesterday" : d<14 ? d+" days ago" : Math.round(d/7)+" weeks ago";
}

function pool(){
  const max = EFFORT[S.effortF][1];
  return all().filter(m => (S.mealF==="Any"||m.meal===S.mealF) && m.mins<=max);
}

// prefer things not made recently; never-made counts as oldest
function suggest(){
  const p = pool();
  if(!p.length){ S.current=null; return save(); }
  const others = p.filter(m=>m.id!==S.current);
  const src = others.length ? others : p;
  const w = src.map(m => {
    const days = S.made[m.id] ? (Date.now()-S.made[m.id])/864e5 : 60;
    return 1 + Math.min(days,60);
  });
  let r = Math.random()*w.reduce((a,b)=>a+b,0), i=0;
  while((r-=w[i])>0 && i<src.length-1) i++;
  S.current = src[i].id; save();
}

// ---- views ----
let tab = "pick", animate = false;
const app = document.getElementById("app");

function chips(items, isOn, attr){
  return `<div class="chips">${items.map((x,i)=>`<button class="chip ${isOn(i)?"on":""}" ${attr}="${i}">${esc(Array.isArray(x)?x[0]:x)}</button>`).join("")}</div>`;
}

function pickView(){
  const m = S.current && find(S.current);
  const fav = m && S.favs.includes(m.id);
  const a = m && ago(m.id);
  return `
  <h1>What should we make?</h1>
  <p class="sub">Tap the big button and let the app decide.</p>
  <div class="label">Meal</div>${chips(MEALS,i=>MEALS[i]===S.mealF,"data-meal")}
  <div class="label">How much time?</div>${chips(EFFORT,i=>i===S.effortF,"data-effort")}
  ${m ? `<div class="card ${animate?"spin":""}">
      <div class="emoji">${m.emoji}</div>
      <h2>${esc(m.name)}</h2>
      <div class="meta"><span class="tag">${esc(m.meal)}</span><span class="tag">⏱ ${mins(m)}</span>${a?`<span class="tag">Made ${a}</span>`:""}</div>
      <p>${esc(m.note||"")}</p>
    </div>
    <div class="row">
      <button class="btn alt" data-act="fav">${fav?"⭐ Saved":"☆ Save"}</button>
      <button class="btn alt" data-act="skip">🚫 Never show</button>
    </div>
    <button class="btn" data-act="made">✅ We're making this!</button>
    <button class="btn alt" data-act="next">🎲 Show me another</button>`
   : `<div class="card"><div class="emoji">🤔</div>
      <h2>Ready when you are</h2><p>Pick a meal type above, then tap the button.</p></div>
      <button class="btn" data-act="next">🎲 Surprise me!</button>`}
  ${pool().length===0?`<p class="empty">Nothing matches those choices. Try "Any" or add your own ideas.</p>`:""}`;
}

function itemRow(m, actions){
  const a = ago(m.id);
  return `<div class="item"><div class="e">${m.emoji}</div>
    <div class="t"><b>${esc(m.name)}</b><small>${esc(m.meal)} · ${mins(m)}${a?" · made "+a:""}</small></div>${actions}</div>`;
}

function listView(){
  const q = (window._q||"").toLowerCase();
  const items = all().filter(m=>!q||m.name.toLowerCase().includes(q)||m.meal.toLowerCase().includes(q));
  return `<h1>All ideas</h1><p class="sub">${all().length} meals. Tap ⭐ to save a favorite.</p>
    <input id="q" type="search" placeholder="Search…" value="${esc(window._q||"")}">
    ${items.map(m=>itemRow(m,`<button class="icon" data-fav="${m.id}">${S.favs.includes(m.id)?"⭐":"☆"}</button>`)).join("")||'<p class="empty">No matches.</p>'}
    ${S.hidden.length?`<button class="btn alt" data-act="unhide">Bring back ${S.hidden.length} hidden meal${S.hidden.length>1?"s":""}</button>`:""}`;
}

function favsView(){
  const items = S.favs.map(find).filter(m=>m && !S.hidden.includes(m.id));
  return `<h1>Favorites</h1><p class="sub">Meals you love.</p>
    ${items.map(m=>itemRow(m,`<button class="icon" data-fav="${m.id}">⭐</button>`)).join("")
      ||'<p class="empty">No favorites yet. Tap ⭐ on any meal to save it here.</p>'}`;
}

function addView(){
  return `<h1>Add your own</h1><p class="sub">Family recipes and favorites go here.</p>
    <label>Meal name</label><input id="n" placeholder="e.g. Grandma's rice and beans">
    <label>Type</label><select id="m">${MEALS.slice(1).map(x=>`<option ${x==="Dinner"?"selected":""}>${x}</option>`).join("")}</select>
    <label>Minutes to make</label><input id="t" type="number" inputmode="numeric" min="1" value="30">
    <label>Note (optional)</label><input id="o" placeholder="e.g. needs to marinate overnight">
    <button class="btn" data-act="add">Add this meal</button>
    ${S.custom.length?`<div class="label">Your meals</div>`+S.custom.map(m=>itemRow(m,`<button class="icon" data-del="${m.id}">🗑</button>`)).join(""):""}`;
}

function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  app.innerHTML = {pick:pickView,list:listView,favs:favsView,add:addView}[tab]();
  animate = false;
}

// ---- events ----
function toggleFav(id){
  S.favs = S.favs.includes(id) ? S.favs.filter(x=>x!==id) : [...S.favs,id]; save();
}

document.querySelector(".tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  tab=b.dataset.tab; render(); window.scrollTo(0,0);
});

app.addEventListener("input",e=>{
  if(e.target.id==="q"){ window._q=e.target.value; const pos=e.target.selectionStart; render();
    const q=document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos); }
});

app.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  const d=t.dataset;
  if(d.meal!==undefined){ S.mealF=MEALS[d.meal]; S.current=null; save(); }
  else if(d.effort!==undefined){ S.effortF=+d.effort; S.current=null; save(); }
  else if(d.fav){ toggleFav(d.fav); }
  else if(d.del){ if(!confirm("Delete this meal?")) return;
    S.custom=S.custom.filter(m=>m.id!==d.del); S.favs=S.favs.filter(x=>x!==d.del); save(); }
  else if(d.act==="next"){ suggest(); animate=true; }
  else if(d.act==="fav" && S.current){ toggleFav(S.current); }
  else if(d.act==="skip" && S.current){
    if(!confirm("Never suggest this meal again? You can bring it back from All Ideas.")) return;
    S.hidden.push(S.current); S.current=null; save(); suggest(); animate=true; }
  else if(d.act==="made" && S.current){ S.made[S.current]=Date.now(); save(); alert("Great choice! Enjoy! 🍽️"); }
  else if(d.act==="unhide"){ S.hidden=[]; save(); }
  else if(d.act==="add"){
    const name=document.getElementById("n").value.trim();
    if(!name){ alert("Please type a meal name."); return; }
    const m={id:"c"+Date.now(),emoji:"🍽️",name,meal:document.getElementById("m").value,
      mins:Math.max(1,parseInt(document.getElementById("t").value)||30),note:document.getElementById("o").value.trim()};
    S.custom.push(m); S.favs.push(m.id); save(); alert("Added! It's in your favorites too. ⭐");
  }
  else return;
  render();
});

render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
