n seeds|1 tsp coriander powder, ½ tsp turmeric, 1 tsp garam masala, ½ tsp chili powder|¼ cup cream or yogurt (optional)|Cilantro|Roti or rice to serve","Cook the mushrooms in a dry pan until their water cooks off and they brown. Set aside.|Heat the oil, add the cumin seeds and onion and cook until golden.|Add the garlic, ginger, tomato puree and spices and cook 8 minutes.|Add the mushrooms and a splash of water and simmer 5 minutes. Stir in the cream and top with cilantro."],"Vegetable korma":[4,"2 tbsp oil|1 onion, chopped|3 garlic cloves and 1 tbsp ginger|4 cups mixed vegetables (potato, carrot, cauliflower, peas, beans)|1 cup coconut milk|¼ cup cashews, soaked in hot water|1 tsp garam masala, 1 tsp coriander powder, ½ tsp turmeric|1 cup vegetable broth or water|Salt and cilantro","Blend the soaked cashews with ¼ cup of water into a smooth paste.|Cook the onion in the oil until soft. Add the garlic, ginger and spices for 1 minute.|Add the vegetables and broth and simmer 15 minutes until tender.|Stir in the coconut milk and cashew paste and simmer 8 minutes. Season and top with cilantro."],"Tomato rasam":[4,"½ cup cooked toor dal (about ¼ cup raw)|4 ripe tomatoes, chopped|1 tbsp tamarind paste|2 cups water|1 tsp rasam powder (or ½ tsp pepper and ½ tsp cumin)|Salt|Tempering: 1 tbsp oil, 1 tsp mustard seeds, ½ tsp cumin seeds, 2 dried red chilies, 8 curry leaves, 2 garlic cloves, crushed|Cilantro|Rice to serve","Simmer the tomatoes, tamarind, rasam powder, salt and water for 10 minutes. Mash the tomatoes.|Stir in the dal and simmer 5 minutes.|Heat the oil for the tempering, pop the mustard seeds, then add the cumin, chilies, curry leaves and garlic for 30 seconds.|Pour over the rasam and top with cilantro. Serve with rice."],"Pav bhaji":[4,"4 potatoes, boiled and mashed|1 cup cauliflower florets|½ cup peas|1 carrot, chopped|2 tbsp butter|1 onion, finely chopped|1 bell pepper, chopped|3 tomatoes, chopped|2 tbsp pav bhaji masala|1 tsp chili powder|8 pav (soft dinner rolls)|Lemon wedges, chopped onion and cilantro to serve","Boil the cauliflower, peas and carrot until very soft.|Melt the butter and cook the onion and pepper until soft. Add the tomatoes and cook until mushy.|Add the masala and chili powder, then all the vegetables and the potatoes. Mash everything together with a masher, adding a little water, and simmer 10 minutes.|Toast the split rolls in butter in a pan. Serve the bhaji with the rolls and toppings."],"Vegetable pakora":[4,"1½ cups besan (chickpea flour)|½ cup water, as needed|1 onion, thinly sliced|1 potato, thinly sliced|1 cup spinach, chopped|1 tsp cumin seeds, ½ tsp turmeric, ½ tsp chili powder, 1 tsp salt|Oil for frying|Mint chutney or ketchup to serve","Mix the besan and spices with enough water for a thick batter that coats the vegetables.|Stir in the onion, potato and spinach.|Heat the oil to 350°F (175°C). Drop in spoonfuls of the mixture and fry 4 to 5 minutes until golden and crisp.|Drain and serve hot with chutney."],"Masoor dal":[4,"1 cup red lentils (masoor dal), rinsed|3 cups water|½ tsp turmeric|1 tsp salt|Tadka: 2 tbsp ghee or oil, 1 tsp cumin seeds, 3 garlic cloves, sliced, 1 dried red chili, ½ tsp chili powder|1 tomato, chopped|Lemon juice and cilantro|Rice to serve","Simmer the lentils with the water, turmeric and salt for 15 to 20 minutes until soft. Whisk until creamy.|Heat the ghee, add the cumin seeds, garlic and dried chili until golden. Add the tomato and chili powder and cook 3 minutes.|Pour the tadka over the dal and finish with lemon juice and cilantro."],"Lentil shepherd's pie":[6,"1 cup brown lentils, rinsed|2 tbsp oil|1 onion, 2 carrots and 2 celery stalks, diced|3 garlic cloves|2 tbsp tomato paste|2 cups vegetable broth|1 cup peas|1 tsp thyme|2 lb potatoes, peeled and cubed|¼ cup milk|2 tbsp butter|Salt and pepper","Simmer the lentils in the broth plus 1 cup of water for 20 minutes until tender.|Meanwhile, cook the onion, carrots and celery in the oil for 6 minutes. Add the garlic, tomato paste and thyme for 1 minute.|Combine with the lentils and peas and simmer until thick. Season.|Boil the potatoes until soft, drain and mash with the milk, butter and salt.|Spread the lentils in a baking dish, top with the mash and bake at 400°F (200°C) for 20 minutes until golden."],"Stuffed sweet potatoes":[4,"4 sweet potatoes|1 can (15 oz) black beans, drained|1 cup corn|1 tsp cumin, 1 tsp chili powder|1 cup shredded cheese|1 avocado or Greek yogurt|Lime and cilantro (optional)|Salt","Heat the oven to 425°F (220°C). Prick the sweet potatoes and bake 45 minutes until soft.|Warm the beans, corn, spices and a pinch of salt in a pan for 5 minutes.|Split the potatoes open and fluff the insides. Fill with the bean mixture and cheese.|Top with avocado or yogurt, lime and cilantro."],"Sloppy lentil joes":[6,"1 cup brown lentils, rinsed|2 tbsp oil|1 onion and 1 bell pepper, diced|3 garlic cloves|1 cup ketchup|2 tbsp brown sugar|1 tbsp mustard|1 tbsp soy sauce|2½ cups water|6 buns|Pickles (optional)","Simmer the lentils in the water for 20 minutes until tender.|Cook the onion and pepper in the oil for 5 minutes. Add the garlic for 1 minute.|Stir in the lentils with the ketchup, sugar, mustard and soy sauce and simmer 10 minutes until thick.|Pile onto buns."],"Cauliflower buffalo bites":[4,"1 head cauliflower, cut in florets|¾ cup flour|¾ cup milk|1 tsp garlic powder, 1 tsp paprika, ½ tsp salt|½ cup hot sauce|2 tbsp melted butter|Celery sticks and a yogurt dip to serve","Heat the oven to 450°F (230°C) and line a baking sheet.|Whisk the flour, milk and spices into a thick batter. Coat each floret and arrange on the sheet.|Bake 20 minutes, turning once.|Toss in the hot sauce mixed with the butter and bake 8 to 10 minutes more until sticky."],"Vegetable pot pie":[6,"2 sheets puff pastry (or 1 pie crust)|2 tbsp butter|1 onion, 2 carrots and 2 celery stalks, diced|2 potatoes, diced small|1 cup peas|3 tbsp flour|1½ cups vegetable broth|½ cup milk, plus extra for brushing|1 tsp thyme|Salt and pepper","Heat the oven to 400°F (200°C).|Cook the onion, carrots, celery and potatoes in the butter for 8 minutes.|Stir in the flour for 1 minute, then slowly add the broth and milk and simmer until thick, about 8 minutes. Add the peas, thyme, salt and pepper.|Pour into a baking dish, cover with the pastry, cut a few slits and brush with milk.|Bake 25 to 30 minutes until deep golden."],"Apple crumble":[6,"5 apples, sliced|2 tbsp sugar|1 tsp cinnamon|Topping: 1 cup rolled oats, ½ cup flour, ½ cup brown sugar, ½ cup cold butter, cubed|Vanilla ice cream or yogurt to serve","Heat the oven to 375°F (190°C).|Toss the apples with the sugar and cinnamon and spread in a baking dish.|Rub the oats, flour, brown sugar and butter together with your fingers until crumbly. Scatter over the apples.|Bake 35 to 40 minutes until golden and bubbling."],"Banana nice cream":[2,"3 frozen ripe bananas, sliced|2 tbsp milk (optional)|1 tsp vanilla|Toppings: chocolate chips, nuts, berries","Blend the frozen bananas with the vanilla, adding a splash of milk only if needed, until smooth and creamy like soft-serve.|Eat right away, or freeze 30 minutes for a firmer scoop."],"Peanut butter cookies":[18,"1 cup peanut butter|½ cup sugar|½ cup brown sugar|¼ cup milk|1 tsp vanilla|1 cup flour|½ tsp baking soda|¼ tsp salt","Heat the oven to 350°F (175°C).|Mix the peanut butter, both sugars, milk and vanilla until smooth. Stir in the flour, baking soda and salt.|Roll into balls and flatten with a fork in a criss-cross pattern on a lined baking sheet.|Bake 10 to 12 minutes. Cool on the tray 5 minutes."],"Suji halwa":[4,"1 cup semolina (sooji)|¾ cup sugar|3 cups water|½ cup ghee or butter|¼ cup cashews and raisins|4 cardamom pods, crushed|Pinch of saffron (optional)","Heat the water with the sugar, cardamom and saffron until the sugar dissolves. Keep it hot.|Roast the semolina in the ghee on medium for 8 to 10 minutes, stirring, until golden and fragrant. Add the cashews and raisins.|Carefully pour in the hot syrup (it will splutter) and stir quickly.|Cook 3 to 5 minutes until thick and the ghee separates. Serve warm."],"Coconut ladoo":[12,"2 cups desiccated coconut, plus extra for rolling|1 can (14 oz) sweetened condensed milk|½ tsp cardamom powder|1 tbsp ghee (optional)","Cook the coconut and condensed milk in a pan on low for 5 to 6 minutes, stirring, until it comes together as a thick, sticky mass. Stir in the cardamom.|Cool until you can handle it.|Roll into balls and coat in extra coconut."],"Chocolate avocado mousse":[3,"2 ripe avocados|⅓ cup cocoa powder|⅓ cup maple syrup or honey|¼ cup milk|1 tsp vanilla|Pinch of salt|Berries to serve","Blend the avocados, cocoa, syrup, milk, vanilla and salt until completely smooth, scraping down the sides.|Chill 30 minutes and serve with berries."],"Mango lassi":[2,"1½ cups mango (fresh or frozen)|1 cup yogurt|½ cup milk|1 tbsp sugar or honey|4 ice cubes|Pinch of cardamom (optional)","Blend everything until smooth and frothy.|Pour into glasses and serve right away."],"Roasted chickpeas":[3,"1 can (15 oz) chickpeas, drained and patted very dry|1 tbsp oil|½ tsp salt|1 tsp paprika or cumin","Heat the oven to 425°F (220°C).|Toss the chickpeas with the oil, salt and spices.|Roast 25 to 30 minutes, shaking the pan halfway, until crisp. They crisp more as they cool."],"Caprese skewers":[4,"1 pint cherry tomatoes|8 oz mozzarella pearls|Fresh basil leaves|Balsamic glaze|Olive oil, salt and pepper","Thread a tomato, a basil leaf and a mozzarella pearl onto each skewer.|Drizzle with olive oil and balsamic and season."],"Moroccan chickpea tagine":[4,"2 tbsp olive oil|1 onion, chopped|3 garlic cloves|1 tbsp ginger|2 tsp cumin, 1 tsp cinnamon, 1 tsp paprika, ½ tsp turmeric|1 sweet potato, cubed|2 carrots, sliced|1 can (15 oz) chickpeas, drained|1 can (14 oz) diced tomatoes|1½ cups vegetable broth|½ cup dried apricots or raisins, chopped|Salt|Cilantro or parsley (optional)|Couscous to serve","Cook the onion in the oil for 5 minutes. Add the garlic, ginger and spices for 1 minute.|Add the sweet potato, carrots, chickpeas, tomatoes, broth, apricots and salt.|Simmer, covered, for 25 to 30 minutes until the vegetables are tender and the sauce is thick.|Top with herbs and serve over couscous."],"Greek lemon potatoes":[4,"2 lb potatoes, cut in wedges|¼ cup olive oil|Juice of 2 lemons|4 garlic cloves, minced|1 tbsp oregano|1 cup vegetable broth or water|Salt and pepper","Heat the oven to 400°F (200°C).|Toss the potatoes with the oil, lemon juice, garlic, oregano, salt and pepper in a roasting pan and pour in the broth.|Roast 50 to 60 minutes, turning once or twice, until the liquid is absorbed and the potatoes are golden and soft."],"Scrambled eggs & toast":[2,"4 eggs|2 tbsp milk (optional)|1 tbsp butter|Salt and pepper|4 slices bread|Chives (optional)","Whisk the eggs, milk, salt and pepper until fully combined.|Melt the butter in a nonstick pan on medium-low.|Pour in the eggs and stir slowly with a spatula, pushing them from the edges to the middle, for 2 to 3 minutes until just set but still creamy.|Take the pan off the heat while the eggs still look a little glossy, since they keep cooking.|Toast the bread and serve the eggs on top with chives."],"Veggie omelette":[1,"3 eggs|1 tbsp milk (optional)|1 tbsp butter|½ cup chopped vegetables (bell pepper, mushrooms, spinach, tomato)|¼ cup shredded cheese|Salt and pepper","Cook the vegetables in half the butter for 3 minutes. Set aside.|Beat the eggs with the milk, salt and pepper.|Melt the rest of the butter in a nonstick pan on medium. Pour in the eggs and gently pull the edges toward the middle so the runny egg flows underneath.|When almost set, put the vegetables and cheese on one half.|Fold the other half over and slide onto a plate."],"Masala omelette":[2,"3 eggs|1 small onion, finely chopped|1 tomato, finely chopped|1 green chili, finely chopped|¼ tsp turmeric|½ tsp chili powder|2 tbsp chopped cilantro|Salt|1 tbsp oil|Toast or paratha to serve","Beat the eggs with the onion, tomato, chili, turmeric, chili powder, cilantro and salt.|Heat the oil in a nonstick pan on medium.|Pour in the mixture and spread it out. Cook 2 to 3 minutes until the bottom is golden and the top is mostly set.|Flip carefully and cook 1 minute more. Serve with toast."],"Egg bhurji":[2,"4 eggs|1 tbsp oil|1 onion, finely chopped|1 tomato, chopped|1 green chili, chopped|½ tsp cumin seeds|¼ tsp turmeric|½ tsp garam masala|Salt|Chopped cilantro|Pav, toast or roti to serve","Heat the oil, add the cumin seeds, then the onion and chili. Cook until soft, about 4 minutes.|Add the tomato, turmeric and salt and cook 3 minutes until soft.|Pour in the beaten eggs and stir gently for 2 to 3 minutes until just set but still moist.|Sprinkle with garam masala and cilantro. Serve with pav, toast or roti."],"Huevos rancheros":[2,"4 eggs|4 corn tortillas|1 tbsp oil, plus more for frying|1 can (15 oz) beans (black or refried)|1½ cups salsa|1 avocado, sliced|½ cup crumbled cheese (queso fresco or feta)|Cilantro (optional)|Salt","Warm the beans in a small pot, mashing them lightly.|Fry the tortillas in a little oil for 20 seconds per side until just crisp. Warm the salsa in another pot.|Fry the eggs sunny-side up in the 1 tbsp of oil, seasoning with salt.|Put 2 tortillas on each plate, spread with beans, and top with the eggs, salsa, avocado, cheese and cilantro."],"Shakshuka":[4,"6 eggs|2 tbsp olive oil|1 onion, chopped|1 bell pepper, chopped|3 garlic cloves|1 can (28 oz) crushed tomatoes|1 tsp cumin, 1 tsp paprika, ½ tsp chili flakes|Salt|Feta and parsley (optional)|Crusty bread to serve","Cook the onion and pepper in the oil for 6 minutes. Add the garlic and spices for 1 minute.|Add the tomatoes and salt and simmer 10 minutes until thickened.|Make 6 small wells in the sauce and crack an egg into each.|Cover and cook 6 to 8 minutes until the whites are set and the yolks are still soft.|Top with feta and parsley and serve with bread."],"Veggie frittata":[4,"8 eggs|½ cup milk|1 tbsp olive oil|1 onion, chopped|1 bell pepper and 1 zucchini, diced|2 cups spinach|½ cup shredded cheese|Salt and pepper","Heat the oven to 400°F (200°C).|Cook the onion, pepper and zucchini in the oil in an oven-safe skillet for 5 minutes. Add the spinach until wilted.|Whisk the eggs, milk, cheese, salt and pepper and pour over the vegetables.|Cook on the stove for 3 minutes until the edges set, then bake 12 to 15 minutes until puffed and set in the middle.|Rest 5 minutes before slicing."],"Egg & cheese breakfast sandwich":[1,"4 slices bread (or 2 English muffins)|2 eggs|2 slices cheese|1 tbsp butter|Salt and pepper|Sliced tomato (optional)","Toast the bread.|Melt the butter in a pan on medium and fry the eggs until the whites are set, flipping if you like the yolks firm. Season.|Layer the eggs, cheese and tomato between the toast and press together so the cheese melts."],"Avocado egg toast":[1,"2 slices bread|1 avocado|2 eggs|Juice of ½ lemon|Salt, pepper and chili flakes|Oil or butter for the pan","Toast the bread. Mash the avocado with the lemon juice and a pinch of salt and spread it on the toast.|Fry the eggs in a little oil until the whites are set.|Top each toast with an egg, pepper and chili flakes."],"Breakfast egg muffins":[4,"8 eggs|¼ cup milk|1 cup chopped vegetables (spinach, bell pepper, onion)|½ cup shredded cheese|Salt and pepper|Oil for the muffin tin","Heat the oven to 375°F (190°C) and grease a 12-cup muffin tin.|Whisk the eggs, milk, salt and pepper.|Divide the vegetables and cheese between the cups and pour the egg mixture over, about three-quarters full.|Bake 18 to 20 minutes until set and lightly golden. Keeps in the fridge for 3 days."],"Egg in a hole":[2,"4 slices bread|4 eggs|2 tbsp butter|Salt and pepper","Cut a 2-inch hole in the middle of each slice of bread.|Melt the butter in a pan on medium and add the bread slices (and the cut-out circles).|Crack an egg into each hole, season, and cook 2 minutes until the white starts to set.|Flip carefully and cook 1 to 2 minutes more, depending on how runny you like the yolk."],"Breakfast for dinner":[2,"4 eggs|4 slices bread|2 tbsp butter|1 tomato, sliced|Salt and pepper|Fruit to serve","Fry or scramble the eggs in the butter and season with salt and pepper.|Toast the bread and butter it.|Serve the eggs with the toast, sliced tomato and fruit."],"Egg fried rice":[3,"3 cups cooked rice, cold|3 eggs|2 tbsp oil|3 scallions, sliced|2 garlic cloves|1 cup frozen peas and carrots|2 tbsp soy sauce|1 tsp sesame oil|Pepper","Beat the eggs. Heat 1 tbsp of oil in a large pan on high and scramble the eggs until just set. Remove.|Heat the rest of the oil and cook the garlic, peas and carrots for 2 minutes.|Add the cold rice and press it into the pan. Stir-fry 4 minutes.|Return the eggs and add the soy sauce, sesame oil, scallions and pepper. Toss for 1 minute."],"Tomato & egg stir-fry":[3,"4 eggs|3 tomatoes, cut in wedges|2 tbsp oil|1 tsp sugar|2 scallions|Salt|Cooked rice to serve","Beat the eggs with a pinch of salt. Scramble in 1 tbsp of the oil until just set and remove.|Cook the tomatoes in the remaining oil for 3 to 4 minutes until they start to break down. Add the sugar and a pinch of salt.|Return the eggs, add the scallions and toss gently for 1 minute.|Serve over rice."],"Egg drop soup":[3,"4 cups vegetable broth|2 eggs, beaten|1 tbsp cornstarch mixed with 2 tbsp water|1 tbsp soy sauce|½ tsp grated ginger|2 scallions, sliced|Pinch of white pepper|Sesame oil","Simmer the broth with the soy sauce and ginger for 5 minutes.|Stir in the cornstarch mixture until slightly thickened.|Slowly pour the beaten eggs into the simmering soup in a thin stream while stirring gently in one direction to make ribbons.|Add the scallions, pepper and a few drops of sesame oil."],"Egg curry":[4,"6 hard-boiled eggs|2 tbsp oil|1 onion, finely chopped|3 tomatoes, pureed|3 garlic cloves and 1 tbsp ginger|1 tsp cumin seeds|1 tsp coriander powder, ½ tsp turmeric, 1 tsp garam masala, ½ tsp chili powder|½ cup water|Salt|Cilantro|Rice or roti to serve","Boil the eggs for 10 minutes, cool in cold water, peel, and make a few small cuts in each.|Heat the oil, add the cumin seeds, then the onion. Cook until golden, about 8 minutes.|Add the garlic, ginger, tomato puree and spices and cook 8 to 10 minutes until the oil separates.|Add the water and salt and simmer 5 minutes. Add the eggs and simmer 5 minutes more.|Top with cilantro."],"Spanish tortilla":[4,"6 eggs|3 potatoes, thinly sliced|1 onion, thinly sliced|½ cup olive oil|Salt","Cook the potatoes and onion in the oil in a nonstick skillet on medium-low for 15 to 20 minutes until very soft, without browning. Drain, saving a spoonful of oil.|Beat the eggs with salt and mix in the potatoes and onion. Let sit 5 minutes.|Heat the saved oil in the skillet, pour in the mixture and cook on low for 6 to 8 minutes until set around the edges.|Place a plate over the pan, flip the tortilla onto it, and slide it back in. Cook 3 to 4 minutes more. Serve warm or at room temperature."],"Spinach quiche":[6,"1 pie crust (9 inch)|4 eggs|1½ cups milk or cream|10 oz spinach (fresh, or frozen and squeezed dry)|1 cup shredded cheese|1 onion, chopped|1 tbsp butter|Salt, pepper and a pinch of nutmeg","Heat the oven to 375°F (190°C). Bake the empty crust for 10 minutes.|Cook the onion in the butter for 5 minutes. Add the spinach until wilted and squeeze out any water.|Whisk the eggs, milk, salt, pepper and nutmeg.|Spread the onion, spinach and cheese in the crust and pour the egg mixture over.|Bake 35 to 40 minutes until set in the middle and golden. Rest 10 minutes before slicing."],"Egg salad sandwich":[4,"6 eggs|3 tbsp mayonnaise or plain yogurt|1 tsp mustard|1 celery stalk, chopped|2 tbsp chopped onion|Salt and pepper|8 slices bread|Lettuce (optional)","Boil the eggs for 10 minutes, cool in cold water and peel.|Chop the eggs and mix with the mayonnaise, mustard, celery, onion, salt and pepper.|Pile onto bread with lettuce."],"Mushroom carbonara":[3,"12 oz spaghetti|3 eggs|¾ cup grated vegetarian hard cheese|8 oz mushrooms, sliced|3 garlic cloves|2 tbsp olive oil|Lots of black pepper|Salt","Cook the spaghetti in salted water. Save a cup of the pasta water, then drain.|Brown the mushrooms in the oil for 6 to 8 minutes. Add the garlic for 1 minute.|Whisk the eggs with the cheese and plenty of pepper.|Take the pan off the heat. Toss the hot pasta with the mushrooms, then pour in the egg mixture, tossing quickly with splashes of pasta water until creamy. The heat cooks the sauce without scrambling the eggs."],"Tamagoyaki":[3,"4 eggs|1 tbsp sugar|1 tbsp soy sauce|1 tbsp mirin or water|Oil for the pan","Whisk the eggs with the sugar, soy sauce and mirin until smooth.|Heat a lightly oiled small nonstick pan on medium-low and pour in a thin layer of egg.|When it is almost set, roll it up from one end to the other and push it to the side.|Oil the pan again, add another thin layer under the roll and roll again. Repeat until all the egg is used.|Slide onto a board, let it rest 2 minutes and slice."],"Deviled eggs":[6,"6 eggs|3 tbsp mayonnaise or plain yogurt|1 tsp mustard|1 tsp vinegar|Salt and pepper|Paprika to serve","Boil the eggs for 10 minutes, cool in cold water and peel. Halve lengthwise.|Scoop the yolks into a bowl and mash with the mayonnaise, mustard, vinegar, salt and pepper until smooth.|Spoon the filling back into the whites and sprinkle with paprika."],"Spanakopita":[8,"1 lb spinach (or 10 oz frozen)|8 oz feta, crumbled|1 cup ricotta or cottage cheese|3 eggs|1 onion, chopped|3 scallions|¼ cup chopped dill or parsley|10 sheets phyllo dough|½ cup melted butter or olive oil|Salt, pepper and nutmeg","Heat the oven to 375°F (190°C).|Cook the onion in a little oil until soft. Wilt the spinach, cool, and squeeze out all the water. Mix with the feta, ricotta, eggs, scallions, dill, salt, pepper and nutmeg.|Brush a baking dish with butter. Layer half the phyllo, brushing each sheet with butter.|Spread the filling over and top with the remaining phyllo, brushing each sheet. Score the top into squares.|Bake 40 to 45 minutes until deep golden and crisp."],"Flan":[8,"4 eggs|1 can (14 oz) sweetened condensed milk|1 can (12 oz) evaporated milk|1 tsp vanilla|¾ cup sugar (for the caramel)","Heat the oven to 350°F (175°C).|Melt the sugar in a small pan on medium until it turns amber. Quickly pour it into a round cake pan and tilt to coat the bottom.|Blend the eggs, both milks and vanilla until smooth and pour into the pan.|Set the pan in a larger pan filled with hot water about halfway up the sides. Bake 50 minutes until set with a slight wobble.|Chill at least 4 hours, then run a knife around the edge and flip onto a plate."],"Chocolate mousse":[4,"6 oz dark chocolate, chopped|3 eggs, separated|2 tbsp sugar|1 tbsp butter|½ cup cream, whipped","Melt the chocolate and butter together and let cool slightly.|Whisk the egg yolks with half the sugar, then stir into the chocolate.|Whisk the egg whites until foamy, add the remaining sugar and whisk to stiff peaks.|Fold the whipped cream, then the egg whites, into the chocolate in two batches.|Spoon into glasses and chill at least 2 hours. (This uses raw eggs, so use fresh or pasteurized ones.)"]};

const MEALS = ["Any","Breakfast","Lunch","Dinner","Dessert","Snack"];
const EFFORT = [["Any",9999],["Quick (under 30 min)",30],["Under an hour",60]];

// ---- storage ----
const KEY = "dinnerIdeas.v1";
let S = { custom:[], favs:[], hidden:[], made:{}, mealF:"Dinner", effortF:0, tagF:"", cuisineF:"", fridge:[], fridgeOther:[], current:null };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const all = () => [...BUILTIN, ...S.custom].filter(m => !S.hidden.includes(m.id));
const find = id => [...BUILTIN, ...S.custom].find(m => m.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hasRecipe = m => !!(m && ((m.ingredients||"").trim() || (m.steps||"").trim()));
const lines = t => String(t||"").split("\n").map(x=>x.trim()).filter(Boolean);
const mins = m => m.mins<60 ? m.mins+" min" : Math.floor(m.mins/60)+" hr"+(m.mins%60?" "+m.mins%60+" min":"");

function ago(id){
  const t = S.made[id]; if(!t) return null;
  const d = Math.floor((Date.now()-t)/864e5);
  return d<=0 ? "today" : d===1 ? "yesterday" : d<14 ? d+" days ago" : Math.round(d/7)+" weeks ago";
}

function pool(){
  const max = EFFORT[S.effortF][1];
  return all().filter(m => (S.mealF==="Any"||m.meal===S.mealF) && m.mins<=max && (!S.tagF || (m.tags||[]).includes(S.tagF)) && (!S.cuisineF || m.cuisine===S.cuisineF));
}

const prep = t => String(t).toLowerCase().replace(/egg-free|eggless/g,"")

}
const recipeCache = {};
const MAIN = {"Scallion pancakes":["scallion"],"Tabbouleh":["parsley"]};   // garnish-type ingredients that are the point of the dish
const keysIn = t => CANON.filter(c=>c[1].test(t)).map(c=>c[0]);
function needs(m){
  const ck=m.id+"|"+(m.ingredients||"").length;
  if(recipeCache[ck]) return recipeCache[ck];
  const req=new Set(), opt=new Set(), groups=[];
  const glob=k=>CK[k][5];
  for(const line of String(m.ingredients||"").split("\n")){
    const t=prep(line);
    if(/optional|toppings|to serve|dipping/i.test(line)){ keysIn(t).forEach(k=>opt.add(k)); continue; }
    // split the line into items; "X or Y" (or ", or Y") means either one will do
    const items=[];
    for(const part of t.split(",")){
      const p=part.trim(); if(!p) continue;
      if(/^or\b/.test(p) && items.length){   // ", or Y" belongs to the last item that named an ingredient
        let j=items.length-1; while(j>0 && !items[j].some(x=>keysIn(x).length)) j--;
        items[j].push(p.replace(/^or\s+/,""));
      }
      else items.push(p.split(/\bor\b/));
    }
    for(const segs of items){
      const ks=segs.map(keysIn);
      if(segs.length===1){ ks[0].forEach(k=>glob(k)?opt.add(k):req.add(k)); continue; }
      if(ks.every(x=>x.length)){ const any=[...new Set(ks.flat())]; if(any.some(glob)) any.forEach(k=>opt.add(k)); else if(any.length===1) req.add(any[0]); else groups.push(any); }
      else ks.flat().forEach(k=>opt.add(k));   // the other choice is something we don't track (water, eggless mayo...)
    }
  }
  (MAIN[m.name]||[]).forEach(k=>req.add(k));
  req.forEach(k=>opt.delete(k));
  const g2=groups.filter(g=>!g.some(k=>req.has(k)));
  return recipeCache[ck]={req:[...req],groups:g2,opt:[...opt]};
}
function fridgeMatches(){
  const has=new Set(S.fridge);
  const hasVeg = VEG.some(k=>has.has(k)), hasFruit = FRUIT.some(k=>has.has(k));
  const ok = k => has.has(k) || (k==="vegetables"&&hasVeg) || (k==="fruit"&&hasFruit);
  const out=[];
  for(const m of all()){
    if(!hasRecipe(m)) continue;
    const n=needs(m), total=n.req.length+n.groups.length; if(!total) continue;
    const haveS=n.req.filter(ok), haveG=n.groups.filter(g=>g.some(ok));
    const missing=[...n.req.filter(k=>!ok(k)).map(k=>CK[k][3]), ...n.groups.filter(g=>!g.some(ok)).map(g=>g.map(k=>CK[k][3]).join(" or "))];
    const nice=n.opt.filter(k=>!ok(k)).map(k=>CK[k][3]);
    if(haveS.length+haveG.length===0) continue;
    out.push({m,have:haveS.length+haveG.length,missing,nice,total});
  }
  out.sort((a,b)=>a.missing.length-b.missing.length || b.have-a.have || a.m.mins-b.m.mins);
  return out;
}

const photos = {};           // meal id -> object URL for display
let pendingPhoto = null, pendingURL = null;   // photo chosen in the "Add your own" form before saving: Blob | "remove" | null
let _db = null;
function photoDB(){
  return _db || (_db = new Promise((res,rej)=>{
    try{ const r=indexedDB.open("dinnerPhotos",1); r.onupgradeneeded=()=>r.result.createObjectStore("photos"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }
    catch(e){ rej(e); }
  }));
}
async function photoTx(mode, fn){
  const d=await photoDB();
  return new Promise((res,rej)=>{ const t=d.transaction("photos",mode); fn(t.objectStore("photos")); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
}
async function loadPhotos(){
  try{
    const d=await photoDB();
    await new Promise((res,rej)=>{ const req=d.transaction("photos").objectStore("photos").openCursor();
      req.onsuccess=()=>{ const c=req.result; if(c){ photos[c.key]=URL.createObjectURL(c.value); c.continue(); } else res(); }; req.onerror=()=>rej(req.error); });
  }catch(e){}
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
}
function showPhoto(id,blob){ if(photos[id]) URL.revokeObjectURL(photos[id]); photos[id]=URL.createObjectURL(blob); }
async function putPhoto(id,blob){ showPhoto(id,blob); await photoTx("readwrite",st=>st.put(blob,id)); }
async function deletePhoto(id){
  if(photos[id]){ URL.revokeObjectURL(photos[id]); delete photos[id]; }
  try{ await photoTx("readwrite",st=>st.delete(id)); }catch(e){}
}
// shrink big camera photos (often 3000+ px) so they stay small and quick
async function shrinkPhoto(file, max=900){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("bad image")); i.src=url; });
    const k=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.naturalWidth*k)); c.height=Math.max(1,Math.round(img.naturalHeight*k));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode failed")),"image/jpeg",0.82));
  } finally { URL.revokeObjectURL(url); }
}

  /* ---------- scatter items inside an ellipse without piling up ---------- */

        let ok = true; for (const p of placed) { const d = Math.hypot(p.x - x, p.y - y); if (d < (p.s + it.s) * (tries < 25 ? .95 : .55)) { ok = false; break; } }

      placed.push({ x: best.x, y: best.y, s: it.s });

function guessStyle(m){
  const n=m.name.toLowerCase();
  const has=(...w)=>w.some(x=>n.includes(x));
  if(has("pizza")) return "pizza"; if(has("burger")) return "burger"; if(has("sandwich")) return "sandwich"; if(has("taco")) return "taco"; if(has("wrap","burrito")) return "wrap";
  if(has("pancake","waffle","crêpe","crepe","french toast")) return "stack"; if(has("cookie","brownie","biscuit")) return "cookie"; if(has("ice cream","pudding","mousse","kheer","halwa","custard")) return m.meal==="Dessert"?"scoop":"bowl";
  if(has("smoothie","lassi","juice","shake","milkshake","lemonade")) return "glass"; if(has("pie","quiche","tart")) return "pie"; if(has("lasagna","bake","gratin","casserole","parmesan","enchilada")) return "tray";
  if(has("soup","stew","chili","curry","dal","masala","korma","salad","pasta","spaghetti","noodle","ramen","rice","biryani","pulao","risotto","porridge","oat","bowl")) return "bowl";
  if(has("stir","fry","saute","sauté","scramble","omelette","frittata","hash")) return "pan";
  if(m.meal==="Dessert") return "cookie"; if(m.meal==="Breakfast"||m.meal==="Snack") return "plate"; return "bowl";
}
function autoSpec(m){
  const v=m.style||guessStyle(m), n=String(m.name).toLowerCase(), has=(...w)=>w.some(x=>n.includes(x));
  let base="";
  if(["bowl","pan","pot","plate","tray","pie","glass"].includes(v)){
    if(v==="tray") base="baked:#e9a74c";
    else if(v==="glass") base="sauce:#f6e7c1";
    else if(has("salad")) base="salad";
    else if(has("curry","masala","dal","korma","gravy","bhaji")) base="curry:#e8a33a";
    else if(has("soup","stew","chili","broth","rasam","chowder")) base="broth:#d9a14a";
    else if(has("pasta","spaghetti","penne","alfredo","ziti")) base="pasta:#f2d27a";
    else if(has("noodle","ramen","udon","lo mein","pho")) base="noodles:#efd9a0";
    else if(has("rice","pulao","biryani","risotto","khichdi")) base="rice:#efe3b8";
    else if(v==="bowl") base="plain:#f5eed8"; else if(v==="pan") base="sauce:#c98a3a";
  }
  const tops=[]; if(m.ingredients){ const nd=needs(m); for(const k of [...nd.req,...nd.groups.map(g=>g[0]),...nd.opt]){ const t=KEY2TOP[k]; if(t&&!tops.includes(t)) tops.push(t); if(tops.length>=6) break; } }
  const opts={rim:RIMS[DA.hash(m.name)%RIMS.length]};
  if(v==="stack") opts.layers=4; if(v==="pie") opts.lattice=has("apple","fruit","berry");
  if(v==="cookie") opts.cake="#d9a15c"; if(v==="scoop") opts.scoops=["#fff4d6","#f6a8b8"];
  return [v,base,tops,opts];
}
const artCache = new Map();
function dishSVG(m, mini){
  const key=m.id+"|"+(mini?1:0)+"|"+(m.style||"")+"|"+m.name+"|"+(m.ingredients||"").length;
  let v=artCache.get(key); if(v!==undefined) return v;
  try{ const sp=SPECS[m.name]; v=DA.render(sp?[sp[0],sp[1],sp[2]?sp[2].split(","):[],sp[3]||{}]:autoSpec(m), m.name, {mini}); }catch(e){ v=""; }
  artCache.set(key,v); return v;
}

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("show"),1800);
}

function buildDeck(){
  const p = pool();
  // shuffle, weighted toward meals not made recently
  deckIds = p.map(m=>{
    const days = S.made[m.id] ? (Date.now()-S.made[m.id])/864e5 : 60;
    return [m.id, Math.random()*(1+Math.min(days,60))];
  }).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
function topMeal(){ while(deckIds.length && !find(deckIds[0])) deckIds.shift(); return deckIds[0] && find(deckIds[0]); }

function cardHTML(m, back){
  const a = ago(m.id);
  return `<div class="card ${back?"back":""}" ${back?"":'id="top"'}>
    ${back?"":`<button class="heart ${S.favs.includes(m.id)?"on":""}" id="heart" aria-label="Favorite">${S.favs.includes(m.id)?"♥":"♡"}</button>

  <div class="scroll"><button class="chip c ${!S.cuisineF?"on":""}" data-cuisine="">🌍 All cuisines</button>${CUISINES.map(([n,e])=>`<button class="chip c ${n===S.cuisineF?"on":""}" data-cuisine="${n}">${e} ${n}</button>`).join("")}</div>

  // keep the chosen chip in view in each scrolling row
  filters.querySelectorAll(".scroll").forEach(row=>{

function renderDeck(){
  const m = topMeal();
  if(!m){
    stage.innerHTML = `<div class="empty"><div class="big">${pool().length?"🎉":"🤔"}</div>
      <p>${pool().length?"You've seen everything here!":"Nothing matches those filters."}</p>
      <button class="btn" id="again">${pool().length?"Start over":"Show all meals"}</button></div>`;
    return;
  }
  const next = deckIds[1] && find(deckIds[1]);
  stage.innerHTML = `<div class="deck">${next?cardHTML(next,true):""}${cardHTML(m,false)}</div>
    <div class="actions">
      <button class="round" id="no" aria-label="Skip">✕</button>

      <button class="round yes" id="yes" aria-label="Make this">✓</button>

function decide(yes){
  const el=$("#top"); const m=topMeal(); if(!el||!m) return;
  el.style.transition="transform .3s, opacity .3s";
  el.style.transform=`translateX(${yes?500:-500}px) rotate(${yes?25:-25}deg)`; el.style.opacity=0;
  setTimeout(()=>{
    deckIds.shift();
    if(yes){ S.made[m.id]=Date.now(); save(); toast(`Great choice! Enjoy the ${m.name.toLowerCase()} 🍽️`); }
    renderDeck();
  },260);
}

function attachSwipe(){
  const el=$("#top"); if(!el) return;
  let sx=0, dx=0, drag=false, moved=false;
  const yes=el.querySelector(".stamp.yes"), no=el.querySelector(".stamp.no");
  el.addEventListener("pointerdown",e=>{ if(e.target.closest("#heart,.cam")) return; drag=true; moved=false; sx=e.clientX; el.setPointerCapture(e.pointerId); el.style.transition="none"; });
  el.addEventListener("pointermove",e=>{ if(!drag) return; dx=e.clientX-sx; if(Math.abs(dx)>6) moved=true;
    el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    yes.style.opacity=Math.max(0,dx/110); no.style.opacity=Math.max(0,-dx/110); });
  const end=()=>{ if(!drag) return; drag=false;
    if(!moved){ const m=topMeal(); if(hasRecipe(m)){ el.style.transition="transform .25s"; el.style.transform=""; dx=0; return openSheet("detail",m.id); } }
    if(dx>110) decide(true); else if(dx<-110) decide(false);
    else { el.style.transition="transform .25s"; el.style.transform=""; yes.style.opacity=no.style.opacity=0; }
    dx=0; };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
}

stage.addEventListener("click",e=>{

  if(t.id==="yes") decide(true);

  else if(t.id==="again"){ if(!pool().length){ S.mealF="Any"; S.effortF=0; S.tagF=""; S.cuisineF=""; save(); renderFilters(); } buildDeck(); renderDeck(); }

filters.addEventListener("click",e=>{

        <button class="btn alt" data-act="fclear" style="margin:4px 0 0;padding:10px">Clear all</button>`:""}
      <div class="sub" style="margin-top:16px">Common things</div>
      <div class="fgrid">${PICKS.filter(k=>!S.fridge.includes(k)).map(k=>`<button class="chip" data-fk="${k}">${CK[k][2]} ${esc(CK[k][3])}</button>`).join("")}</div>
      <button class="chip" data-act="fmore" style="margin:0 0 14px">${fridgeMore?"Show fewer ▴":"More ingredients ▾"}</button>
      ${fridgeMore?`<div class="fgrid">${CANON.filter(c=>!PICKS.includes(c[0])&&!["fruit","vegetables"].includes(c[0])&&!S.fridge.includes(c[0])).map(c=>`<button class="chip" data-fk="${c[0]}">${c[2]} ${esc(c[3])}</button>`).join("")}</div>`:""}
      <div class="note2">Salt, pepper, oil, butter, flour, sugar, water and everyday spices are assumed — you don't need to add them.</div>
      ${S.fridge.length&&(ready.length+almost.length)?`<button class="btn stickybtn" data-act="fjump">🍽 See what I can make (${ready.length+almost.length}) ↓</button>`:""}
      <div id="fres"></div>
      ${S.fridge.length&&(ready.length+almost.length)?`<button class="chip" data-act="ftop" style="margin:14px 0 0">↑ Add more ingredients</button>`:""}
      ${S.fridge.length? (sec("✅ Ready to make",ready,12)+sec("Almost there",almost,12)+sec("Needs a few more things",few,8)+(!res.length?'<p class="empty">Nothing matches yet. Try adding a few more things.</p>':"")) : '<p class="empty"><span class="big">🧊</span><br>Add a few ingredients to see ideas.</p>'}
      ${S.fridgeOther.length?`<p class="sub">I don't know "${esc(S.fridgeOther.join('", "'))}" yet, so it won't change the results.</p>`:""}`;
  }
  if(sheetName==="style"){
    const mode=localStorage.getItem("dinnerTheme")||"auto";
    return `<h1>Make it yours</h1><p class="sub">Pick your look</p>
      <label>Color</label>
      <div class="sws">${Object.keys(COLORS).map(k=>`<button class="sw ${k===color?"on":""}" data-color="${k}"><i style="background:${COLORS[k].c}">${k===color?"✓":""}</i>${COLORS[k].name}</button>`).join("")}</div>
      <label>Light or dark</label>
      <div class="seg">${[["light","☀️ Light"],["dark","🌙 Dark"],["auto","📱 Auto"]].map(([k,n])=>`<button class="chip ${mode===k?"on":""}" data-mode="${k}">${n}</button>`).join("")}</div>
      <label>App icon</label>
      <div class="icons">${ICONS.map(ic=>`<button class="ic ${ic===icon?"on":""}" data-icon="${ic}" style="background:${COLORS[color].c}" aria-label="Icon ${ic}"><span>${ic}</span></button>`).join("")}</div>
      <div class="note2">🔄 App version <b>${APP_VERSION}</b>. The app updates itself when you open it. If something looks old, tap the button below.</div>
      <button class="btn alt" data-act="forceupdate">🔄 Update the app now</button>
      <div class="note2">📲 Phones only look at the icon when you add the app. To change the icon on the home screen, delete the app icon, open this page again, and tap <b>Add to Home Screen</b> (iPhone) or <b>Install app</b> (Android).</div>`;
  }
  if(sheetName==="detail"){
    const m=find(detailId); if(!m) return "";
    const ing=lines(m.ingredients), st=lines(m.steps);
    return `<div class="detail">${photos[m.id]?`<div class="phbig" ${bgImg(m.id)} role="img" aria-label="Photo of ${esc(m.name)}"></div>`:`<div class="blob art">${dishSVG(m)}</div>`}<h1>${esc(m.name)}</h1>
      <div class="sub">${esc(m.note||"")}</div>
      <div class="meta"><span class="tag">${esc(m.meal)}${m.cuisine&&m.cuisine!=="Other"?" · "+esc(m.cuisine):""}</span><span class="tag">⏱ ${mins(m)}</span>${m.serves?`<span class="tag">🍽 Serves ${m.serves}</span>`:""}${(m.tags||[]).map(t=>`<span class="tag food">${TAG_ICON[t]||""} ${esc(t)}</span>`).join("")}</div>
      <button class="btn" data-make="${m.id}">✅ We're making this!</button>
      ${photoButtons(m.id,!!photos[m.id])}${photos[m.id]?`<button class="chip" data-delphoto="${m.id}">Remove photo</button>`:""}
      ${ing.length?`<div class="box"><h3>Ingredients</h3><ul>${ing.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
      ${st.length?`<div class="box"><h3>How to make it</h3><ol>${st.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`:""}
      ${String(m.id).startsWith("c")?`<button class="btn alt" data-edit="${m.id}">✏️ Edit this recipe</button>`:""}</div>`;
  }
  const e=S.custom.find(x=>x.id===editId)||{};
  const et=e.tags||[];
  return `<h1>${e.id?"Edit recipe":"Add your own"}</h1><p class="sub">Family recipes and favorites</p>
    <label>Meal name</label><input id="n" placeholder="e.g. Grandma's rice and beans" value="${esc(e.name||"")}">
    <label>Type</label><select id="m">${MEALS.slice(1).map(x=>`<option ${x===(e.meal||"Dinner")?"selected":""}>${x}</option>`).join("")}</select>
    <label>Cuisine</label><select id="cu">${["Other",...CUISINES.map(c=>c[0])].map(x=>`<option ${x===(e.cuisine||"Other")?"selected":""}>${x}</option>`).join("")}</select>
    <label>Minutes to make</label><input id="t" type="number" inputmode="numeric" min="1" value="${e.mins||30}">
    <label>Good for</label><div>${Object.keys(TAGS).map(k=>`<button type="button" class="chip tg ${et.includes(k)?"on":""}" data-ftag="${k}">${TAG_ICON[k]} ${k}</button>`).join("")}</div>
    <label style="display:block;margin-top:6px">Ingredients (one per line)</label><textarea id="ing" placeholder="2 cups rice&#10;1 can chickpeas&#10;1 onion">${esc(e.ingredients||"")}</textarea>
    <label>Steps (one per line, optional)</label><textarea id="stp" placeholder="Rinse the rice&#10;Cook the onion…">${esc(e.steps||"")}</textarea>
    <label>Note (optional)</label><input id="o" placeholder="e.g. marinate overnight" value="${esc(e.note||"")}">
    <label style="display:block">Picture of the dish (the ingredients you type are drawn on it)</label>
    <div class="stylepick" id="stylepick">${STYLES.map(([k,n])=>`<button type="button" class="sp ${k===(e.style||"")?"on":""}" data-pickstyle="${k}">${k?stylePreview(k):`<span class="auto">✨</span>`}<span>${n}</span></button>`).join("")}</div>
    <label style="display:block">Photo (optional)</label><div class="pprev" id="pprev">${formPhotoHTML(e)}</div>${photoButtons("form",false)}
    <button class="btn" data-act="add">${e.id?"Save changes":"Add this meal"}</button>
    ${e.id?`<button class="btn alt" data-act="cancel">Cancel</button>`:""}
    ${S.custom.length?`<p class="sub" style="margin-top:20px">Your meals</p>`+S.custom.map(m=>itemRow(m,`<button class="icon" data-edit="${m.id}" aria-label="Edit">✏️</button><button class="icon" data-del="${m.id}" aria-label="Delete">🗑</button>`)).join(""):""}`;
}
function openSheet(n,id){
  if(n==="detail"){ prevSheet = sheet.hidden ? null : sheetName; detailId=id; }
  else { prevSheet=null; if(n==="add" && id===undefined){ editId=null; pendingPhoto=null; pendingURL=null; } }
  sheetName=n; renderSheet(); sheet.hidden=false; sheet.scrollTop=0;
}
function renderSheet(){
  sheet.innerHTML=`<div class="in"><div class="top"><button class="ib" data-close aria-label="Back">←</button></div>${sheetBody()}</div>`;
}
function closeSheet(){
  if(sheetName==="detail"){
    if(prevSheet){ const p=prevSheet; prevSheet=null; sheetName=p; renderSheet(); return; }
    sheet.hidden=true; return;   // opened from the card: keep the deck as it was
  }
  sheet.hidden=true; editId=null; pendingPhoto=null; pendingURL=null; buildDeck(); renderDeck();
}

function addFridgeText(){
  const el=$("#fi"); if(!el) return;
  for(const raw of el.value.split(/[,\n&;]|\band\b/i)){
    const tok=raw.trim(); if(!tok) continue;
    const k=findKey(tok,true);
    if(k){ if(!S.fridge.includes(k)) S.fridge.push(k); }
    else if(!S.fridgeOther.includes(tok.toLowerCase())) S.fridgeOther.push(tok.toLowerCase());
  }
  el.value=""; save();
}
function toggleFav(id){ S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id]; save(); }

document.querySelector("header nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-open]"); if(b) openSheet(b.dataset.open);
});
sheet.addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.id==="fi"){ e.preventDefault(); addFridgeText(); renderSheet(); const f=$("#fi"); if(f) f.focus(); }
});
sheet.addEventListener("input",e=>{
  if(e.target.id==="q"){ window._q=e.target.value; const p=e.target.selectionStart; renderSheet();
    const q=$("#q"); q.focus(); q.setSelectionRange(p,p); }
});
sheet.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");
  if(v && !e.target.closest("button")) return openSheet("detail",v.dataset.view);
  const t=e.target.closest("button"); if(!t) return; const d=t.dataset;
  if(d.close!==undefined) return closeSheet();
  if(d.act==="forceupdate"){ forceUpdate(); return; }
  if(d.act==="fjump"){ const r=$("#fres"); if(r) sheet.scrollTo({top:r.offsetTop-12,behavior:"smooth"}); return; }
  if(d.act==="ftop"){ sheet.scrollTo({top:0,behavior:"smooth"}); return; }
  if(d.ftag){ t.classList.toggle("on"); return; }
  if(d.pickstyle!==undefined){ document.querySelectorAll(".sp").forEach(x=>x.classList.toggle("on",x===t)); return; }
  if(d.act==="fprem"){ pendingPhoto="remove"; if(pendingURL){ URL.revokeObjectURL(pendingURL); pendingURL=null; } $("#pprev").innerHTML=""; return; }
  if(d.delphoto){ deletePhoto(d.delphoto).then(()=>{ renderSheet(); toast("Photo removed"); }); return; }
  if(d.edit){ editId=d.edit; pendingPhoto=null; pendingURL=null; sheetName="add"; prevSheet=null; renderSheet(); sheet.scrollTop=0; return; }
  if(d.fav) toggleFav(d.fav);
  else if(d.fk){ S.fridge = S.fridge.includes(d.fk) ? S.fridge.filter(x=>x!==d.fk) : [...S.fridge,d.fk]; save(); }
  else if(d.fx!==undefined){ S.fridgeOther.splice(+d.fx,1); save(); }
  else if(d.act==="fmore"){ fridgeMore=!fridgeMore; }
  else if(d.act==="fclear"){ S.fridge=[]; S.fridgeOther=[]; save(); }
  else if(d.act==="fadd"){ addFridgeText(); }
  else if(d.make){ S.made[d.make]=Date.now(); save(); toast("Great choice! Enjoy 🍽️"); }
  else if(d.color){ setColor(d.color); }
  else if(d.mode){ setMode(d.mode); }
  else if(d.icon){ setIcon(d.icon); }
  else if(d.hide){ S.hidden.push(d.hide); save(); toast("Hidden. Bring it back anytime."); }
  else if(d.del){ if(!confirm("Delete this meal?")) return; if(editId===d.del) editId=null; S.custom=S.custom.filter(m=>m.id!==d.del); S.favs=S.favs.filter(x=>x!==d.del); deletePhoto(d.del); save(); }
  else if(d.act==="unhide"){ S.hidden=[]; save(); }
  else if(d.act==="add"){
    const name=$("#n").value.trim(); if(!name){ toast("Please type a meal name"); return; }
    const pk=document.querySelector(".sp.on"); const fields={name,style:pk?pk.dataset.pickstyle:"",meal:$("#m").value,cuisine:$("#cu").value,mins:Math.max(1,parseInt($("#t").value)||30),note:$("#o").value.trim(),
      ingredients:$("#ing").value.trim(),steps:$("#stp").value.trim(),
      tags:[...document.querySelectorAll(".chip.tg.on")].map(x=>x.dataset.ftag)};
    const old=S.custom.find(x=>x.id===editId);
    let pid;
    if(old){ Object.assign(old,fields); save(); pid=old.id; editId=null; toast("Saved ✓"); }
    else { const m={id:"c"+Date.now(),emoji:"🍽️",...fields}; S.custom.push(m); S.favs.push(m.id); save(); pid=m.id; toast("Added! ♥ Saved to favorites"); }
    if(pendingPhoto instanceof Blob){ putPhoto(pid,pendingPhoto).then(()=>{ if(!sheet.hidden) renderSheet(); }).catch(()=>toast("Couldn't save the photo on this device")); }
    else if(pendingPhoto==="remove") deletePhoto(pid);
    if(pendingURL) URL.revokeObjectURL(pendingURL); pendingPhoto=null; pendingURL=null;
    sheet.scrollTop=0;
  }
  else if(d.act==="cancel"){ editId=null; pendingPhoto=null; pendingURL=null; }
  else return;
  renderSheet();
  if(d.act==="fadd"){ const f=$("#fi"); if(f) f.focus(); }
});

// ---- look: color, dark mode, app icon ----
const COLORS = {
  green :{name:"Green", c:"#15803d", c2:"#22c55e", bgdark:"#052e16"},
  purple:{name:"Purple",c:"#7e22ce", c2:"#a855f7", bgdark:"#3b0764"},
  blue  :{name:"Blue",  c:"#1d4ed8", c2:"#3b82f6", bgdark:"#172554"},
  orange:{name:"Orange",c:"#ea580c", c2:"#fb923c", bgdark:"#431407"}
};
const ICONS = ["🍽️","🥗","🍲","🌮","🍕","🍛","🥘","🍜"];
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} };
let color = COLORS[lsGet("dinnerColor")] ? lsGet("dinnerColor") : "green";
let icon = ICONS.includes(lsGet("dinnerIcon")) ? lsGet("dinnerIcon") : ICONS[0];
let manifestURL = null;

function isDark(){
  const t=document.documentElement.dataset.theme;
  return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}

function iconURL(size){
  const c=document.createElement("canvas"); c.width=c.height=size;
  const g=c.getContext("2d"), col=COLORS[color];
  const grad=g.createLinearGradient(0,0,size,size); grad.addColorStop(0,col.c2); grad.addColorStop(1,col.c);
  g.fillStyle=grad; g.fillRect(0,0,size,size);
  g.fillStyle="rgba(255,255,255,.93)"; g.beginPath(); g.arc(size/2,size/2,size*.34,0,Math.PI*2); g.fill();
  g.font=`${Math.round(size*.42)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  g.textAlign="center"; g.textBaseline="middle"; g.fillStyle="#000";
  g.fillText(icon,size/2,size/2+size*.03);
  return c.toDataURL("image/png");
}

function applyBranding(){
  document.documentElement.dataset.color=color;
  const meta=document.querySelector('meta[name=theme-color]'); if(meta) meta.content=isDark()?COLORS[color].bgdark:COLORS[color].c;
  try{
    const i180=iconURL(180), i192=iconURL(192), i512=iconURL(512);
    document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(l=>l.href=i180);
    document.querySelectorAll('link[rel="icon"]').forEach(l=>l.href=i192);
    const man={name:"What's for Dinner?",short_name:"Dinner Ideas",description:"Easy vegetarian meal ideas.",
      start_url:new URL("index.html",location.href).href,scope:new URL("./",location.href).href,display:"standalone",
      background_color:"#fafaf9",theme_color:COLORS[color].c,
      icons:[{src:i192,sizes:"192x192",type:"image/png"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    const url=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));
    const link=document.querySelector('link[rel="manifest"]'); if(link) link.href=url;
    if(manifestURL) URL.revokeObjectURL(manifestURL); manifestURL=url;
  }catch(e){}
}
function setColor(k){ color=k; lsSet("dinnerColor",k); applyBranding(); }
function setIcon(i){ icon=i; lsSet("dinnerIcon",i); applyBranding(); }
function setMode(m){
  if(m==="auto"){ delete document.documentElement.dataset.theme; lsSet("dinnerTheme",null); }
  else { document.documentElement.dataset.theme=m; lsSet("dinnerTheme",m); }
  applyBranding();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyBranding);

applyBranding(); renderFilters(); buildDeck(); renderDeck();
loadPhotos().then(()=>{ if(Object.keys(photos).length && sheet.hidden) renderDeck(); });
const APP_VERSION = "v18";
async function forceUpdate(){
  toast("Updating…");
  try{
    const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister()));
    const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k)));   // only the app's saved files; favorites, recipes and photos are kept
  }catch(e){}
  location.reload();
}
if("serviceWorker" in navigator){
  const hadController=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!hadController||reloaded) return; reloaded=true;                       // first ever install: nothing to refresh
    if(sheet.hidden) location.reload(); else toast("Updated! Close and reopen the app to see the new version");
  });
  navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
}
</script>
