<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3f73">
  <title>Scam Spotter</title>
  <!--
    The web version: works on phones, tablets and any computer, with nothing to install.
    It runs the SAME files as the extension (rules.js, ui.js, app.js, styles.css), so the
    detection rules only ever live in one place. Nothing is sent anywhere: the page makes
    no network requests after it loads.
  -->
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="web" data-root="../">
  <div id="app"></div>

  <script src="../rules.js"></script>
  <script src="../ui.js"></script>
  <script src="../app.js"></script>
</body>
</html>
