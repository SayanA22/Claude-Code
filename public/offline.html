<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · DayOS</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
        font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fbfbfd;
        color: #23242e;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #14151c; color: #f2f2f5; }
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
      p { margin: 0; opacity: 0.7; max-width: 22rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        DayOS needs a connection to show what's actually on your schedule.
        Everything you've saved is still there.
      </p>
    </main>
  </body>
</html>
