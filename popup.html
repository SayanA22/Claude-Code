<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Is this a scam?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <h1>Is this a scam?</h1>

  <label for="input">Paste the message or link here:</label>
  <textarea id="input" rows="5"></textarea>

  <div class="buttons">
    <button id="check" type="button">Check</button>
    <button id="clear" type="button" class="secondary">Start over</button>
  </div>

  <!-- The answer appears here. aria-live lets screen readers announce it. -->
  <div id="result" aria-live="polite"></div>

  <!-- Extension pages can't use inline scripts, so each script is its own file. -->
  <script src="rules.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
