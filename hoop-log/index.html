<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6b1a">
<title>Hoop Log</title>
<style>
:root{
  --bg:#f6f3ee; --card:#fff; --ink:#1c1c1e; --muted:#6b6b70; --line:#e6e1d8;
  --orange:#ff6b1a; --orange-d:#d9520a; --green:#1e9e5a; --red:#d8403a; --blue:#2f6fed;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141416; --card:#1f1f23; --ink:#f2f2f4; --muted:#9a9aa2; --line:#2e2e34; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#141416; --card:#1f1f23; --ink:#f2f2f4; --muted:#9a9aa2; --line:#2e2e34; color-scheme:dark;}
#theme{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:5;width:42px;height:42px;padding:0;border-radius:99px;
  background:var(--card);border:1px solid var(--line);font-size:20px;line-height:1}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.5px}
h2{font-size:18px;margin:22px 0 10px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.tile b{display:block;font-size:24px;letter-spacing:-.5px}
.tile span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);border-color:transparent}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700}
.primary{background:var(--orange);color:#fff;width:100%;font-size:17px;padding:15px}
.primary:active{background:var(--orange-d)}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 12px;font-size:14px}
.danger{color:var(--red)}
.seg{display:flex;gap:8px}
.seg button{flex:1;background:var(--bg);border:2px solid var(--line);color:var(--muted)}
.seg button.on.w{background:var(--green);border-color:var(--green);color:#fff}
.seg button.on.l{background:var(--red);border-color:var(--red);color:#fff}
.badge{display:inline-block;font-weight:800;font-size:13px;border-radius:8px;padding:2px 8px;color:#fff}
.badge.W{background:var(--green)}.badge.L{background:var(--red)}
.game-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.game-h strong{font-size:17px}
.muted{color:var(--muted);font-size:14px}
.line{font-variant-numeric:tabular-nums;margin:8px 0;font-weight:600}
.notes{background:var(--bg);border-radius:10px;padding:10px;margin-top:8px;white-space:pre-wrap;font-size:15px}
video{width:100%;border-radius:12px;margin-top:8px;background:#000;max-height:320px}
.links a{display:inline-block;margin:6px 8px 0 0;color:var(--blue)}
.actions{display:flex;gap:8px;margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;color:var(--muted);padding:10px 0 8px;font-size:12px;font-weight:600}
nav button i{display:block;font-style:normal;font-size:22px;line-height:1.1}
nav button.on{color:var(--orange)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .big{font-size:48px}
.bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--orange);border-radius:99px}
.bar.done>div{background:var(--green)}
svg{width:100%;height:auto;display:block}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);margin:6px 0}
.chk input{width:auto}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.livehead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.bigpts{font-size:76px;font-weight:900;line-height:.9;letter-spacing:-3px;color:var(--orange)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.strip div{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center;padding:8px 2px}
.strip b{display:block;font-size:19px;font-variant-numeric:tabular-nums}.strip span{font-size:11px;color:var(--muted);font-weight:700}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.lgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.lb{height:68px;border-radius:16px;font-size:19px;background:var(--card);color:var(--ink);border:2px solid var(--line);
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.lb:active{transform:scale(.96)}
.lb.make{background:var(--green);border-color:var(--green);color:#fff}
.lb.miss{color:var(--muted)}
.lb small{display:block;font-size:11px;font-weight:600;opacity:.8}
.lastline{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 10px;min-height:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.sheet{background:var(--card);border-radius:18px;padding:14px;width:100%;max-width:440px;margin:auto}
.sheet canvas{width:100%;height:auto;border-radius:12px;display:block}
.sheet .primary{margin-top:12px}
.sheet .row{margin-top:10px}
.sheet .ghost{padding:12px}
</style>
</head>
<body>
<button id="theme" onclick="toggleTheme()" aria-label="Toggle dark mode"></button>
<main id="app"></main>
<nav id="nav"></nav>

<script>
/* ---------- theme: follows the phone until the user picks one ---------- */
function isDark(){ const t=document.documentElement.dataset.theme; return t ? t==='dark' : matchMedia('(prefers-color-scheme:dark)').matches; }
function paintTheme(){ document.getElementById('theme').textContent = isDark()?'☀️':'🌙'; }
function toggleTheme(){
  const t = isDark()?'light':'dark'; document.documentElement.dataset.theme=t;
  try{ localStorage.setItem('hooplog.theme',t); }catch(e){} paintTheme();
}
try{ const t=localStorage.getItem('hooplog.theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',paintTheme);
addEventListener('DOMContentLoaded',paintTheme);

/* ---------- storage ---------- */
const KEY = 'hooplog.v1';
let S = { profile:{name:''}, games:[], goals:[] };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
/* ?demo fills in sample data (only when the log is empty) so the app can be previewed */
if (/[?&]demo\b/.test(location.search) && !S.games.length){
  S.profile.name = 'Jaylen';
  const D = [['2026-11-03','Lincoln','W',52,41,8,4,2,1,3,3,8,1,3,0,2],['2026-11-07','Central','L',44,49,6,5,1,0,5,2,9,0,2,2,4],
    ['2026-11-12','Eastside','W',58,47,11,6,3,2,2,4,10,1,3,1,2],['2026-11-18','North','W',49,45,9,7,4,1,4,3,9,0,2,3,4],
    ['2026-11-22','West','L',40,46,7,3,2,0,6,3,12,0,4,1,2],['2026-12-02','Lincoln','W',61,50,14,6,5,2,3,5,11,2,4,2,3],
    ['2026-12-06','Central','W',55,52,16,8,4,3,2,6,12,1,3,2,2],['2026-12-13','Riverside','W',63,48,18,7,6,2,3,7,13,2,5,2,2]];
  S.games = D.map((d,i)=>({id:'d'+i,created:i,date:d[0],opponent:d[1],level:'JV',result:d[2],us:d[3],them:d[4],pts:d[5],reb:d[6],ast:d[7],stl:d[8],blk:0,tov:d[9],
    fgm:d[10],fga:d[11],tpm:d[12],tpa:d[13],ftm:d[14],fta:d[15],notes:i===7?'Best game yet. Left hand finishing is way better. Need to cut turnovers.':i===1?'Rushed shots in the 4th. Slow down.':'',links:[],videos:[]}));
  S.games.forEach(g=>{ g.pts = 2*g.fgm+g.tpm+g.ftm; });
  S.goals = [{id:'g1',metric:'pts',target:15},{id:'g2',metric:'fg',target:45},{id:'g3',metric:'ast',target:3}];
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ alert('Could not save — storage may be full.'); } }

/* videos live in IndexedDB (too big for localStorage) */
let dbp;
function db(){
  if (!dbp) dbp = new Promise((res,rej)=>{
    const r = indexedDB.open('hooplog-videos',1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('v');
    r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error);
  });
  return dbp;
}
async function vPut(id,blob){ const d=await db(); return new Promise((res,rej)=>{const t=d.transaction('v','readwrite');t.objectStore('v').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error);}); }
async function vGet(id){ const d=await db(); return new Promise((res,rej)=>{const r=d.transaction('v').objectStore('v').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}); }
async function vDel(id){ const d=await db(); return new Promise((res)=>{const t=d.transaction('v','readwrite');t.objectStore('v').delete(id);t.oncomplete=res;t.onerror=res;}); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const num = v => (v===''||v==null||isNaN(+v)) ? null : +v;
const fmtDate = s => new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const LEVELS = ['6th grade','7th grade','8th grade','Freshman','JV','Varsity','Other'];
const STATS = [['pts','Points'],['reb','Rebounds'],['ast','Assists'],['stl','Steals'],['blk','Blocks'],['tov','Turnovers']];
const GOAL_METRICS = {
  pts:{label:'Points per game',get:g=>avg(g,'pts'),unit:''},
  reb:{label:'Rebounds per game',get:g=>avg(g,'reb'),unit:''},
  ast:{label:'Assists per game',get:g=>avg(g,'ast'),unit:''},
  stl:{label:'Steals per game',get:g=>avg(g,'stl'),unit:''},
  fg:{label:'Field goal %',get:g=>pct(g,'fgm','fga'),unit:'%'},
  tp:{label:'3-point %',get:g=>pct(g,'tpm','tpa'),unit:'%'},
  ft:{label:'Free throw %',get:g=>pct(g,'ftm','fta'),unit:'%'},
};
function avg(gs,k){ const v=gs.map(g=>g[k]).filter(x=>x!=null); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; }
function pct(gs,m,a){ let M=0,A=0; gs.forEach(g=>{ if(g[a]!=null&&g[m]!=null){M+=g[m];A+=g[a];} }); return A? M/A*100 : null; }
const f1 = v => v==null ? '–' : (Math.round(v*10)/10).toString();
const fp = v => v==null ? '–' : Math.round(v)+'%';
const sorted = gs => [...gs].sort((a,b)=> a.date===b.date ? a.created-b.created : a.date<b.date?-1:1);

/* ---------- state ---------- */
let view = 'home', levelFilter = 'all', chartStat = 'pts';
let form = null; // current add/edit form state
const urls = []; // object URLs to revoke on re-render

function nav(v){ view=v; if(v==='add' && !form) form = blankForm(); render(); window.scrollTo(0,0); }

/* ---------- render ---------- */
function render(){
  urls.splice(0).forEach(u=>URL.revokeObjectURL(u));
  $('#nav').innerHTML = [['home','🏠','Home'],['live','🏀','Live'],['add','➕','Log'],['games','📋','Games'],['goals','🎯','Goals']]
    .map(([k,i,l])=>`<button class="${view===k?'on':''}" onclick="nav('${k}')"><i>${i}</i>${l}</button>`).join('');
  const el = $('#app');
  if (view==='home') el.innerHTML = homeView();
  else if (view==='add') el.innerHTML = addView();
  else if (view==='games') { el.innerHTML = gamesView(); hydrateVideos(); }
  else if (view==='live') { el.innerHTML = liveView(); if (live) keepAwake(); }
  else el.innerHTML = goalsView();
  if (view==='home') drawChart();
}

/* ----- HOME ----- */
function filtered(){ return sorted(S.games.filter(g=> levelFilter==='all' || g.level===levelFilter)); }
function homeView(){
  const gs = filtered();
  const name = S.profile.name;
  const levels = [...new Set(S.games.map(g=>g.level).filter(Boolean))];
  let h = `<h1>${name?`Hey ${esc(name)} 👋`:'Hoop Log'}</h1><p class="sub">Your stats. Your progress. Only you see this.</p>`;
  if (!name) h += `<div class="card"><label style="margin-top:0">What's your name?</label>
    <div class="row"><input id="nm" placeholder="First name" maxlength="30"><button class="ghost" style="flex:0 0 auto" onclick="setName()">Save</button></div></div>`;
  if (!S.games.length) return h + `<div class="empty"><div class="big">🏀</div><p><b>No games yet.</b><br>Log your first game to start tracking.</p>
    <button class="primary" onclick="nav('add')">Add a game</button></div>${dataCard()}`;
  if (levels.length>1) h += `<select onchange="levelFilter=this.value;render()" style="margin-bottom:12px">
    <option value="all">All levels</option>${levels.map(l=>`<option ${l===levelFilter?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const w = gs.filter(g=>g.result==='W').length, l = gs.filter(g=>g.result==='L').length;
  h += `<div class="grid">
    <div class="tile"><b>${gs.length}</b><span>Games</span></div>
    <div class="tile"><b>${w}-${l}</b><span>Record</span></div>
    <div class="tile"><b>${f1(avg(gs,'pts'))}</b><span>PPG</span></div>
    <div class="tile"><b>${f1(avg(gs,'reb'))}</b><span>RPG</span></div>
    <div class="tile"><b>${f1(avg(gs,'ast'))}</b><span>APG</span></div>
    <div class="tile"><b>${f1(avg(gs,'stl'))}</b><span>SPG</span></div>
    <div class="tile"><b>${fp(pct(gs,'fgm','fga'))}</b><span>FG%</span></div>
    <div class="tile"><b>${fp(pct(gs,'tpm','tpa'))}</b><span>3P%</span></div>
    <div class="tile"><b>${fp(pct(gs,'ftm','fta'))}</b><span>FT%</span></div></div>`;
  h += `<button class="primary" style="margin-top:12px" onclick="openShare('season')">📤 Share my season</button>`;
  h += `<h2>Progress</h2><div class="card">
    <select onchange="chartStat=this.value;render()">${STATS.map(([k,n])=>`<option value="${k}" ${k===chartStat?'selected':''}>${n} per game</option>`).join('')}</select>
    <div id="chart" style="margin-top:10px"></div>${trendNote(gs)}</div>`;
  return h + dataCard();
}
function trendNote(gs){
  if (gs.length<4) return `<p class="hint">Log a few more games to see your trend.</p>`;
  const last = gs.slice(-3), prev = gs.slice(0,-3);
  const a = avg(last,chartStat), b = avg(prev,chartStat);
  if (a==null||b==null) return '';
  const d = a-b, name = STATS.find(s=>s[0]===chartStat)[1].toLowerCase();
  const good = chartStat==='tov' ? d<0 : d>0;
  return `<p style="margin:10px 0 0">${Math.abs(d)<0.05?'➡️ Holding steady':good?'📈 Trending up':'📉 Down a bit'}: last 3 games avg <b>${f1(a)}</b> ${name} vs <b>${f1(b)}</b> before.</p>`;
}
function drawChart(){
  const box = $('#chart'); if(!box) return;
  const pts = filtered().map((g,i)=>({i,v:g[chartStat],g})).filter(p=>p.v!=null).slice(-15);
  if (pts.length<2){ box.innerHTML = `<p class="hint">Need at least 2 games with this stat to draw a chart.</p>`; return; }
  const W=320,H=150,P=24, max=Math.max(...pts.map(p=>p.v),1), n=pts.length;
  const x=i=>P+(W-2*P)*(n===1?0:i/(n-1)), y=v=>H-P-(H-2*P)*(v/max);
  const path = pts.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.v)}`).join(' ');
  const mean = pts.reduce((a,p)=>a+p.v,0)/n;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${chartStat} per game">
    <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/>
    <line x1="${P}" x2="${W-P}" y1="${y(mean)}" y2="${y(mean)}" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".6"/>
    <text x="${P}" y="${y(mean)+12}" text-anchor="start" font-size="9" fill="var(--muted)">avg ${f1(mean)}</text>
    <path d="${path}" fill="none" stroke="var(--orange)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" fill="${p.g.result==='W'?'var(--green)':'var(--red)'}" stroke="var(--card)" stroke-width="2"/>
      <text x="${x(i)}" y="${y(p.v)-9}" text-anchor="middle" font-size="10" fill="var(--ink)">${p.v}</text>`).join('')}
  </svg><p class="hint">Green dot = win, red dot = loss. Last ${n} games.</p>`;
}
function setName(){ const v=$('#nm').value.trim(); if(!v) return; S.profile.name=v; save(); render(); }

/* ----- backup ----- */
function dataCard(){
  return `<h2>Your data</h2><div class="card"><p class="muted" style="margin-top:0">Everything is saved on this device only. Download a backup so you never lose it.</p>
  <div class="actions"><button class="ghost" onclick="exportData()">⬇️ Backup</button>
  <button class="ghost" onclick="$('#imp').click()">⬆️ Restore</button>
  <input id="imp" type="file" accept="application/json" hidden onchange="importData(this)"></div>
  <p class="hint">Backups include stats and notes, not video files.</p></div>`;
}
function exportData(){
  const b = new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`hoop-log-backup-${today()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  f.text().then(t=>{
    const d = JSON.parse(t);
    if(!Array.isArray(d.games)) throw 0;
    if(!confirm(`Replace what's on this device with the backup (${d.games.length} games)?`)) return;
    S = {profile:d.profile||{name:''},games:d.games,goals:d.goals||[]}; save(); render();
  }).catch(()=>alert("That file doesn't look like a Hoop Log backup."));
}

/* ----- ADD / EDIT ----- */
function blankForm(){ return {id:null,date:today(),opponent:'',level:S.games.length?S.games[S.games.length-1].level:'Freshman',result:'',us:'',them:'',
  pts:'',reb:'',ast:'',stl:'',blk:'',tov:'',fgm:'',fga:'',tpm:'',tpa:'',ftm:'',fta:'',notes:'',links:[],keepVideos:[],newFiles:[],ptsTouched:false}; }
function editGame(id){
  const g = S.games.find(x=>x.id===id); if(!g) return;
  form = blankForm();
  for (const k of ['date','opponent','level','result','pts','reb','ast','stl','blk','tov','fgm','fga','tpm','tpa','ftm','fta','notes'])
    form[k] = g[k]==null ? '' : g[k];
  form.us = g.us ?? ''; form.them = g.them ?? ''; form.id = id; form.links=[...(g.links||[])]; form.keepVideos=[...(g.videos||[])]; form.ptsTouched=true;
  nav('add');
}
function addView(){
  const f = form, n = (k,l,ph='')=>`<div><label>${l}</label><input type="number" inputmode="numeric" min="0" id="f_${k}" value="${esc(f[k])}" placeholder="${ph}" oninput="fld('${k}',this.value)"></div>`;
  return `<h1>${f.id?'Edit game':'Add a game'}</h1><p class="sub">Takes about 30 seconds. Leave blank anything you didn't track.</p>
  <div class="card"><div class="row"><div><label style="margin-top:0">Date</label><input type="date" id="f_date" value="${f.date}" oninput="fld('date',this.value)"></div>
    <div><label style="margin-top:0">Level</label><select id="f_level" onchange="fld('level',this.value)">${LEVELS.map(l=>`<option ${l===f.level?'selected':''}>${l}</option>`).join('')}</select></div></div>
    <label>Opponent</label><input id="f_opponent" value="${esc(f.opponent)}" placeholder="Who did you play?" maxlength="40" oninput="fld('opponent',this.value)">
    <label>Result</label><div class="seg"><button class="w ${f.result==='W'?'on':''}" onclick="setResult('W')">Win</button><button class="l ${f.result==='L'?'on':''}" onclick="setResult('L')">Loss</button></div>
    <div class="row" style="margin-top:4px">${n('us','Your team score')}${n('them','Their score')}</div></div>
  <h2>Your stats</h2><div class="card"><div class="row3">${n('pts','Points')}${n('reb','Rebounds')}${n('ast','Assists')}${n('stl','Steals')}${n('blk','Blocks')}${n('tov','Turnovers')}</div></div>
  <h2>Shooting</h2><div class="card"><div class="row"><div>${n('fgm','FG made')}</div><div>${n('fga','FG attempted')}</div></div>
    <div class="row">${n('tpm','3PT made')}${n('tpa','3PT attempted')}</div><div class="row">${n('ftm','FT made')}${n('fta','FT attempted')}</div>
    <p class="hint">FG includes your 3s. Points fill in automatically from shooting until you type your own.</p></div>
  <h2>Notes</h2><div class="card"><textarea id="f_notes" placeholder="What went well? What do you need to work on?" oninput="fld('notes',this.value)">${esc(f.notes)}</textarea></div>
  <h2>Video</h2><div class="card">
    ${f.keepVideos.map(id=>`<div class="chk">🎥 Saved clip <button class="ghost danger" onclick="dropVideo('${id}')">Remove</button></div>`).join('')}
    ${f.newFiles.map((x,i)=>`<div class="chk">🎥 ${esc(x.name)} <button class="ghost danger" onclick="dropNew(${i})">Remove</button></div>`).join('')}
    <button class="ghost" onclick="$('#vid').click()">📹 Add video from phone</button>
    <input id="vid" type="file" accept="video/*" multiple hidden onchange="pickVideos(this)">
    <label>Or paste a link (YouTube, Hudl, Drive…)</label>
    <div class="row"><input id="lnk" placeholder="https://" inputmode="url"><button class="ghost" style="flex:0 0 auto" onclick="addLink()">Add</button></div>
    ${f.links.map((u,i)=>`<div class="chk">🔗 <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u)}</span><button class="ghost danger" onclick="dropLink(${i})">✕</button></div>`).join('')}
  </div>
  <button class="primary" onclick="saveGame()">${f.id?'Save changes':'Save game'}</button>
  ${f.id?`<button class="ghost" style="width:100%;margin-top:10px" onclick="form=null;nav('games')">Cancel</button>`:''}`;
}
function fld(k,v){
  form[k]=v;
  if (k==='pts') form.ptsTouched = v!=='';
  if (['fgm','tpm','ftm'].includes(k) && !form.ptsTouched){
    const fg=num(form.fgm), tp=num(form.tpm), ft=num(form.ftm);
    if (fg!=null||ft!=null){ form.pts = String(2*(fg||0)+(tp||0)+(ft||0)); const el=$('#f_pts'); if(el) el.value=form.pts; }
  }
}
function setResult(r){ form.result=r; document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.classList.contains(r.toLowerCase()))); }
function pickVideos(inp){ form.newFiles.push(...inp.files); inp.value=''; render(); }
function dropNew(i){ form.newFiles.splice(i,1); render(); }
function dropVideo(id){ form.keepVideos=form.keepVideos.filter(x=>x!==id); form.removed=(form.removed||[]).concat(id); render(); }
function addLink(){ let v=$('#lnk').value.trim(); if(!v) return; if(!/^https?:\/\//i.test(v)) v='https://'+v; form.links.push(v); render(); }
function dropLink(i){ form.links.splice(i,1); render(); }

async function saveGame(){
  const f = form;
  if (!f.date) return alert('Pick a date.');
  if (!f.result) return alert('Was it a win or a loss?');
  const ids = [...f.keepVideos];
  try { for (const file of f.newFiles){ const id=uid(); await vPut(id,file); ids.push(id); } }
  catch(e){ return alert('Could not save a video — your phone may be out of space.'); }
  const g = { id:f.id||uid(), created:Date.now(), date:f.date, opponent:f.opponent.trim(), level:f.level, result:f.result,
    us:num(f.us), them:num(f.them), notes:f.notes.trim(), links:f.links, videos:ids };
  ['pts','reb','ast','stl','blk','tov','fgm','fga','tpm','tpa','ftm','fta'].forEach(k=>g[k]=num(f[k]));
  if (f.id){ const old=S.games.find(x=>x.id===f.id); g.created=old.created; S.games[S.games.indexOf(old)]=g; for (const id of f.removed||[]) await vDel(id); }
  else S.games.push(g);
  save(); form=null; view='games'; render(); window.scrollTo(0,0);
}

/* ----- GAMES ----- */
function gamesView(){
  if (!S.games.length) return `<h1>Games</h1><div class="empty"><div class="big">📋</div><p>Nothing here yet.</p><button class="primary" onclick="nav('add')">Add a game</button></div>`;
  const gs = sorted(S.games).reverse();
  return `<h1>Games</h1><p class="sub">${gs.length} logged</p>` + gs.map(g=>{
    const stats = [g.pts!=null&&`${g.pts} PTS`, g.reb!=null&&`${g.reb} REB`, g.ast!=null&&`${g.ast} AST`, g.stl!=null&&`${g.stl} STL`, g.blk!=null&&`${g.blk} BLK`, g.tov!=null&&`${g.tov} TO`].filter(Boolean).join(' · ');
    const shoot = [g.fga!=null&&`FG ${g.fgm??0}/${g.fga}`, g.tpa!=null&&`3P ${g.tpm??0}/${g.tpa}`, g.fta!=null&&`FT ${g.ftm??0}/${g.fta}`].filter(Boolean).join(' · ');
    return `<div class="card"><div class="game-h"><div><strong>${g.opponent?'vs '+esc(g.opponent):'Game'}</strong><div class="muted">${fmtDate(g.date)} · ${esc(g.level||'')}</div></div>
      <div style="text-align:right"><span class="badge ${g.result}">${g.result}</span>${g.us!=null&&g.them!=null?`<div class="muted">${g.us}–${g.them}</div>`:''}</div></div>
      ${stats?`<div class="line">${stats}</div>`:''}${shoot?`<div class="muted">${shoot}</div>`:''}
      ${g.notes?`<div class="notes">${esc(g.notes)}</div>`:''}
      ${(g.videos||[]).map(id=>`<video controls playsinline preload="metadata" data-vid="${id}"></video>`).join('')}
      ${(g.links||[]).length?`<div class="links">${g.links.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(u.replace(/^https?:\/\/(www\.)?/,'').slice(0,34))}</a>`).join('')}</div>`:''}
      <div class="actions"><button class="ghost" onclick="openShare('game','${g.id}')">📤 Share</button><button class="ghost" onclick="editGame('${g.id}')">Edit</button><button class="ghost danger" onclick="delGame('${g.id}')">Delete</button></div></div>`;
  }).join('');
}
async function hydrateVideos(){
  for (const v of document.querySelectorAll('video[data-vid]')){
    try { const b = await vGet(v.dataset.vid); if (b){ const u=URL.createObjectURL(b); urls.push(u); v.src=u; } else v.remove(); } catch(e){ v.remove(); }
  }
}
async function delGame(id){
  const g = S.games.find(x=>x.id===id); if(!g||!confirm('Delete this game? This can’t be undone.')) return;
  for (const v of g.videos||[]) await vDel(v);
  S.games = S.games.filter(x=>x.id!==id); save(); render();
}

/* ----- GOALS ----- */
function goalsView(){
  const gs = sorted(S.games);
  let h = `<h1>Goals</h1><p class="sub">Pick a target and watch your season numbers move toward it.</p>`;
  if (!S.goals.length) h += `<div class="empty"><div class="big">🎯</div><p>No goals yet. Try “shoot 40% from the field” or “average 8 points.”</p></div>`;
  h += S.goals.map(go=>{
    const m = GOAL_METRICS[go.metric], cur = m.get(gs), p = cur==null?0:Math.min(100,cur/go.target*100), done = cur!=null&&cur>=go.target;
    return `<div class="card"><div class="game-h"><strong>${m.label}</strong><button class="ghost danger" onclick="delGoal('${go.id}')">✕</button></div>
      <div class="line">${cur==null?'No data yet':f1(cur)+m.unit} <span class="muted">/ goal ${go.target}${m.unit}</span> ${done?'✅':''}</div>
      <div class="bar ${done?'done':''}"><div style="width:${p}%"></div></div></div>`;
  }).join('');
  h += `<h2>New goal</h2><div class="card"><label style="margin-top:0">I want to improve my…</label>
    <select id="gm">${Object.entries(GOAL_METRICS).map(([k,m])=>`<option value="${k}">${m.label}</option>`).join('')}</select>
    <label>Target</label><input id="gt" type="number" inputmode="decimal" min="0" placeholder="e.g. 10 or 40">
    <button class="primary" style="margin-top:14px" onclick="addGoal()">Add goal</button></div>`;
  return h;
}
function addGoal(){ const t=num($('#gt').value); if(!t||t<=0) return alert('Enter a target number.'); S.goals.push({id:uid(),metric:$('#gm').value,target:t}); save(); render(); }
function delGoal(id){ S.goals=S.goals.filter(g=>g.id!==id); save(); render(); }

/* ----- LIVE TRACKER: tap during the game (or replay it afterwards), then it fills in the log form ----- */
let live = null, wake = null;
try { live = JSON.parse(localStorage.getItem('hooplog.live')); } catch(e){}
if (live && Array.isArray(live.ev)) view = 'live'; else live = null; // reopen mid-game on the tracker
function saveLive(){ try { live ? localStorage.setItem('hooplog.live',JSON.stringify(live)) : localStorage.removeItem('hooplog.live'); } catch(e){} }
const EVT = {m2:'+2',x2:'Missed 2',m3:'+3',x3:'Missed 3',mf:'+1 free throw',xf:'Missed free throw',reb:'Rebound',ast:'Assist',stl:'Steal',blk:'Block',tov:'Turnover'};
function tally(ev){
  const c={}; ev.forEach(e=>c[e]=(c[e]||0)+1); const g=k=>c[k]||0;
  return { reb:g('reb'),ast:g('ast'),stl:g('stl'),blk:g('blk'),tov:g('tov'), pts:2*g('m2')+3*g('m3')+g('mf'),
    fgm:g('m2')+g('m3'), fga:g('m2')+g('x2')+g('m3')+g('x3'), tpm:g('m3'), tpa:g('m3')+g('x3'), ftm:g('mf'), fta:g('mf')+g('xf') };
}
async function keepAwake(){ try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>wake=null); } } catch(e){} }
function liveView(){
  if (!live) {
    const lastLevel = S.games.length ? S.games[S.games.length-1].level : 'Freshman';
    return `<h1>Live tracker</h1><p class="sub">Tap during the game — or have a friend or parent do it. Missed the game? Replay it from memory afterwards.</p>
    <div class="card"><label style="margin-top:0">Opponent</label><input id="lo" placeholder="Who are you playing?" maxlength="40">
    <label>Level</label><select id="ll">${LEVELS.map(l=>`<option ${l===lastLevel?'selected':''}>${l}</option>`).join('')}</select>
    <button class="primary" style="margin-top:14px" onclick="startLive()">▶ Start tracking</button></div>
    <p class="hint">Keeps your screen on while tracking. Your tally is saved as you go, so closing the app won’t lose it.</p>`;
  }
  const t = tally(live.ev), last = live.ev.length ? EVT[live.ev[live.ev.length-1]] : '';
  const b = (k,cls,main,sub)=>`<button class="lb ${cls}" onclick="tap('${k}')">${main}${sub?`<small>${sub}</small>`:''}</button>`;
  return `<div class="livehead"><div><div class="muted">${live.opp?'vs '+esc(live.opp):'Live game'} · ${esc(live.level)}</div><div class="bigpts">${t.pts}</div><div class="muted" style="font-weight:700">POINTS</div></div>
      <button class="ghost" onclick="undo()" ${live.ev.length?'':'disabled'}>↩ Undo</button></div>
    <div class="strip"><div><b>${t.reb}</b><span>REB</span></div><div><b>${t.ast}</b><span>AST</span></div><div><b>${t.stl}</b><span>STL</span></div><div><b>${t.tov}</b><span>TO</span></div>
      <div><b>${t.fgm}/${t.fga}</b><span>FG</span></div><div><b>${t.tpm}/${t.tpa}</b><span>3PT</span></div><div><b>${t.ftm}/${t.fta}</b><span>FT</span></div><div><b>${t.blk}</b><span>BLK</span></div></div>
    <div class="lastline">${last?'Last: '+last:'Tap what just happened'}</div>
    <div class="lgrid">${b('m2','make','+2','made')}${b('x2','miss','Miss','2-pointer')}${b('m3','make','+3','made')}${b('x3','miss','Miss','3-pointer')}${b('mf','make','+1','free throw')}${b('xf','miss','Miss','free throw')}</div>
    <div class="lgrid3">${b('reb','','Reb')}${b('ast','','Ast')}${b('stl','','Stl')}${b('blk','','Blk')}${b('tov','','TO')}</div>
    <button class="primary" onclick="finishLive()">🏁 Finish game</button>
    <button class="ghost" style="width:100%;margin-top:10px" onclick="cancelLive()">Cancel this game</button>`;
}
function startLive(){ live = {opp:$('#lo').value.trim(), level:$('#ll').value, ev:[]}; saveLive(); render(); }
function tap(k){ live.ev.push(k); saveLive(); try{navigator.vibrate&&navigator.vibrate(12);}catch(e){} render(); }
function undo(){ live.ev.pop(); saveLive(); render(); }
function cancelLive(){ if (live.ev.length && !confirm('Throw away this tally?')) return; live=null; saveLive(); if(wake){wake.release();} render(); }
function finishLive(){
  if (!live.ev.length && !confirm('Nothing tracked yet. Finish anyway?')) return;
  const t = tally(live.ev); form = blankForm(); form.opponent=live.opp; form.level=live.level; form.ptsTouched=true;
  for (const k of ['pts','reb','ast','stl','blk','tov','fgm','fga','tpm','tpa','ftm','fta']) form[k]=String(t[k]);
  live=null; saveLive(); if(wake){wake.release();} nav('add');
}

/* ----- SHARING (no server: image card + phone's share menu) ----- */
let shareCtx = null;
function gameShare(g){
  const nm = S.profile.name, stats = [['pts','PTS'],['reb','REB'],['ast','AST'],['stl','STL'],['blk','BLK'],['tov','TO']].filter(([k])=>g[k]!=null);
  const big = stats.slice(0,6).map(([k,l])=>[g[k],l]);
  const lines = [g.fga!=null&&`FG ${g.fgm??0}/${g.fga}`, g.tpa!=null&&`3PT ${g.tpm??0}/${g.tpa}`, g.fta!=null&&`FT ${g.ftm??0}/${g.fta}`].filter(Boolean);
  const score = g.us!=null&&g.them!=null ? ` ${g.us}–${g.them}` : '';
  return { title: nm||'Game recap', sub: `${g.opponent?'vs '+g.opponent+' · ':''}${fmtDate(g.date)}`, badge:g.result, scoreLine: score.trim(), bigs:big, lines,
    text: `🏀 ${nm?nm+' — ':''}${g.result==='W'?'W':'L'}${score}${g.opponent?' vs '+g.opponent:''} (${fmtDate(g.date)})\n${stats.map(([k,l])=>g[k]+' '+l).join(' · ')}${lines.length?'\n'+lines.join(' · '):''}\nTracked with Hoop Log`,
    videos: g.videos||[] };
}
function seasonShare(){
  const gs = filtered(), nm = S.profile.name, w=gs.filter(g=>g.result==='W').length, l=gs.length-w;
  const lvl = levelFilter==='all' ? 'Season stats' : levelFilter+' season';
  const bigs = [[f1(avg(gs,'pts')),'PPG'],[f1(avg(gs,'reb')),'RPG'],[f1(avg(gs,'ast')),'APG'],[f1(avg(gs,'stl')),'SPG'],[fp(pct(gs,'fgm','fga')),'FG%'],[fp(pct(gs,'tpm','tpa')),'3P%']];
  return { title: nm||'My season', sub: `${lvl} · ${gs.length} games`, badge:'', scoreLine:`${w}-${l} record`, bigs, lines:[],
    text:`🏀 ${nm?nm+' — ':''}${lvl}: ${w}-${l} in ${gs.length} games\n${bigs.map(([v,k])=>v+' '+k).join(' · ')}\nTracked with Hoop Log`, videos:[] };
}
function rr(x,a,b,w,h,r){ x.beginPath(); x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h); }
function cardCanvas(o){
  const c=document.createElement('canvas'); c.width=1080; c.height=1350; const x=c.getContext('2d');
  const gr=x.createLinearGradient(0,0,1080,1350); gr.addColorStop(0,'#ff8a3d'); gr.addColorStop(1,'#c2410c'); x.fillStyle=gr; x.fillRect(0,0,1080,1350);
  x.fillStyle='rgba(0,0,0,.12)'; x.beginPath(); x.arc(980,120,340,0,7); x.fill();
  const font=(s,w='800')=>x.font=`${w} ${s}px system-ui,-apple-system,Segoe UI,Roboto,sans-serif`;
  x.fillStyle='#fff'; x.textBaseline='alphabetic';
  font(30,'700'); x.globalAlpha=.85; x.fillText('HOOP LOG',70,100); x.globalAlpha=1;
  let t=o.title, size=96; font(size); while(x.measureText(t).width>(o.badge?760:940)&&size>40){size-=4;font(size);} x.fillText(t,70,210);
  font(40,'600'); x.globalAlpha=.9; x.fillText(o.sub.slice(0,44),70,275); x.globalAlpha=1;
  if (o.badge){ x.fillStyle=o.badge==='W'?'#1e9e5a':'#d8403a'; x.beginPath(); x.arc(930,170,80,0,7); x.fill(); x.fillStyle='#fff'; font(96); x.textAlign='center'; x.fillText(o.badge,930,205); x.textAlign='left'; }
  font(64); x.fillStyle='#fff'; x.fillText(o.scoreLine,70,380);
  const cols=3, bw=300, bh=270, gap=30, sx=(1080-(cols*bw+(cols-1)*gap))/2;
  o.bigs.forEach(([v,l],i)=>{
    const cx=sx+(i%cols)*(bw+gap), cy=440+Math.floor(i/cols)*(bh+gap);
    x.fillStyle='rgba(255,255,255,.18)'; rr(x,cx,cy,bw,bh,36); x.fill();
    x.fillStyle='#fff'; x.textAlign='center'; font(130); x.fillText(String(v),cx+bw/2,cy+150); font(40,'700'); x.globalAlpha=.85; x.fillText(l,cx+bw/2,cy+215); x.globalAlpha=1; x.textAlign='left';
  });
  if (o.lines.length){ font(48,'700'); x.textAlign='center'; x.fillText(o.lines.join('   ·   '),540,1085); x.textAlign='left'; }
  font(30,'600'); x.globalAlpha=.7; x.textAlign='center'; x.fillText('Tracked with Hoop Log 🏀',540,1290); x.textAlign='left'; x.globalAlpha=1;
  return c;
}
function openShare(kind,id){
  const o = kind==='game' ? gameShare(S.games.find(g=>g.id===id)) : seasonShare();
  const c = cardCanvas(o); shareCtx={o,c};
  const m = document.createElement('div'); m.className='modal'; m.id='shm'; m.onclick=e=>{ if(e.target===m) closeShare(); };
  m.innerHTML = `<div class="sheet"><div id="shc"></div>
    <button class="primary" onclick="doShare()">📤 Share</button>
    <div class="row"><button class="ghost" onclick="saveCard()">⬇️ Save image</button><button class="ghost" onclick="copyText()">📋 Copy text</button></div>
    ${o.videos.map((v,i)=>`<button class="ghost" style="width:100%;margin-top:10px" onclick="shareVideo('${v}')">🎥 Share video${o.videos.length>1?' '+(i+1):''}</button>`).join('')}
    <p class="hint">You choose who gets it. Notes stay private — they're never included. Nothing is uploaded anywhere.</p>
    <button class="ghost" style="width:100%" onclick="closeShare()">Close</button></div>`;
  document.body.appendChild(m); $('#shc').appendChild(c);
}
function closeShare(){ const m=$('#shm'); if(m) m.remove(); shareCtx=null; }
function cardBlob(){ return new Promise(r=>shareCtx.c.toBlob(r,'image/png')); }
async function doShare(){
  const {o}=shareCtx;
  try {
    const file = new File([await cardBlob()],'hoop-log.png',{type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[file]})) return await navigator.share({files:[file],text:o.text});
    if (navigator.share) return await navigator.share({text:o.text});
  } catch(e){ if (e && e.name==='AbortError') return; }
  await copyText('Sharing isn’t available here, so the text was copied. Paste it into a message — or save the image.');
}
async function shareVideo(id){
  try {
    const b = await vGet(id); if(!b) return alert('Video not found.');
    const ext = (b.type.split('/')[1]||'mp4').replace('quicktime','mov');
    const file = new File([b],'clip.'+ext,{type:b.type});
    if (navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file]});
    else alert('Your browser can’t share video files directly. Try it from your phone, or send the clip from your camera roll.');
  } catch(e){ if(!e||e.name!=='AbortError') alert('Couldn’t share that video.'); }
}
function saveCard(){ cardBlob().then(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='hoop-log.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }); }
async function copyText(msg){
  const text = shareCtx.o.text;
  try { await navigator.clipboard.writeText(text); alert(typeof msg==='string'?msg:'Copied!'); }
  catch(e){ prompt('Copy this:',text); }
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeShare(); });

render();
</script>
</body>
</html>
